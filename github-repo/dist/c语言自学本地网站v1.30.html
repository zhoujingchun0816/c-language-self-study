:root {
  --color-scheme: dark;
  --bg: #5A8CD7;
  --surface: #315995;
  --surface-2: #294f88;
  --page-text: #08162e;
  --text: #ffffff;
  --muted: #dce8fa;
  --border: #9cbdeb;
  --accent: #ffe08a;
  --accent-strong: #fff0b8;
  --accent-soft: #264879;
  --on-accent: #08162e;
  --danger: #ffd0d9;
  --difficulty-1: #9aebc4;
  --difficulty-2: #ffe0a3;
  --difficulty-3: #ffd0d9;
  --code-bg: #0b1d3a;
  --code-text: #f7faff;
  --mark: #ffe08a;
  --mark-text: #08162e;
  --shadow: 0 14px 38px rgba(8, 22, 46, 0.34);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}

:root[data-theme="light"] {
  --color-scheme: light;
  --bg: #ffffff;
  --surface: #ffffff;
  --surface-2: #f4f6fb;
  --page-text: #131c2e;
  --text: #131c2e;
  --muted: #5c6980;
  --border: #d3dcee;
  --accent: #1d4ed8;
  --accent-strong: #1a3fa8;
  --accent-soft: #e2e9fd;
  --on-accent: #ffffff;
  --danger: #b33a50;
  --difficulty-1: #16845a;
  --difficulty-2: #a65e00;
  --difficulty-3: #b33a50;
  --code-bg: #0f1a30;
  --code-text: #e7eefc;
  --mark: #ffe08a;
  --mark-text: #29220b;
  --shadow: 0 14px 35px rgba(19, 40, 90, 0.10);
}

:root[data-theme="blue"] {
  --color-scheme: dark;
  --bg: #5A8CD7;
  --surface: #315995;
  --surface-2: #294f88;
  --page-text: #08162e;
  --text: #ffffff;
  --muted: #dce8fa;
  --border: #9cbdeb;
  --accent: #ffe08a;
  --accent-strong: #fff0b8;
  --accent-soft: #264879;
  --on-accent: #08162e;
  --danger: #ffd0d9;
  --difficulty-1: #9aebc4;
  --difficulty-2: #ffe0a3;
  --difficulty-3: #ffd0d9;
  --code-bg: #0b1d3a;
  --code-text: #f7faff;
  --mark: #ffe08a;
  --mark-text: #08162e;
  --shadow: 0 14px 38px rgba(8, 22, 46, 0.34);
}

:root[data-theme="dark"] {
  --color-scheme: dark;
  --bg: #0d0d0d;
  --surface: #1a1a1a;
  --surface-2: #232323;
  --page-text: #f2f2f2;
  --text: #f2f2f2;
  --muted: #b0b0b0;
  --border: #3a3a3a;
  --accent: #e8e8e8;
  --accent-strong: #ffffff;
  --accent-soft: #2a2a2a;
  --on-accent: #101010;
  --danger: #d8d8d8;
  --difficulty-1: #d0d0d0;
  --difficulty-2: #b4b4b4;
  --difficulty-3: #a0a0a0;
  --code-bg: #050505;
  --code-text: #ececec;
  --mark: #4a4a4a;
  --mark-text: #f2f2f2;
  --shadow: 0 14px 38px rgba(0, 0, 0, 0.48);
}

* { box-sizing: border-box; }

/* hidden 属性必须能压过组件自己的 display（否则 .chat-panel/display:flex 之类会让 hidden 失效） */
[hidden] { display: none !important; }

html { min-width: 0; color-scheme: var(--color-scheme); }

body {
  min-width: 0;
  min-height: 100vh;
  margin: 0;
  overflow-x: hidden;
  background: var(--bg);
  color: var(--page-text);
}

button, input, select { font: inherit; }

button { cursor: pointer; }

.site-header {
  border-bottom: 1px solid var(--border);
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  color: var(--text);
}

.header-inner {
  width: min(1280px, 100%);
  margin: 0 auto;
  padding: 24px clamp(16px, 4vw, 40px);
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 28px;
}

.eyebrow {
  margin: 0 0 4px;
  color: var(--accent);
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.16em;
}

h1 { margin: 0; font-size: clamp(1.65rem, 3vw, 2.3rem); letter-spacing: -0.04em; }
.subtitle { margin: 6px 0 0; color: var(--muted); }
.course-links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.course-link {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 40px;
  padding: 8px 12px;
  border: 1px solid color-mix(in srgb, var(--accent) 45%, var(--border));
  border-radius: 10px;
  background: var(--accent-soft);
  color: var(--accent-strong);
  font-size: 0.86rem;
  font-weight: 750;
  text-decoration: none;
}
.course-link:hover, .course-link:focus-visible { border-color: var(--accent); }

.theme-slider {
  --theme-index: 1;
  position: relative;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  width: 210px;
  padding: 3px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--accent-soft);
  isolation: isolate;
}

.theme-slider-thumb {
  position: absolute;
  z-index: 0;
  top: 3px;
  bottom: 3px;
  left: 3px;
  width: calc((100% - 6px) / 3);
  border: 1px solid var(--border);
  border-radius: 9px;
  background: var(--surface);
  transform: translateX(calc(var(--theme-index, 1) * 100%));
  transition: transform 320ms cubic-bezier(0.34, 1.56, 0.64, 1);
}

.theme-slider button {
  position: relative;
  z-index: 1;
  min-width: 0;
  min-height: 40px;
  padding: 6px 8px;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: var(--muted);
  font-size: 0.82rem;
  white-space: nowrap;
}

.theme-slider button[aria-checked="true"] { color: var(--accent-strong); font-weight: 800; }
.theme-slider button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

@media (prefers-reduced-motion: reduce) {
  .theme-slider-thumb { transition: none; }
}

.search-wrap { position: relative; width: min(520px, 48vw); flex: 0 1 520px; }
.search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-52%); color: var(--muted); font-size: 1.4rem; }

#search-input {
  width: 100%;
  min-height: 50px;
  padding: 10px 48px 10px 43px;
  border: 1px solid var(--border);
  border-radius: 14px;
  outline: none;
  background: var(--surface);
  color: var(--text);
  box-shadow: 0 4px 16px color-mix(in srgb, var(--text) 5%, transparent);
}

#search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.search-shortcut { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); }
kbd { border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 5px; padding: 1px 6px; background: var(--surface-2); color: var(--muted); font-size: 0.76rem; }

.app-shell {
  width: min(1280px, 100%);
  min-height: calc(100vh - 125px);
  margin: 0 auto;
  padding: 24px clamp(16px, 4vw, 40px) 40px;
  display: grid;
  grid-template-columns: minmax(250px, 340px) minmax(0, 1fr);
  gap: 24px;
}

.sidebar, .detail-panel {
  min-width: 0;
  border: 1px solid var(--border);
  border-radius: 18px;
  background: var(--surface);
  color: var(--text);
  box-shadow: var(--shadow);
}

.sidebar { padding: 16px; align-self: start; }
.filter-row { display: flex; align-items: center; gap: 10px; }
.filter-row + .filter-row { margin-top: 10px; }
.filter-row label { color: var(--muted); font-size: 0.9rem; font-weight: 700; }

.filter-row select {
  min-width: 0;
  flex: 1;
  padding: 8px 10px;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: var(--surface);
  color: var(--text);
}

.stage-directory { margin-top: 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-2); }
.stage-directory summary { padding: 8px 10px; color: var(--accent-strong); font-size: 0.82rem; font-weight: 750; cursor: pointer; }
.stage-directory-list { display: grid; gap: 4px; max-height: 210px; padding: 0 7px 8px; overflow-y: auto; }
.stage-directory-button { padding: 6px 8px; border: 0; border-radius: 7px; background: transparent; color: var(--text); text-align: left; font-size: 0.76rem; }
.stage-directory-button:hover, .stage-directory-button:focus-visible { background: var(--accent-soft); color: var(--accent-strong); }

.practice-sites { min-width: 0; margin-top: 12px; padding: 9px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-2); }
.practice-sites h2 { margin: 0 0 7px; color: var(--accent-strong); font-size: 0.82rem; }
.practice-site-links { display: flex; min-width: 0; flex-wrap: wrap; gap: 7px; }
.practice-site-links a {
  display: inline-flex;
  min-width: 0;
  min-height: 40px;
  flex: 1 1 120px;
  align-items: center;
  justify-content: center;
  padding: 7px 9px;
  border: 1px solid color-mix(in srgb, var(--accent) 40%, var(--border));
  border-radius: 8px;
  background: var(--surface);
  color: var(--accent-strong);
  font-size: 0.78rem;
  font-weight: 750;
  text-align: center;
  text-decoration: none;
}
.practice-site-links a:hover, .practice-site-links a:focus-visible { border-color: var(--accent); background: var(--accent-soft); }

.result-count { margin: 13px 2px 10px; color: var(--muted); font-size: 0.83rem; }
.result-list { display: grid; gap: 7px; max-height: calc(100vh - 250px); margin: 0; padding: 0; overflow-y: auto; list-style: none; }

.result-item button {
  width: 100%;
  padding: 11px 12px;
  border: 1px solid transparent;
  border-radius: 10px;
  text-align: left;
  background: transparent;
  color: var(--text);
}

.result-item button:hover { background: var(--surface-2); }
.result-item.is-selected button { border-color: color-mix(in srgb, var(--accent) 35%, var(--border)); background: var(--accent-soft); }
.result-learning-step { display: inline-block; margin-bottom: 5px; padding: 2px 7px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-strong); font-size: 0.69rem; font-weight: 750; line-height: 1.45; }
.result-name { display: block; font-weight: 750; }
.result-badges { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; margin-top: 5px; }
.result-category, .result-header { display: inline-block; font-size: 0.72rem; }
.result-category { color: var(--muted); }
.result-header { padding: 2px 6px; border-radius: 999px; background: var(--surface-2); color: var(--accent-strong); font-family: "Cascadia Code", Consolas, monospace; }
.result-preview {
  display: -webkit-box;
  margin-top: 6px;
  overflow: hidden;
  color: var(--muted);
  font-size: 0.78rem;
  line-height: 1.4;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  overflow-wrap: anywhere;
}

.detail-panel { min-height: 520px; padding: clamp(20px, 4vw, 38px); scroll-margin-top: 16px; }
.detail-panel.is-flash {
  outline: 3px solid color-mix(in srgb, var(--accent) 50%, transparent);
  outline-offset: 3px;
  box-shadow: var(--shadow), 0 0 0 7px color-mix(in srgb, var(--accent) 16%, transparent);
}
.welcome-card { max-width: 520px; margin: 80px auto 0; text-align: center; color: var(--muted); }
.welcome-card h2 { color: var(--text); }
.welcome-symbol { display: grid; place-items: center; width: 72px; height: 72px; margin: 0 auto; border-radius: 20px; background: var(--accent); color: var(--on-accent); font: 800 2.3rem/1 ui-monospace, monospace; transform: rotate(-3deg); }
.key-hint { margin-top: 24px; }

.detail-heading { margin-bottom: 26px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
.detail-heading h2 { margin: 7px 0 8px; font-size: clamp(1.65rem, 4vw, 2.5rem); letter-spacing: -0.035em; }
.category-badge { display: inline-block; padding: 4px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-strong); font-size: 0.78rem; font-weight: 750; }
.learning-order-badge { display: inline-block; margin-right: 7px; padding: 4px 9px; border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--border)); border-radius: 999px; color: var(--accent-strong); font-size: 0.78rem; font-weight: 750; }
.include-callout { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 12px 0; padding: 10px 12px; border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--border)); border-radius: 10px; background: var(--accent-soft); color: var(--accent-strong); }
.include-label { white-space: pre-line; font-family: "Cascadia Code", "SFMono-Regular", Consolas, monospace; font-size: 0.86rem; font-weight: 700; line-height: 1.55; }
.include-copy { flex: none; padding: 5px 9px; border: 1px solid color-mix(in srgb, var(--accent) 45%, var(--border)); border-radius: 7px; background: var(--surface); color: var(--accent-strong); font-size: 0.76rem; }
.include-copy:disabled { cursor: default; opacity: 0.55; }
.detail-aliases { margin: -2px 0 8px; color: var(--muted); font-size: 0.82rem; overflow-wrap: anywhere; }
.summary { margin: 0; color: var(--muted); font-size: 1.04rem; line-height: 1.75; }
.behavior-text, .usage-text { margin: 0; line-height: 1.8; }
.detail-section { margin-top: 26px; }
.detail-section h3 { margin: 0 0 10px; font-size: 0.9rem; letter-spacing: 0.05em; text-transform: uppercase; }

.code-wrap { position: relative; min-width: 0; }
pre { margin: 0; padding: 20px; overflow-x: auto; border-radius: 12px; background: var(--code-bg); color: var(--code-text); line-height: 1.6; tab-size: 4; }
code { font-family: "Cascadia Code", "SFMono-Regular", Consolas, monospace; font-size: 0.88rem; }
.copy-button { position: absolute; top: 9px; right: 9px; padding: 5px 9px; border: 1px solid rgba(255,255,255,0.18); border-radius: 7px; background: rgba(255,255,255,0.1); color: var(--code-text); font-size: 0.76rem; }
.copy-button:hover { background: rgba(255,255,255,0.18); }

.notes-list { margin: 0; padding-left: 1.35em; line-height: 1.75; }
.related-list { display: flex; flex-wrap: wrap; gap: 8px; }
.related-button, .empty-state button { padding: 7px 11px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-2); color: var(--accent-strong); }
.related-button:hover, .empty-state button:hover { border-color: var(--accent); }
.entry-links { display: flex; flex-wrap: wrap; gap: 8px; }
.entry-link, .roadmap-action-link {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 40px;
  padding: 8px 12px;
  border: 1px solid color-mix(in srgb, var(--accent) 45%, var(--border));
  border-radius: 8px;
  background: var(--accent-soft);
  color: var(--accent-strong);
  font: inherit;
  font-size: 0.84rem;
  font-weight: 700;
  line-height: 1.25;
  text-decoration: none;
}
.entry-link:hover, .entry-link:focus-visible,
.roadmap-action-link:hover, .roadmap-action-link:focus-visible { border-color: var(--accent); }

/* ---------------- C 语言学习流程图 ---------------- */
.learning-roadmap { margin: 0 0 26px; padding: 16px; border: 1px solid color-mix(in srgb, var(--accent) 30%, var(--border)); border-radius: 15px; background: color-mix(in srgb, var(--accent-soft) 42%, var(--surface)); }
.learning-roadmap.is-collapsible { padding: 0; overflow: hidden; }
.roadmap-heading { display: flex; flex-direction: column; gap: 4px; margin: 0 0 12px; }
.roadmap-heading h3, .roadmap-heading p { margin: 0; }
.roadmap-heading h3, .roadmap-heading > span { color: var(--text); font-size: 1rem; font-weight: 800; }
.roadmap-heading p, .roadmap-heading small { color: var(--muted); font-size: 0.78rem; font-weight: 500; }
summary.roadmap-heading { margin: 0; padding: 13px 16px; cursor: pointer; }
.learning-roadmap.is-collapsible[open] summary.roadmap-heading { border-bottom: 1px solid var(--border); }
.learning-roadmap.is-collapsible .roadmap-body { padding: 14px 16px 16px; }
.roadmap-canvas { width: 100%; overflow: hidden; }
.roadmap-svg { display: block; width: 100%; height: auto; max-width: 760px; margin: 0 auto; }
.roadmap-svg--narrow { display: none; }
.roadmap-edge { stroke: var(--muted); stroke-width: 2; }
.roadmap-svg marker path { fill: var(--muted); }
.roadmap-edge-label { fill: var(--accent-strong); font-size: 12px; font-weight: 750; text-anchor: middle; paint-order: stroke; stroke: var(--surface); stroke-width: 5px; stroke-linejoin: round; }
.roadmap-node { outline: none; cursor: pointer; }
.roadmap-node-shape { fill: var(--surface); stroke: var(--accent); stroke-width: 2; transition: 150ms ease; }
.roadmap-node-inner { fill: none; stroke: var(--accent); stroke-width: 1.5; pointer-events: none; }
.roadmap-node:hover .roadmap-node-shape, .roadmap-node:focus-visible .roadmap-node-shape { fill: var(--accent-soft); stroke-width: 3; }
.roadmap-node.is-start .roadmap-node-shape { fill: var(--accent); }
.roadmap-node.is-start .roadmap-node-label, .roadmap-node.is-start .roadmap-node-hint { fill: var(--surface); }
.roadmap-node.is-disabled { cursor: default; opacity: 0.58; }
.roadmap-node-label, .roadmap-node-hint { text-anchor: middle; pointer-events: none; }
.roadmap-node-label { fill: var(--text); font-size: 14px; font-weight: 800; }
.roadmap-node-hint { fill: var(--muted); font-size: 11px; }
.roadmap-caption { margin: 8px 0 0; color: var(--muted); font-size: 0.76rem; text-align: center; }
.roadmap-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 12px; }
.roadmap-fallback { margin: 0; padding-left: 1.5rem; line-height: 1.65; }
.roadmap-fallback li + li { margin-top: 6px; }
.roadmap-fallback-link { padding: 0; border: 0; background: transparent; color: var(--accent-strong); font-weight: 750; text-align: left; }
.roadmap-fallback-link:hover { text-decoration: underline; }
.roadmap-fallback-detail { display: block; color: var(--muted); font-size: 0.78rem; }

.exercise-section { padding-top: 4px; border-top: 1px solid var(--border); }
.exercise-card { margin-top: 14px; padding: 18px; border: 1px solid var(--border); border-radius: 14px; background: var(--surface-2); }
.exercise-heading { display: flex; align-items: center; flex-wrap: wrap; gap: 9px; }
.exercise-title { margin: 0; font-size: 1.04rem; }
.exercise-difficulty { padding: 3px 8px; border-radius: 999px; font-size: 0.74rem; font-weight: 700; }
.difficulty-1 { background: color-mix(in srgb, var(--difficulty-1) 16%, transparent); color: var(--difficulty-1); }
.difficulty-2 { background: color-mix(in srgb, var(--difficulty-2) 17%, transparent); color: var(--difficulty-2); }
.difficulty-3 { background: color-mix(in srgb, var(--difficulty-3) 16%, transparent); color: var(--difficulty-3); }
.exercise-entry-tags { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.exercise-label { color: var(--muted); font-size: 0.8rem; }
.exercise-entry-tag { padding: 3px 8px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface); color: var(--accent-strong); font-size: 0.76rem; }
.exercise-subtitle { margin: 16px 0 7px; font-size: 0.86rem; }
.exercise-prompt, .exercise-explanation { margin: 0; line-height: 1.75; }
.exercise-list { margin: 0; padding-left: 1.4rem; line-height: 1.75; }
.exercise-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 15px; }
.exercise-toggle, .exercise-review-button, .exercise-generate-button, .exercise-generate-action { min-height: 40px; padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--accent-strong); font-weight: 650; }
.exercise-toggle:hover, .exercise-review-button:hover, .exercise-generate-button:hover, .exercise-generate-action:hover { border-color: var(--accent); }
.exercise-toggle[aria-expanded="true"] { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); }
.exercise-disclosure { margin-top: 10px; padding: 12px; border-left: 3px solid var(--accent); border-radius: 8px; background: var(--surface); }
.exercise-answer { padding: 0; border-left: 0; background: transparent; }

(function () {
  "use strict";

  var entries = [];
  var exercises = [];

  function program(headers, body, beforeMain) {
    var includes = headers.map(function (header) { return "#include <" + header + ">"; }).join("\n");
    var prefix = beforeMain ? (includes ? "\n\n" : "") + beforeMain.trim() : "";
    var separator = includes || prefix ? "\n\n" : "";
    return includes + prefix + separator + "int main(void) {\n" +
      body.map(function (line) { return "    " + line; }).join("\n") +
      "\n    return 0;\n}\n";
  }

  function defineEntry(entry) {
    entries.push(entry);
  }

  function addEntries(nextEntries) {
    nextEntries.forEach(defineEntry);
  }

  function addExercises(nextExercises) {
    nextExercises.forEach(function (exercise) { exercises.push(exercise); });
  }

  window.C_SYNTAX_ENTRIES = entries;
  window.C_SYNTAX_DEFINE_ENTRY = defineEntry;
  window.C_SYNTAX_ADD_ENTRIES = addEntries;
  window.C_SYNTAX_PROGRAM = program;
  window.C_SYNTAX_EXERCISES = exercises;
  window.C_SYNTAX_ADD_EXERCISES = addExercises;
}());
  </script>

  <script data-source="data/entries/00-syntax.js">
(function () {
  "use strict";

  const behaviors = {
    "main-function": "程序启动后从 main 的第一条语句开始执行，按函数体顺序运行，遇到 return 或走到末尾便结束整个程序。它向运行环境返回一个整数退出状态：返回 0 表示成功，非零值表示某类失败；标准形式是 `int main(void)` 或带命令行参数的形式。",
    "statement": "语句是程序按顺序执行的基本步骤，表达式后加分号才形成完整语句；例如 `value = 3;` 会保存数值，单独一个 `;` 则什么也不做。若在 `if` 或 `for` 的控制头后误加分号，那个空语句可能被当成分支或循环体，后面的代码块反而无条件执行。",
    "compound-statement": "一对花括号把多条声明和语句合成一个整体，使 `if`、循环或函数能把它们当成同一个代码块执行。进入块时创建其中的普通局部对象，离开块后这些对象失效；内层块还能声明同名变量，暂时遮住外层名字。空的 `{}` 也是合法代码块。",
    "comment": "注释只写给读代码的人看，在真正编译程序前会被当作空白，不产生任何运行效果。`//` 从当前位置持续到本行结束，`/* ... */` 可跨多行但不能嵌套；因此用块注释包住本身含块注释的代码，可能提前结束并造成语法错误。",
    "identifier": "标识符给变量、函数或类型别名起可引用的名字，同一个作用域内用这个名字就能找到对应实体。名字区分大小写，首字符不能是数字，也不能占用 C 关键字或实现保留名；例如 `count` 与 `Count` 是两个不同名字，离开其可见范围后便不能再引用。",
    "scope": "作用域决定一个名字在源码的哪一段可见，而不是对象在内存中活多久。例如外层有 `value`，内层块再声明一个 `value` 后，块内访问的是新变量，离开块才重新看到外层变量；`for (int i = 0; ...)` 中的 `i` 也只在循环头和循环体内可见。",
    "escape-sequence": "转义序列让字面量能表示不便直接键入或会与语法冲突的字符：`\\n` 表示换行，`\\t` 表示制表，`\\\\` 表示一个反斜杠。编译器把反斜杠及其后续字符合成一个值；写错或漏掉反斜杠就会得到普通字符、非法转义或被引号提前结束。",
    "char-type": "char 保存一个 C 字节大小的整数，字符 `'A'` 会先成为字符编码对应的整数，再转换后存入变量。普通 char 到底按有符号还是无符号解释由实现决定，所以处理 0 到 255 一类原始字节时应使用 unsigned char；它只能保证一个字节，不能保证能独立装下一个中文字符。",
    "int-type": "int 保存整数并参与通常的整数运算，具体范围由实现决定，但至少覆盖 -32767 到 32767。结果在范围内就得到相应整数；有符号运算超出范围会成为未定义行为，也就是 C 标准不规定随后会发生什么，不能把它当作自动绕回。与 unsigned 混算时还可能先转换成无符号值。",
    "float-type": "float 用有限位数近似保存带小数的数，范围内但不能精确表示的值会按实现规则舍入，超出范围则不能假定会自动变成无穷。`0.5f` 后缀让字面量本身就是 float；参与多数表达式时结果仍按操作数转换规则决定，不能假定十进制小数都精确，也不宜直接用 `==` 比较计算结果。",
    "double-type": "double 也用有限的二进制位近似表示实数，通常比 float 范围更大、有效数字更多；无后缀的 `3.14` 默认就是 double。每次运算都可能舍入，所以 `0.1 + 0.2` 未必与十进制写下的 `0.3` 完全相等；普通标量小数计算通常优先采用它。",
    "void-type": "void 表示这里没有可供使用的值：返回类型为 void 的函数执行完只把控制权交回调用处，不能返回一个数；形参写 `(void)` 明确表示不接收参数。`void *` 则是可保存任意对象地址的通用对象指针，使用目标内容前仍要转换为合适类型，且 void 本身不能定义普通对象。",
    "bool-type": "_Bool 只保存假或真，任何赋给它的零值变成 0，任何非零值都变成 1。包含 `stdbool.h` 后，`bool`、`false`、`true` 分别是更易读的写法；逻辑与比较表达式也产生 0 或 1。它适合记录开关状态，但并不会拒绝把 27 这类整数赋进去。",
    "typedef-alias": "typedef 给现有类型增加一个别名，此后编译器会把别名按原类型检查和运算。例如 `typedef unsigned long Size;` 后，`Size n` 与 `unsigned long n` 具有相同表示和规则；它不会创建互不兼容的新类型，也不会分配变量或存储空间。",
    "arithmetic-operators": "加、减、乘先按通常算术规则计算，操作数会先转换到共同类型，结果类型也是该共同类型。两个整数相除只保留朝零方向的整数部分，如 `-7 / 3` 得 -2，余数为 -1；除数为零是未定义行为。浮点除法保留小数近似值，而 `%` 只允许整数操作数。",
    "relational-operators": "这些运算符比较两个值并产生 int 结果：关系成立得到 1，不成立得到 0。`==` 判断相等而 `=` 是赋值，不能混用；整数和浮点数会先做类型转换。同一数组内的指针可比较位置先后，但拿两个无关对象的指针做 `<`、`>` 等关系比较没有可移植的顺序含义。",
    "logical-operators": "逻辑运算先把零看成假、非零看成真，结果总是 int 类型的 0 或 1。`left && right` 在左边为假时直接得 0，不再执行右边；`left || right` 在左边为真时直接得 1，也跳过右边，这叫短路。`!value` 把真假反转，因此右侧带函数调用或自增时要留意它可能根本不执行。",
    "assignment-operators": "赋值先计算右侧，再转换成目标类型并存入左侧对象，整个赋值表达式的值就是存入后的值。左侧必须是可修改左值；左值就是能定位到某个可写对象的表达式，例如变量或 `*pointer`。`x += y` 大体相当于用 `x + y` 更新 x，但只定位 x 一次，转换细节也按复合赋值规则处理。",
    "increment-decrement": "四种写法都会让可修改对象增加或减少 1，但表达式得到值的时刻不同：`++i` 先修改再产生新值，`i++` 先产生旧值再完成修改；`--` 同理。例如 i 原为 3，`a = i++` 后 a 为 3、i 为 4。不要在一个表达式里无序地多次修改同一对象，否则可能是未定义行为。",
    "bitwise-operators": "位运算把整数看成一排二进制位：`&` 只保留两边都为 1 的位，`|` 合并任一为 1 的位，`^` 保留不同位，`~` 逐位反转。左移通常相当于乘二的幂，但移位数必须小于类型位宽；有符号负数移位规则复杂，掩码和移位应优先使用 unsigned，右移结果仍保持整数类型。",
    "conditional-operator": "先计算问号前的条件；条件非零时只执行冒号左边的表达式，条件为零时只执行右边，因此未选中的一边没有副作用。两个候选值会按类型规则决定整个表达式的结果类型，例如 `ready ? 1.0 : 0` 得到 double，而不是分别保留两种类型。",
    "if-statement": "先计算 condition，把零当作假、非零当作真；为真只执行 if 后的分支，为假则执行相连的 else 分支，没有 else 就直接继续。else 总与最近一个尚未配对的 if 结合，所以即使分支只有一条语句也建议写花括号，避免增删代码后改变归属。",
    "switch-statement": "先把控制表达式计算一次，再跳到值相等的 case；没有匹配项时进入 default，没有 default 就越过整个 switch。进入某个标签后会继续顺序执行后续 case，直到遇到 break、return 或末尾，这种继续下落常被误用；case 值必须是互不重复的整型常量表达式。",
    "for-loop": "让一段代码重复执行：先执行一次初始化；然后每轮开始前判断条件，为真就执行循环体，再执行迭代表达式，为假时结束。三部分都可留空，`for (;;)` 因而会一直循环，通常靠 break 退出；在循环头声明的变量只在该循环内可见。",
    "while-loop": "每一轮开始前先计算条件，非零就执行循环体，执行完再回头判断；第一次条件就是零时，循环体一次也不执行。循环体必须让条件最终变化或在某条路径 break，否则会持续运行；若只需固定次数，仍要明确初始化计数器、边界和每轮更新。",
    "do-while-loop": "先无条件执行一次循环体，再在末尾计算条件；条件非零就回到开头，等于零才离开，因此它至少执行一轮。末尾 `while (condition)` 后的分号是语法必需部分，不是意外空语句；这种结构适合先读取一次、再判断是否继续的流程。",
    "break-statement": "执行到 break 时，立即离开它所在的最内层循环或 switch，并从该结构之后继续；它不会一次跳出两层嵌套循环，也不能单独退出 if。例如 switch 的 case 末尾省略 break 会继续执行下一个 case，而循环中 break 常在找到目标后提前停止。",
    "continue-statement": "执行到 continue 会跳过本轮剩余语句并开始下一轮。对 while 和 do/while，它转去下一次条件判断；对 for，它先执行迭代表达式再判断条件，因此计数更新不会被漏掉。它只影响最内层循环，不会跳过外层循环的本轮。",
    "function-definition": "函数定义创建一段可按名称调用的代码：调用时把实参转换后交给形参，从函数体开头依次执行，遇到 return 回到调用点。非 void 函数必须返回与声明类型可转换的值，void 函数只返回控制权；同一外部函数通常只能有一个定义。",
    "function-prototype": "原型在函数体出现前告诉编译器参数和返回类型，使调用处能检查实参数量、完成正确转换并按正确类型接收返回值。`int add(int, int);` 表示传两个 int、返回 int；只写声明不会生成函数体，程序若实际调用它还必须在某处提供匹配定义。",
    "function-parameters": "调用函数时先求出每个实参的值，再把值复制给对应形参，所以修改普通形参不会改变调用者变量。若想改调用者对象，应传它的地址并通过指针操作；函数结束后返回值另行传回。数组形参会调整成指针，函数还需要额外的元素数量才能知道边界。",
    "return-statement": "return 会立刻结束当前函数，后面的语句不再执行，然后把控制权交还给调用位置。非 void 函数的 `return expression;` 先计算并转换表达式，再返回该值；void 函数写 `return;` 只表示提前结束。main 返回的整数还会成为程序退出状态。",
    "recursion": "递归调用会为本次函数保存独立的参数和局部状态，再进入下一层同一函数；最深层满足终止条件后先返回，外层再一层层继续计算。例如阶乘在 n 小于等于 1 时返回 1，否则等待 `n-1` 层结果。缺少可达终止条件会不断消耗调用栈并最终失败。",
    "variadic-function": "可变参数函数先接收固定参数，再通过 `va_start`、`va_arg` 按约定逐个取出省略号中的值，结束前执行 `va_end`。附加参数的数量和类型不会自动携带，必须由计数或格式串说明；char 会提升成 int、float 会提升成 double。函数最终按其声明返回结果，读取错类型或数量会产生未定义行为。",
    "function-pointer": "函数指针保存签名兼容的函数地址，给它赋不同函数后，同一句 `pointer(args)` 会执行当前所指函数并取得该函数返回值。例如根据模式选择加法或乘法；空函数指针不能调用，强制转换也不能把不兼容的参数或返回类型变得安全。",
    "one-dimensional-array": "定义数组时一次取得固定数量、连续排列的同类型元素，下标 0 访问第一个，`length - 1` 访问最后一个。下标会换算成首地址加元素步长后取值；小于 0 或大于等于长度都会越界，读写越界是未定义行为，数组建立后长度也不能改变。",
    "multidimensional-array": "多维数组的每个元素仍是一个数组，例如 `int m[2][3]` 是连续放置的两行、每行三个 int，`m[1][2]` 先选第二行再选第三列。最右侧维度决定跨一行的步长；传给函数时若列数写错，地址计算会落到错误位置。",
    "char-array": "字符数组按元素保存字符，只有在有效内容后存在空字符 `'\\0'` 时，字符串函数才知道文字在哪里结束；空字符是数值为零的隐藏结束字节。例如 `char text[6] = \"hello\"` 正好含五个可见字符和结尾字节。容量用尽而没有结尾时，它仍是数组，却不能安全当作 C 字符串。",
    "string-literal": "编译器为双引号文字建立带结尾空字符的数组，该数组具有静态存储期，也就是从程序开始到结束始终存在。表达式通常得到首字符地址，可安全读取却不能修改；写入字面量属于未定义行为。相邻字面量会在编译阶段拼接，内容相同的两处是否共用地址则不保证。",
    "array-initialization": "数组定义时按顺序把初始化项写入元素；省略长度就由项目数推导，显式长度更大时，没列出的剩余元素自动初始化为零。例如 `int a[4] = {1, 2}` 得到 1、2、0、0。初始化项超过容量会被诊断，定义完成后也不能再用花括号整体赋值。",
    "pointer-declaration": "指针变量保存另一个对象的地址，类型决定解引用时读取多少字节以及加一跨过多大元素。例如 p 指向 value 后，`*p = 8` 会改到 value 本身。未初始化指针含不确定地址；只有指向仍存活且类型、对齐和权限正确的目标时才能解引用。",
    "address-operator": "一元 `&` 取得现有对象或函数的地址，但不复制该对象；例如 `&value` 可交给函数，让函数经指针修改原变量。地址的类型包含目标类型，离开局部对象的生存期后，曾保存的地址会悬空。位域没有独立可寻址单元，因此不能对位域取地址。",
    "dereference-operator": "一元 `*` 沿指针找到目标对象：放在赋值右边会读取目标，放在左边会写入目标。例如 p 指向 n 时，`*p += 1` 最终改变 n。指针为空、已悬空、越过数组边界或不满足类型与对齐要求时解引用会产生未定义行为。",
    "null-pointer": "空指针是特意表示“目前没有目标”的指针值，可用 NULL 初始化并用 `pointer == NULL` 检查。它与任何有效对象地址都不相等，但其内存表示不保证全是零位；可以复制和比较，不能用 `*` 或 `->` 访问。`free(NULL)` 没有效果，其他函数是否接受它要看各自契约。",
    "pointer-arithmetic": "给数组元素指针加 n，会移动 n 个元素而不是 n 个字节；同一数组内两个指针相减得到相隔的元素个数。例如 int 指针加 2 指向第三个 int。运算结果只能位于原数组或恰好尾后位置，尾后指针可比较却不能解引用；无关对象的指针不能相减。",
    "pointer-to-pointer": "二级指针保存的是另一个指针变量的地址，所以 `*slot` 能改那个指针的指向，`**slot` 才访问最终对象。例如函数接收 `T **out` 后可把新地址写回调用者。每一层都要有效，二级指针也不等同于二维数组；失败时是否改写输出指针应由接口明确约定。",
    "const-pointer": "`const int *p` 允许 p 改指向但禁止通过 p 改目标，`int * const p` 固定 p 的地址却允许修改目标，两处都写 const 就两者都受限。const 约束的是这条访问路径，并不保证对象不会被其他可写别名改变；去掉限定去写真正定义为 const 的对象是未定义行为。",
    "array-pointer": "数组指针把整个固定长度数组当作一个目标，例如 `int (*row)[3]` 指向含三个 int 的一行；`row + 1` 会跨过整行，`(*row)[2]` 访问当前行第三项。括号不可省略，因为 `int *row[3]` 是三个指针组成的数组，含义和内存布局完全不同。",
    "struct-type": "结构体把多个有名字、可为不同类型的成员放进同一个对象，每个成员各有自己的存储；给一个结构体赋给同类型对象会逐成员复制值。例如 Point 同时携带 x 和 y，但两个不同标签的结构体即使成员相同也不是同一类型；总大小还可能包含对齐所需空隙。",
    "union-type": "联合的所有成员从同一地址开始并共享一块足以容纳最大成员的存储，写入一个成员通常会覆盖先前成员的表示。例如先写 integer 后应读 integer；若改写 real，就应把 real 当作当前有效成员。联合自己不记录哪项有效，互斥变体通常另配枚举标签。",
    "enum-type": "枚举给一组整数值命名，未显式赋值时第一项从 0 开始，后续每项比前一项大 1；变量保存的是相应整数表示，switch 可按名称分支。例如 GREEN 默认是 1。来自文件或网络的任意整数仍要校验，因为枚举对象并不会自动拒绝列表外的值。",
    "member-access": "点运算符从结构体或联合对象本身选择成员，读取时得到该成员的值，放在可修改位置时可只更新该成员。例如 `point.x = 3` 不会改变 point.y。左边必须是对象而非指针；整个对象若是 const，通过点得到的成员也不能修改。",
    "arrow-operator": "箭头先沿结构体或联合指针找到对象，再选择成员，`pointer->member` 等价于 `(*pointer).member`。写入成员会直接改变所指对象，而不是指针的副本；指针为 NULL、悬空或类型错误时访问就是未定义行为，指向 const 对象时只能读取。",
    "bit-field": "位域让一个结构体成员只占指定数量的位，写入值时只能保留该宽度能表示的部分，常见的 unsigned 1 位字段可表示 0 或 1。成员的排列顺序、对齐和跨存储单元方式由实现决定，也不能取得单个位域地址；因此它适合进程内标志，不应直接映射可移植文件或网络格式。",
    "struct-initialization": "定义结构体时，位置初始化按成员声明顺序写入，指定初始化 `.name = value` 则直接找到对应成员，与书写顺序无关。只列部分成员时其余成员初始化为零；例如只给 `.y = 2`，x 会是 0。对象定义完成后不能用裸花括号再次整体赋值，可用复合字面量。",
    "include-directive": "预处理器在编译 C 语法前找到指定头文件，并把其内容纳入当前翻译单元；尖括号通常按系统头搜索路径查找，引号通常先查项目附近再查系统路径。它只是文本层面的包含，重复包含可能重复声明或定义，所以项目头应配保护宏。",
    "object-macro": "预处理器遇到对象式宏名时，会在编译前把该记号替换为宏体，例如 LIMIT 变成 100；替换本身没有类型、存储或作用域检查。宏体不应自带分号，涉及表达式时要留意调用位置的运算组合；需要有类型的常量时 enum 或 const 对象往往更清楚。",
    "function-macro": "函数式宏在宏名紧跟左括号时收集实参，再按记号把每个形参出现处替换掉，并不是一次真正函数调用。`SQUARE(i++)` 会因形参出现两次而把 i 修改两次；所以各形参与整体通常都要加括号，带副作用的实参不要传给会重复展开的宏。",
    "conditional-compilation": "预处理器先计算 `#if` 条件，只把成立分支的记号送给编译器，其他分支像不存在一样；`#else` 处理相反情况，`#endif` 结束选择。它能让不同平台编译不同代码，但被排除部分不会接受正常语义检查，因此每种重要宏组合都要单独构建验证。",
    "include-guard": "第一次包含头文件时，`#ifndef` 发现保护宏尚未定义，于是定义它并处理正文；同一翻译单元再次包含时条件为假，整段正文被跳过。这样能避免重复声明或定义，但宏名若与别的头碰撞，会错误地静默跳过文件，所以名称应带项目和路径特征。",
    "predefined-macros": "编译器在预处理时把这些宏换成当前上下文信息：`__FILE__` 是文件名字符串，`__LINE__` 是行号整数，`__DATE__` 和 `__TIME__` 是编译时刻，`__STDC_VERSION__` 表示标准版本。它们不需要自行定义；日期时间每次构建可能变化，会影响可复现产物。",
    "macro-stringify-paste": "宏参数前的 `#` 会把传入记号转换成字符串字面量，`##` 会把左右记号粘成一个新的预处理记号。例如 TEXT(name) 可得到文字 `name`，JOIN(item_, count) 可形成标识符 item_count。参与它们的参数不会按普通顺序充分展开，常需再包一层辅助宏，拼接结果也必须是合法记号。",
    "storage-class-specifiers": "这些说明符改变名字与存储的规则：文件作用域 static 让名字只在本翻译单元可见，extern 表示实体定义在别处，块内 static 让对象跨调用保留值，auto 是普通局部对象默认方式，register 只是旧式访问提示。选择错误可能造成链接冲突或状态意外共享。",
    "const-qualifier": "const 表示不能通过这个左值修改对象；左值就是能定位到对象的表达式，例如变量名。定义 `const int limit = 10` 后可读取和复制 limit，却不能给它重新赋值；它不一定是 C 里的编译期整型常量。若强行去掉 const 并写入原本就是 const 的对象，会产生未定义行为。",
    "volatile-qualifier": "volatile 告诉编译器每次读写都必须真实发生，因为值可能被硬件或信号处理流程在普通代码之外改变；因此连续两次读取可以得到不同结果。它不会让 `value++` 变成不可分割操作，也不建立线程同步，多个线程共享数据仍要用原子类型或互斥机制。",
    "restrict-qualifier": "restrict 是调用者对别名关系的承诺：在该指针有效的代码区域里，相关对象主要经它派生的路径访问，让编译器可假定源和目标不重叠并优化。若实际让受限访问路径违规重叠，行为未定义。它只限定访问约定，不检查地址，也不改变 void 函数不返回数值的事实。",
    "integer-promotions": "小于 int 等级的整数类型参与多数运算前会被提升，也就是先转换成 int；若 int 装不下其全部值才转换成 unsigned int。于是两个 unsigned char 相加通常先得到 int 结果，位运算也在提升后宽度上进行。再赋回较窄类型时可能截去高位，不能只看变量原类型猜结果。",
    "explicit-cast": "显式转换先计算 expression，再要求编译器把值转换成 target_type，结果类型就是目标类型。例如 `(double)a / b` 会让除法采用浮点规则，而 `a / b` 之后再转 double 已经丢掉小数。强制转换不会检查运行时范围，也不能修复无效指针、错误对齐或不兼容函数签名。",
    "sizeof-array-decay": "sizeof 对真实数组求值时得到整个数组占用的字节数，所以 `sizeof array / sizeof array[0]` 可算本作用域中的元素数。数组在多数其他表达式中会退化，也就是自动变成首元素指针；传进函数后形参已经是指针，此时 sizeof 只得到指针大小，不能再推回原数组长度。",
    "comma-operator": "逗号运算符先完整计算左表达式并丢弃它的值，再计算右表达式，整个结果就是右侧的值和类型；例如 `(i++, i * 2)` 先增加 i 再产生两倍结果。它与函数实参列表中的分隔逗号不是同一作用，优先级又很低，实际使用时应加括号避免误读。",
    "compound-literal": "复合字面量在表达式位置创建一个指定类型的真实对象，并按花括号内容初始化，然后表达式得到这个对象；例如可把临时 Point 传给函数或取其地址。块内创建的对象通常存活到所在块结束，文件作用域的对象则具有静态存储期，不能把块内对象地址带到块外继续使用。",
    "designated-initializer": "指定初始化器直接按成员名或数组下标放置初值，不必依赖声明顺序；未指定的其余部分按零初始化。例如 `[3] = 7` 会令数组至少能覆盖下标 3，并让前面未列位置为零。若同一子对象被重复指定，后项会覆盖前项并可能触发诊断或告警，不应依赖这种写法。",
    "variable-length-array": "变长数组在程序运行到声明处时计算 length，并在进入该块的这一次创建相应数量元素，离开块后存储失效。长度每次进入可不同，但必须大于零且规模可承受；它不能具有静态存储期，过大还可能耗尽有限栈空间，因此不可信尺寸通常改用受检查的动态分配。",
    "inline-function": "inline 允许编译器在调用处展开函数体以省去调用开销，但不保证一定展开，参数求值和返回规则仍与普通函数相同。示例 square 接收一个 int 并返回乘积；写成 static inline 放在头文件时，每个翻译单元拥有内部链接定义，可避免外部定义规则带来的链接问题。",
    "string-array-difference": "C 字符串是以空字符结束的字符序列，而字符数组只是若干 char，未必有结束标记。`char text[] = \"hi\"` 创建可修改副本并含三个元素，`const char *p = \"hi\"` 只保存字面量地址且不能改内容；数组中间出现 `'\\0'` 时，字符串函数会在那里停止，即使后面仍有数组元素。",
    "array-parameter-decay": "函数形参写成 `int values[10]` 时会调整为 `int *values`，这种退化表示函数收到的只是首元素地址，数字 10 不会自动检查也不属于函数类型。函数必须另收 count 才知道可访问范围，函数体内 sizeof values 返回指针大小；多维形参的后续维度仍决定寻址步长。",
    "declaration-definition": "声明把名称、类型和链接方式告诉编译器，定义还真正提供对象存储或函数体。`extern int shared;` 可在多个文件出现而不分配该对象，某一个源文件的 `int shared = 0;` 才提供定义；实际引用最终找不到定义会链接失败，出现多个外部定义也通常冲突。",
    "signed-overflow": "有符号加减乘若数学结果超出该类型范围，会产生未定义行为，不能先算完再比较结果是否绕回。应在运算前用 INT_MAX、INT_MIN 与操作数方向检查，例如正 delta 前先验证 `value <= INT_MAX - delta`。先在 int 中溢出后再赋给 long 也无法补救，必须让运算本身在足够宽的类型中进行。",
    "floating-comparison": "浮点运算会舍入，两个按数学应相等的计算路径可能留下细小差值；比较近似结果时先求绝对差，再按问题尺度判断是否不超过容差，大数还常结合相对误差。精确复制或离散值仍可直接比较；NaN 与任何值包括自己都不相等，所以含 NaN 的输入要单独分支。",
    "static-meanings": "static 随位置产生三种效果：文件作用域名字只在当前翻译单元可见；块内对象只初始化一次并在整个程序期间保留值；数组形参中的 `static 4` 则要求调用者至少提供四个元素。第三种只是调用契约，不改变函数的返回类型也不会自动检查，违反后函数按此前提访问可能越界。",
    "scope-lifetime": "作用域回答“名字在哪里能写”，生存期回答“对象在什么时候仍存在”。例如块内普通变量离块后名字不可见且对象也结束，块内 static 变量的名字虽看不见了，对象却以静态存储方式一直保留到程序结束；保存普通局部变量地址不会延长其寿命，离块后地址会悬空。",
    "struct-padding": "编译器会按成员对齐要求在成员之间或结构体末尾插入填充，也就是不代表任何成员的空白字节；例如 char 后接 int 时中间常有空隙，所以 sizeof 可能大于成员大小之和。真实偏移应通过 offsetof 查询，填充内容可能不确定，因此不能用 memcmp 可靠判断两个结构体的成员值是否相等。",
    "struct-pass-return": "结构体按值传给函数时，形参获得各成员值的副本，修改副本不会改变调用者；return 又按值返回一个结构体结果，调用者接收独立对象。示例 move 可返回移动后的 Point 而原 Point 保持不变。若成员含指针，只复制地址而不复制所指资源，所以所有权仍需单独约定。",
    "enum-bit-flags": "把每个枚举常量设为不同的二次幂，就能让每一位代表独立开关：`READ | WRITE` 合并标志，`flags & WRITE` 检查该位，`flags &= ~WRITE` 清除它。组合结果宜放在 unsigned 对象中以避免符号位问题；若状态彼此互斥，应使用普通枚举值而不是同时可开的位集合。",
    "pointer-array-difference": "数组对象本身拥有一整段连续元素，指针对象只拥有一个地址。数组名在多数表达式中会退化成首元素指针，所以两者看似都能下标，但 `sizeof array` 得整段容量、`sizeof pointer` 只得地址大小；数组不可整体改指向，指针却能改为指向另一数组。",
    "function-pointer-array": "函数指针数组按下标保存多个签名兼容的函数地址，选定索引后 `operations[index](args)` 会调用对应函数并返回其结果。它适合连续编号的分发表，但外部索引必须先与元素数比较，每个槽也要非空；数组只保存代码地址，不会自动携带回调所需状态。",
    "callback-function": "回调把函数地址作为参数交给通用流程，流程在约定步骤调用它，并按签名接收其返回值或只让它产生效果。例如遍历器可对每个元素调用 callback；签名必须兼容，允许空回调时先检查 NULL。若稍后异步调用，还要保证配套上下文在那时仍然存活。",

    ["FILE *stream = tmpfile();", "if (stream == NULL) return 1;", "if (fprintf(stream, \"%s %d\\n\", \"item\", 7) < 0) { fclose(stream); return 1; }", "if (fclose(stream) == EOF) return 1;"]);
  revise("fscanf-function", "从结构固定的文本流读取少量字段时使用 fscanf；检查返回项目数，并在失败后结合 feof 与 ferror 判断原因。",
    ["空白格式字符会消费任意数量空白，交互时可能继续等待。", "转换失败字符通常留在流中，循环不能原地反复重试。", "字符串转换必须设置不超过数组容量减一的宽度。"],
    ["FILE *stream = tmpfile();", "if (stream == NULL) return 1;", "if (fputs(\"17\", stream) == EOF) { fclose(stream); return 1; }", "rewind(stream);", "int value = 0;", "if (fscanf(stream, \"%d\", &value) != 1) { fclose(stream); return 1; }", "if (fclose(stream) == EOF) return 1;", "return value == 17 ? 0 : 1;"]);
  revise("fgets-function", "按行读取文本时优先使用 fgets；传真实数组容量，检查空指针结果，并判断换行是否读入以识别长行。",
    ["容量足够时，读到的换行会保存在目标数组中。", "返回 NULL 可能是文件结束，也可能是读取错误。", "size 小于等于一的边界行为不适合通用代码依赖。"],
    ["FILE *stream = tmpfile();", "if (stream == NULL) return 1;", "if (fputs(\"line\\n\", stream) == EOF) { fclose(stream); return 1; }", "rewind(stream);", "char buffer[16];", "if (fgets(buffer, (int)sizeof buffer, stream) == NULL) { fclose(stream); return 1; }", "if (fclose(stream) == EOF) return 1;"]);
  revise("fputs-function", "向文件或 stdout 写入原样字符串片段时使用 fputs；需要换行就显式写入，并以 EOF 识别错误。",
    ["fputs 不会把字符串结尾的空字符写入流。", "字符串和流指针都必须在调用期间保持有效。", "成功只保证返回非负值，不能假定等于写入长度。"],
    ["FILE *stream = tmpfile();", "if (stream == NULL) return 1;", "if (fputs(\"hello\\n\", stream) == EOF) { fclose(stream); return 1; }", "if (fclose(stream) == EOF) return 1;"]);
  revise("fseek-function", "对可定位流进行随机访问时使用 fseek；二进制流可用字节偏移，文本流通常只用零或 ftell 返回的位置。",
    ["成功定位会清除文件结束指示器，并撤销 ungetc 效果。", "文本流任意数值偏移不可移植，Windows 换行转换尤其明显。", "返回非零表示失败，不能继续假设位置已经改变。"],
    ["FILE *stream = tmpfile();", "if (stream == NULL) return 1;", "if (fputs(\"abc\", stream) == EOF) { fclose(stream); return 1; }", "if (fseek(stream, 0L, SEEK_END) != 0) { fclose(stream); return 1; }", "long size = ftell(stream);", "if (fclose(stream) == EOF) return 1;", "return size < 0L ? 1 : 0;"]);

  var behaviors = {
    "printf-function": "把数据按格式字符串的要求转换成文字，再写到标准输出 stdout。格式中的 `%d`、`%s` 等转换说明会依次取用后面的参数；说明符与参数类型不一致会造成未定义行为，也就是 C 标准不规定会发生什么。成功时返回实际写出的字符数，不包含字符串结尾的空字符；输出或编码失败时返回负数。",
    "scanf-function": "从标准输入 stdin 读取文字，并按格式说明把匹配内容转换后写进调用者提供的变量。除字符数组等少数情况外，参数必须是变量地址；`%s` 还必须给出字段宽度以免写出数组。返回成功赋值的项目数；第一个字段就不匹配时返回 0；在任何转换成功前遇到文件结束或读取错误时返回 EOF。",
    "puts-function": "把一个以空字符 `\\0` 结尾的字符串原样写到标准输出，并在末尾自动再写一个换行，所以传入的文字通常不必自带换行。它不解释字符串里的百分号。写入成功时返回非负数，但该数不保证等于字符数；写入失败时返回 EOF。传入空指针或没有结尾空字符的数组会产生未定义行为。",
    "getchar-function": "从标准输入读取下一个字节，常用于逐字符处理键盘或重定向输入。读到普通字节时，先把它当作 unsigned char 再提升为 int 返回，因此结果非负；到达文件末尾或发生读取错误时都返回 EOF。必须用 int 接收，再用 feof(stdin) 与 ferror(stdin) 区分正常结束和错误，不能先存进 char。",
    "fopen-function": "按 path 指定的路径和 mode 指定的模式打开文件，并建立一个 FILE 流；FILE 流是标准库保存文件位置、缓冲和错误状态的控制对象。成功时返回可供后续读写的 `FILE *`，用完必须 fclose；打开失败时返回 NULL，并设置 errno 供 perror 等取得原因。模式不合法、文件不存在或权限不足都可能失败。",
    "fclose-function": "结束一个已打开的流：先把尚在缓冲区中的输出尝试写出，再释放该 FILE 对象及相关资源。全部成功时返回 0；刷新或关闭失败时返回 EOF，因此先前写入看似成功也仍要检查这里。无论返回什么，原 FILE 指针都不能再使用或再次关闭；把无效指针传入会产生未定义行为。",
    "fprintf-function": "把参数按格式字符串转换成文字，并写入第一个参数指定的 FILE 流，规则与 printf 相同，只是目标可为文件、stdout 或 stderr。成功时返回写出的字符数，不含任何字符串结尾空字符；输出或编码出错时返回负数。格式说明与实参类型不一致，或 stream 不是有效可写流，会导致错误或未定义行为。",
    "fscanf-function": "从指定 FILE 流取得文字，按格式匹配并把转换结果写入后续指针所指的对象。返回成功赋值的项目数；首个可转换内容不匹配时返回 0；尚未完成任何转换就到达文件末尾或发生读取错误时返回 EOF。字符串转换必须限制宽度，失败后还要用 feof 和 ferror 判断是正常结束还是 I/O 错误。",
    "fgets-function": "从指定流最多读取 `size - 1` 个字符到 buffer，遇到换行或文件结束会提前停止；读到的换行会保留，随后补上空字符 `\\0` 作为字符串结尾。只要成功取得至少一个字符就返回 buffer；在读到任何字符前遇到文件结束或读取错误则返回 NULL。调用者应提供有效数组并让 size 大于 1，不依赖更小容量的边界行为。",
    "fputs-function": "把以空字符结尾的 string 写到指定流，但不写结尾空字符，也不会像 puts 那样自动加换行。成功时返回非负数，具体数值不保证是长度；失败时返回 EOF。string 必须是完整有效的字符串，stream 必须可写；实际设备错误还可能延迟到 fflush 或 fclose 时才报告。",
    "fseek-function": "改变流的当前位置，offset 表示相对 origin 的偏移；origin 可用 SEEK_SET、SEEK_CUR 或 SEEK_END 表示开头、当前位置或末尾。fseek 成功返回 0，并清除文件结束标志；失败返回非零，位置不能假定已改变。ftell 成功返回可保存并交回 fseek 的 long 位置值，失败返回 -1L；文本流的位置未必等于字节数。",
    "sprintf-function": "把格式化结果写入 buffer，并在末尾追加空字符，而不是输出到文件。它没有容量参数，会依次展开格式说明和参数；目标空间不足就越界写入，属于未定义行为。成功时返回生成的字符数，不含末尾空字符；编码错误时返回负数。只有能严格证明数组足够大时才能用，通常应改用 snprintf。",
    "snprintf-function": "把格式化文字写进容量为 size 的 buffer，最多存放 `size - 1` 个可见字符并在 size 大于 0 时补空字符；超出的部分被截断。成功时返回假如空间无限本来需要的字符数，不含末尾空字符，所以返回值大于等于 size 就表示截断；编码错误返回负数。size 为 0 时不写数据，buffer 可以是 NULL，可用来查询所需长度。",
    "vprintf-function": "把 va_list 参数列表按 format 格式写到标准输出；va_list 是可变参数函数用来逐项访问省略号实参的状态对象。它和 printf 的输出规则相同。成功时返回写出的字符数，输出或编码失败时返回负数。调用方要先 va_start、最后 va_end；同一列表若还要再用，必须在调用前用 va_copy 复制。",
    "vfprintf-function": "把 va_list 中的参数按格式转换后写入指定 FILE 流，适合让日志包装函数转发自己收到的可变参数。成功时返回实际写出的字符数；输出或编码错误时返回负数。stream 必须有效且可写，格式与列表中的真实类型必须对应；创建参数列表的一方仍负责 va_end，重复遍历前要 va_copy。",
    "vsprintf-function": "从 va_list 依次取得参数，按 format 生成字符串写入 buffer，并补上结尾空字符。它不知道 buffer 的容量，展开结果放不下时会越界写入并产生未定义行为。成功时返回生成的字符数，不含末尾空字符；编码错误时返回负数。调用之后该 va_list 的状态不可移植，需要再次使用时应预先 va_copy。",
    "vsnprintf-function": "从 va_list 生成格式化字符串，并把写入限制在 buffer 的 size 个字节内；size 大于 0 时结果始终用空字符结束。成功时返回未截断情况下需要的字符数，不含结尾空字符，因此返回值大于等于 size 表示发生截断；编码错误返回负数。size 为 0 时可只计算长度，再次生成前必须重建或复制 va_list。",
    "putchar-function": "把参数 c 转成 unsigned char 对应的单个字节，再写到标准输出 stdout；它处理的是一个字符值，不是字符串。成功时返回刚写入的字节提升为 int 后的值；写入失败时返回 EOF。因为 EOF 也是 int 范围中的特殊负值，调用者应直接检查返回值，换行则需要另写一次 `putchar('\\n')`。",
    "putc-function": "把 c 转成 unsigned char 后写入指定 FILE 流；它可能由实现定义成宏，所以 stream 表达式应简单且没有自增等副作用。成功时返回所写字节提升为 int 后的值，失败时返回 EOF。它一次只写一个字节，大块数据更适合 fwrite；stream 无效或不可写时不能继续依赖结果。",
    "fputc-function": "把 c 的低位 unsigned char 值作为一个字节写入指定流，功能与 putc 相近但保证是函数接口。成功时返回实际写入字节提升为 int 后的值，并不是写入数量；失败时返回 EOF。二进制流可用它写 0 到 UCHAR_MAX 的任意字节，连续大量写入则通常应改用 fwrite。",
    "fwrite-function": "从 pointer 指向的内存开始，向 stream 写出 count 个对象，每个对象占 size 字节；它按原始字节复制，不理解字符串、结构体字段或结尾空字符。返回完整写出的对象个数，等于 count 才表示全部完成；较小值表示短写，可用 ferror 查错。size 或 count 为 0 时不访问数组并返回 0，其他情况下源区域必须足够大。",
    "sscanf-function": "从已经在内存中的字符串读取内容，按 format 匹配并把转换结果写到后续指针所指对象，不会读取 stdin。返回成功赋值的项目数；首个字段不匹配时返回 0；字符串在第一次转换完成前已经结束时返回 EOF。`%s` 和扫描集要设置不超过数组容量减一的宽度，格式与目标指针类型必须准确对应。",
    "gets-removed": "历史上的 gets 会从标准输入读一行到 buffer、丢弃换行并补空字符；成功原本返回 buffer，文件结束或错误时返回 NULL。但它完全没有容量参数，任何过长输入都能越界写入，所以 C11 已删除该函数，现代程序不能调用。替代方案是传入真实数组容量的 fgets，并自行处理它保留的换行。",
    "getc-function": "从指定 FILE 流读取下一个字节；它可能实现为宏，因此 stream 参数不要写成会产生副作用的复杂表达式。成功时返回该字节先转成 unsigned char、再提升为 int 的非负值；到达文件末尾或发生读取错误时返回 EOF。结果必须先保存在 int 中，再用 feof 或 ferror 区分两种 EOF 原因。",
    "fgetc-function": "从指定 FILE 流读取下一个字符，作用与 getc 相同但以函数形式提供。读到字节时返回其 unsigned char 值提升成的非负 int；文件结束或读取错误都返回 EOF。若先转成 char 再比较 EOF，某些有效字节可能被误判，因此要用 int 接收，并在 EOF 后查询 feof 与 ferror。",
    "ungetc-function": "把一个字符推回输入流，使下一次字符读取先得到它，常用于解析器多看了一个分隔符后退一步。成功时返回被推回的字符值，并清除该流的文件结束标志；失败返回 EOF。参数 c 本身若是 EOF 必然失败，标准只保证至少能连续推回一个字符，定位、读取或其他操作可能取消推回内容。",
    "fread-function": "从 stream 读取 count 个对象到 pointer 指向的内存，每个对象占 size 字节；它按原始字节工作，不补字符串结束符。返回完整读到的对象个数；小于 count 可能是文件结束，也可能是读取错误，必须结合 feof 和 ferror 判断。size 或 count 为 0 时返回 0 且不访问目标，其余情况下只能使用返回数量范围内的新数据。",
    "freopen-function": "先处理已有 stream，再让它按 filename 和 mode 重新关联文件，常用于重定向 stdin、stdout 或 stderr。成功时返回重新打开后的 FILE 指针，后续应使用这个返回值；失败返回 NULL，原流与文件的关联已经失效，不能继续使用旧指针。filename 为 NULL 的改模式形式是否支持由实现决定。",
    "fflush-function": "把输出流缓冲区中尚未提交的数据交给宿主环境；传具体 stream 处理一个输出流，传 NULL 会处理所有已打开的输出流。全部成功返回 0，写入出错返回 EOF。它只刷新 C 库缓冲，不保证物理磁盘已经持久化；对输入流调用在 ISO C 中没有“清空键盘输入”的含义。",
    "ftell-function": "取得 stream 的当前位置表示，便于稍后恢复或配合 fseek 计算位置。成功时返回一个非负 long 值；失败时返回 -1L，并可能设置 errno。二进制流中它通常是从文件开头算的字节偏移，文本流中则可能只是一个不透明标记，只保证可原样交给 fseek，不能总当作文件字节数。",
    "rewind-function": "把可定位流移回文件开头，同时清除该流的文件结束标志和错误标志，效果近似 `fseek(stream, 0, SEEK_SET)` 后再 clearerr。它没有返回值，因此无法直接报告定位失败；若程序必须知道是否成功，应改用会返回状态的 fseek。对管道等不可定位的流调用后，不能假定位置真的改变。",
    "fgetpos-function": "把 stream 当前的完整位置状态保存到 position 指向的 fpos_t 对象；fpos_t 是实现定义的位置类型，可能还包含多字节字符转换状态。成功返回 0，失败返回非零并可能设置 errno。目标必须可写，保存值只应在同一个仍打开的流上交给 fsetpos，不能把它当普通整数计算。",
    "fsetpos-function": "把 stream 恢复到此前由 fgetpos 为同一流保存的位置，并同时恢复该位置相关的多字节转换状态；成功还会清除文件结束标志并撤销 ungetc 的推回效果。成功返回 0，失败返回非零并可能设置 errno。position 必须来自同一打开流且仍有效，不能自行拼造或跨文件复用。",
    "feof-function": "检查 stream 的文件结束指示器是否已经被先前的读取操作置位。指示器已置位时返回非零值，否则返回 0；它不会预先判断下一次读取是否到末尾，所以循环应先尝试读取，再在失败后调用 feof。返回 0 也可能是读取错误，此时要另查 ferror；定位或 clearerr 可以清除此标志。",
    "ferror-function": "检查 stream 的错误指示器是否已被先前的输入输出操作置位。存在错误时返回非零值，没有记录错误时返回 0；返回 0 不代表一定还有数据，因为文件结束由 feof 单独表示。该函数只读取状态，不会清除它，若要继续使用流需在处理原因后调用 clearerr 或执行合适的重新定位。",
    "clearerr-function": "同时清除 stream 上保存的文件结束指示器和错误指示器，让后续 I/O 可以重新报告状态。它不移动文件位置、不修复磁盘或设备故障，也不会丢弃输入数据。函数没有返回值，因此调用后只能通过新的读写操作及 feof、ferror 判断是否恢复；stream 必须仍是有效的打开流。",
    "perror-function": "把可选前缀 string、冒号分隔符以及当前 errno 对应的错误说明写到标准错误流 stderr，末尾再写换行；errno 是许多库调用失败后保存错误编号的全局机制。函数没有返回值，无法直接判断诊断是否写出成功。传 NULL 或空字符串时只输出错误说明，调用前应保留真正失败操作留下的 errno。",
    "remove-function": "按 filename 删除一个文件；实现也可能允许它删除空目录。删除成功时返回 0，失败时返回非零值，并可能设置 errno 说明不存在、权限不足或文件正被占用等原因。成功后该名称不再指向原文件，但已经打开的流如何受影响取决于宿主系统；传空指针会产生未定义行为。",
    "rename-function": "把文件或目录名称从 old_name 改为 new_name，通常不会复制文件内容。成功时返回 0，原名称随后不再有效；失败时返回非零值并可能设置 errno，此时不能假定已完成一半改名。若 new_name 已存在会怎样由实现和宿主系统规则决定，因此需要可移植代码时应事先设计冲突处理。",
    "tmpfile-function": "创建一个临时二进制更新流，也就是既可读又可写的临时文件，并安排在关闭或程序正常结束时自动删除。成功时返回可用的 `FILE *`，失败返回 NULL。名称由实现管理，调用者通常看不到路径；仍要检查写入、定位和 fclose 的返回值，异常终止时是否清理由宿主环境决定。",
    "tmpnam-function": "生成一个调用当时尚未对应现有文件的临时路径名，但并不同时创建文件。传入数组时成功返回该数组指针并写入名称；传 NULL 时成功返回内部静态数组指针，后续调用可能覆盖它；无法生成时返回 NULL。检查名称到真正创建文件之间存在竞态，其他程序可能抢先占用，因此优先用 tmpfile。",
    "setvbuf-function": "在流进行任何其他 I/O 之前设置缓冲方式：`_IOFBF` 为全缓冲、`_IOLBF` 为行缓冲、`_IONBF` 为无缓冲，并可提供 buffer 与 size。设置成功返回 0，无法采用请求时返回非零。自备缓冲区必须一直存活到流关闭；该调用只配置策略，不会返回实际采用的内部容量。",
    "setbuf-function": "用简化接口为 stream 选择缓冲方式：buffer 为 NULL 时请求无缓冲，否则用至少 BUFSIZ 字节的数组作为全缓冲区。它必须在该流执行其他操作前调用，而且自备数组要一直存在到流关闭。函数没有返回值，无法报告配置失败；需要状态、行缓冲或自定义大小时应改用 setvbuf。",
    "file-type": "表示一个已经建立的标准 I/O 流控制对象，内部记录当前位置、缓冲区、文件结束和错误状态等信息；这些成员是不透明的，程序只能持有 `FILE *` 并交给 stdio 函数。打开函数成功会返回这种指针，关闭后指针立即失效。不能按值复制 FILE、猜测内部布局或在多个函数中重复关闭同一流。",
    "stderr-streams": "程序启动时预先提供三个 FILE 流：stdin 是默认输入，stdout 承载普通结果，stderr 承载诊断信息。它们可能连接终端，也可能被重定向到文件或管道；stdout 常按环境选择行缓冲或全缓冲，stderr 的行为也不应靠猜测。读写函数各自返回成功或失败，跨流显示顺序需要显式 fflush 协调。",
    "eof-constant": "表示“没有读到普通字符”的负 int 常量，字符输入函数在文件结束或错误时返回它，部分字符输出函数失败时也返回它。EOF 的具体负值由实现决定，不能写死为 -1，也不能先塞进 char 再比较。输入函数返回 EOF 后还要查 feof 和 ferror 才能区分正常结束与错误；块读写函数则返回对象数量。",
    "bufsiz-constant": "给出实现认为适合标准 I/O 缓冲区的一个正整数，可用来声明交给 setbuf 的数组或作为普通块大小参考。它的数值由 C 实现决定，不保证等于磁盘块大小，也不是 fread、fwrite 必须使用的单位。数组若放在栈上仍会占用相应空间，函数的返回结果也不会因使用 BUFSIZ 就自动成功。",

    "null-stdio-constant": "表示不指向任何对象或函数的空指针常量，可用来检查 fopen、tmpfile、fgets 等指针返回值，也可在接口明确允许时作为参数。stdio.h 与 stddef.h 都能提供该宏，具体展开可能是 0 或其他合法形式。NULL 不是数字错误码；返回 NULL 通常表示失败或无结果，仍要结合对应函数规则判断原因。",
    "printf-specifiers": "规定 printf 家族怎样解释每个实参并生成文字：标志控制符号和填充，宽度给最小栏宽，精度控制小数位或字符串上限，长度修饰符说明整数或浮点类型，最后的转换字母决定表示法。格式必须与默认参数提升后的真实类型一致。函数最终返回生成字符数，格式错配则是未定义行为。",
    "printf-width-precision": "控制格式化结果的排版而不改变原变量：字段宽度是最小宽度，内容更长时不会截断；精度对浮点数常表示小数位数，对字符串表示最多输出的字节数。负号标志左对齐，零标志常用于数字填充。printf 家族成功返回输出字符数，错误返回负数；字符串精度可能截断多字节字符。",
    "printf-string-n-risk": "说明两个容易造成内存问题的转换：`%s` 会从指针开始一直读到空字符，数组未正确结束就会越界读取；`%n` 不输出文字，而把目前已输出的字符数写进对应整数指针。若外部输入直接充当格式串，攻击者可能借这些规则读写内存。应固定格式为 `%s`，函数成功返回正常计数、出错返回负数。",
    "size-t-format": "说明输出 size_t 值时应使用 `%zu`：size_t 是用于对象大小和元素计数的无符号整数类型，底层究竟是 unsigned int、unsigned long 还是别的类型由平台决定。把它硬套 `%lu` 可能造成类型错配和未定义行为。printf 成功返回写出字符数、失败返回负数；scanf 读取 size_t 同样用 `%zu` 并传 size_t 指针。",
    "formatted-output-return": "解释格式化输出函数怎样报告结果：printf、fprintf 等成功时返回实际写出的字符数，负数表示输出或编码错误；sprintf 返回生成字符数。snprintf 与 vsnprintf 即使截断，也返回未截断时本来需要的字符数，因此非负结果大于等于容量就是截断。所有计数都不含末尾空字符，调用者不能只看非负就认定内容完整。",
    "scanf-specifiers": "规定 scanf 家族如何匹配输入、转换值并选择目标指针类型：例如 `%d` 要 int 指针，`%lf` 要 double 指针，`%s` 要有足够空间的字符数组；星号会读取但不赋值。空白、宽度和长度修饰符也会改变消费规则。函数返回成功赋值数，首项不匹配返回 0，首次转换前输入结束或错误返回 EOF。",
    "scanf-field-width": "限制一次 scanf 字符转换最多消费多少个输入字符。对 `%s` 或扫描集，宽度必须至多为目标数组容量减一，因为成功后还会写结尾空字符；对 `%c` 则不会自动补空字符。宽度只防止本次写越界，不会验证尾随垃圾。相关函数返回成功赋值数，匹配失败返回 0，输入先结束可能返回 EOF。",

static const int *binary_search_int(const int *values, size_t count,

    size_t left = 0;
    size_t right = count;

    while (left < right) {
        size_t middle = left + (right - left) / 2U;
        if (values[middle] < target) {
            left = middle + 1U;
        } else {
            right = middle;
        }

    }
    return NULL;

      example: String.raw`#include <stdint.h>
#include <stdio.h>
#include <stdlib.h>

static int push_int(int **items, size_t *size, size_t *capacity, int value) {
    if (*size == *capacity) {
        size_t next_capacity = *capacity == 0U ? 4U : *capacity * 2U;
        if (next_capacity < *capacity ||
            next_capacity > SIZE_MAX / sizeof **items) {
            return 0;
        }

        int *next = realloc(*items, next_capacity * sizeof **items);
        if (next == NULL) {
            return 0;
        }
        *items = next;
        *capacity = next_capacity;
    }

    (*items)[*size] = value;
    ++*size;
    return 1;
}

int main(void) {
    int *items = NULL;
    size_t size = 0;
    size_t capacity = 0;

    for (int value = 1; value <= 6; ++value) {
        if (!push_int(&items, &size, &capacity, value * 10)) {
            free(items);
            return EXIT_FAILURE;
        }
    }
    printf("size=%d last=%d\n", (int)size, items[size - 1U]);
    free(items);
    return EXIT_SUCCESS;
}

  revise("free-function", ["stdlib.h"], "动态对象的最后一个所有者不再需要它时调用 free；只释放分配函数返回的当前地址，并把后续借用全部作废。",

  revise("sizeof-allocation", ["stdlib.h"], "按数组元素数量分配时写 count 乘 sizeof 所指对象，类型改变后表达式会自动保持一致；乘法前还要检查溢出。",

  revise("dynamic-array", ["stdlib.h"], "元素数量在运行时确定时用动态数组保存连续对象；把容量与长度作为独立状态，并在每次下标访问前维护边界。",

  revise("qsort-function", ["stdlib.h"], "需要就地排序任意类型连续数组时使用 qsort；传准确元素数与大小，并提供一致、无溢出的三向比较函数。",

  var behaviors = {
    "malloc-function": "向运行时申请一块至少有 size 个字节的连续存储，返回的地址满足标准类型的对齐要求；对齐就是让地址落在处理器可正确访问该类型的位置。成功时返回指向新存储的指针，内容未经初始化，读取前必须先写入；失败时返回 NULL。size 为 0 时可返回 NULL 或一个不可解引用但可交给 free 的独特指针，不能据此判断普通分配是否成功。",
    "calloc-function": "为 count 个元素申请连续存储，每个元素占 element_size 字节，并把整块存储的每个字节先置零。成功时返回指向新块的指针，用完要 free；总大小无法表示或分配失败时返回 NULL。任一尺寸为 0 时可返回 NULL 或不可解引用的独特指针。全零字节能表示整数 0，但不保证对所有指针或浮点类型都等于语义上的零值。",
    "realloc-function": "调整 pointer 所指动态存储块的大小为 new_size，可能原地调整，也可能搬到新地址。new_size 大于 0 时，成功返回新块指针，原块随即失效，前后共有范围的数据保留，新增字节未初始化；失败返回 NULL，原块仍然有效。pointer 为 NULL 时等同 malloc；new_size 为 0 的所有权细节跨标准版本易变，应改为显式 free，避免依赖。",
    "free-function": "释放先前由 malloc、calloc、realloc 或 aligned_alloc 返回且尚未释放的动态存储，使那块空间可以被再次分配。函数没有返回值；pointer 为 NULL 时什么也不做。释放后该指针以及所有指向块内的别名都变成悬空指针，不能再读写。重复释放、释放栈变量、内部偏移地址或其他非分配起始地址都会产生未定义行为。",
    "sizeof-allocation": "按“元素个数乘每个元素大小”计算数组所需字节，并用 `sizeof *p` 让大小自动跟随 p 所指类型，避免类型改了却忘改分配式。malloc 成功返回新块地址，失败返回 NULL；但在调用前还必须确认 count 不大于 `SIZE_MAX / sizeof *p`，否则乘法会回绕成较小数，随后按原数量访问就会越界。sizeof 不会真的解引用 p。",
    "dynamic-array": "在运行时才知道元素数量时，申请一块连续动态存储并把它当数组使用；指针本身不记录长度，所以必须另存当前长度与容量，每次下标都要小于长度。分配函数成功返回首元素地址、失败返回 NULL；扩容 realloc 可能移动整块存储，使旧元素指针全部失效。容量乘元素大小还要先检查溢出，最后由唯一所有者 free。",
    "flexible-array-member": "让结构体最后一个成员写成不带长度的数组，从而把固定头部和变长尾部一次分配在同一块内存中。`sizeof(struct Packet)` 只含固定部分和必要填充，调用者要再加尾部元素数乘元素大小，并另外保存实际长度。分配成功返回整块地址、失败返回 NULL；尾部不能越过额外空间，按值复制结构体也不会自动复制全部尾部数据。",
    "qsort-function": "把 base 指向的 count 个定长元素在原数组内排序，每个元素占 size 字节；库反复调用 compare，比对两个元素并根据负数、0、正数决定先后。函数没有返回值，也不报告比较器错误；count 小于 2 时数组保持不变。比较规则若前后矛盾，或用可能溢出的相减结果，会让行为不可依赖；相等元素的原相对顺序也不保证保留。",
    "bsearch-function": "在已经按 compare 同一规则排好序的数组中做二分查找：每次比较 key 与中间元素，再排除一半范围。找到相等元素时返回指向原数组中该元素的指针；找不到或 count 为 0 时返回 NULL。若有多个相等元素，返回哪一个没有规定；数组未排序、size 错误或比较规则与排序时不同，结果没有可靠含义。",
    "strtol-function": "把 text 开头可识别的整数文字转换成 long：先跳过空白，读取可选正负号，再按 base 解析数字；base 为 0 时可由前缀选择进制。返回转换值，并让 `*end` 指向第一个未使用字符；没有数字时返回 0 且 end 指回起点。正溢出返回 LONG_MAX、负溢出返回 LONG_MIN，并把 errno 设为 ERANGE；合法边界值必须结合 errno 判断。",
    "aligned-alloc-function": "申请一块起始地址满足 alignment 对齐要求、大小为 size 字节的动态存储，适合需要特定边界的对象或硬件接口。alignment 必须是实现支持的有效对齐值，size 必须是 alignment 的整数倍；满足约束且成功时返回对齐指针，内容未初始化，失败时返回 NULL。返回的块最终用 free 释放；零大小和无效约束不应作为可移植用法依赖。",
    "atoi-function": "把 string 开头的十进制整数字符串转换成 int，会跳过前导空白并接受正负号，遇到第一个非数字字符停止。可表示且有数字时返回对应整数；没有可转换数字时返回 0。它没有 end 指针也不可靠报告错误，合法的文本 `\"0\"` 与失败无法区分；若数学结果超出 int 范围，行为未定义，因此外部输入应改用 strtol 并检查范围。",
    "atol-function": "把 string 开头的十进制文字转换成 long，处理前导空白、可选符号和连续数字，随后忽略尾部未转换字符。正常时返回得到的 long，没有数字时返回 0；但它不提供结束位置或 errno，无法区分失败与合法零。结果超出 long 可表示范围时行为未定义，不能拿返回的 LONG_MAX 当可靠溢出标志，需诊断时应使用 strtol。",
    "atoll-function": "把字符串开头的十进制整数转换成 long long：跳过空白、读取符号和数字，在首个不合规则字符处停止。可表示时返回转换值，没有数字时返回 0。函数没有错误通道，也不告诉调用者读到哪里，超出 long long 范围时行为未定义；因此处理用户、文件或网络文本时应使用 strtoll 并同时检查 endptr 与 ERANGE。",
    "atof-function": "把 string 开头的浮点文字转换成 double，可识别前导空白、符号、小数、指数以及实现支持的特殊形式。可表示时返回转换结果，没有可转换内容时返回 0.0。它不提供结束指针，也不能可靠区分合法零、格式错误、上溢或下溢；结果无法表示时行为未定义，所以需要验证的输入应使用 strtod 并检查 endptr 和 errno。",
    "strtoll-function": "把字符串开头按 base 转成 long long，并通过 endptr 告诉调用者解析停止位置；会跳过空白和符号，base 为 0 时可按前缀选进制。成功返回转换值，没有数字时返回 0 且 endptr 指回起点。正溢出返回 LLONG_MAX、负溢出返回 LLONG_MIN，并把 errno 设为 ERANGE；边界数本身可能合法，必须先清 errno 再联合判断。",
    "strtoul-function": "把字符串开头按 base 转成 unsigned long，跳过空白并接受可选正负号；负号会对得到的无符号数取负，因此 `\"-1\"` 可能得到 ULONG_MAX，不能当成自动拒绝负数。成功返回转换值并用 endptr 指向剩余文本；无数字返回 0 且 endptr 指回起点；超出范围返回 ULONG_MAX 并设置 errno 为 ERANGE。",
    "strtoull-function": "把字符串开头按指定进制转换成 unsigned long long，并把第一个未转换字符的位置写给 endptr。它接受前导空白、正负号和 base 为 0 的进制前缀；负号按无符号算术作用，不等于格式失败。成功返回数值，无数字返回 0 且 endptr 指向起点；范围溢出返回 ULLONG_MAX，并把 errno 设为 ERANGE。",
    "strtod-function": "把字符串开头的浮点表示转换成 double，并让 endptr 指向第一个未使用字符，可据此拒绝空输入或尾随垃圾。正常时返回转换值；没有任何可转换内容时返回 0.0 且 endptr 指回起点。上溢通常返回带正确符号的 HUGE_VAL，下溢返回极小值或 0，并把 errno 设为 ERANGE；合法的巨大或零值要结合预先清零的 errno 判断。",
    "strtof-function": "把字符串开头的浮点文字转换成 float，解析规则类似 strtod，但结果范围和精度是 float。成功返回转换值并通过 endptr 给出停止位置；没有数字时返回 0.0F 且 endptr 指回起点。上溢返回带符号的 HUGE_VALF，下溢返回极小值或 0，并以 errno 的 ERANGE 报告范围问题；尾随字符不会自动算失败。",
    "strtold-function": "把字符串开头的浮点文字转换成 long double，并用 endptr 标出未转换的余下部分，适合需要该类型更大范围或精度的解析。成功返回转换值；没有数字时返回 0.0L 且 endptr 指回起点。上溢返回带符号的 HUGE_VALL，下溢返回极小值或 0，并设置 errno 为 ERANGE；仍应检查尾随内容是否符合协议。",
    "rand-function": "从当前伪随机状态产生下一个整数；伪随机表示序列由算法确定，看似杂乱但可由相同种子重现。每次调用返回 0 到 RAND_MAX 之间的值，包含两端，没有失败返回值。它的质量、周期和低位分布由实现决定，`rand() % n` 还可能有取模偏差，因此不能用于密码、令牌或其他安全用途。",
    "srand-function": "用 seed 重置 rand 的伪随机序列起点；同一实现中给相同种子，后续 rand 会返回相同序列，未调用 srand 通常等同先用种子 1。函数没有返回值，也不会生成随机数。常量种子便于复现实验，用当前时间只会改变普通模拟序列，仍不具备安全随机性；并发共享状态还需要额外协调。",
    "rand-max-constant": "给出 rand 可能返回的最大整数，且至少为 32767；因此 rand 的完整返回范围是 0 到 RAND_MAX，包含上下界。具体值由实现决定，不能假定固定为 32767 或某个二进制掩码。用它可把结果缩放成比例，但整数取模可能使各结果概率不均匀，也不能把更大的 RAND_MAX 当作密码学安全保证。",
    "abs-function": "计算 int value 的绝对值：非负数原样返回，负数在可表示时返回相反数，所以返回结果通常不小于 0。特殊边界 INT_MIN 的正值无法用 int 表示，对它调用会产生未定义行为；函数没有独立失败码。它只处理 int，long 和 long long 分别要用 labs、llabs，浮点绝对值则属于 math.h。",
    "labs-function": "计算 long value 到零的非负距离；输入大于等于 0 时返回原值，普通负数返回其相反数。若输入是 LONG_MIN，因为对应正数超出 long 范围，行为未定义，而不是可靠返回 LONG_MAX 或错误码。函数没有失败返回值，调用前需要排除该边界；其他整数宽度应选择相匹配的 abs 或 llabs。",
    "llabs-function": "计算 long long 整数的绝对值，可表示时对非负输入返回原值，对负输入返回相反数。LLONG_MIN 没有可表示的正对应值，对它调用会产生未定义行为，函数也不会返回错误标志。若数据可能包含整个 long long 范围，应先单独处理该边界；不要用较窄的 abs 或 labs 代替。",
    "div-function": "一次计算两个 int 的整数商和余数，把结果放在 div_t 结构的 quot 与 rem 成员中返回。商向零截断，满足 `numerator == quotient * denominator + remainder`，余数绝对值小于分母且非零时符号与分子相同。denominator 为 0，或 INT_MIN 除以 -1 导致商不可表示时，行为未定义，没有错误返回值。",
    "ldiv-function": "用 long 精度同时计算分子除以分母的整数商与余数，并返回含 quot、rem 两个 long 成员的 ldiv_t。商向零截断，余数与分子同号或为零，且可由“商乘分母加余数”还原分子。分母为 0，或 LONG_MIN 除以 -1 使结果越界时行为未定义，调用者必须事先排除。",
    "lldiv-function": "对 long long 分子和分母同时求整数商与余数，返回的 lldiv_t 中 quot 是向零截断的商，rem 是余数；余数非零时与分子同号，绝对值小于分母。函数没有失败状态，denominator 为 0 会产生未定义行为，LLONG_MIN 除以 -1 因商不可表示也未定义，因此这两个特殊输入必须先检查。",
    "exit-function": "以正常终止流程结束整个程序，并把 status 交给宿主环境。它先按注册顺序的反向调用 atexit 回调，再刷新并关闭所有标准 I/O 流、删除 tmpfile 创建的临时文件；函数不会返回，调用点之后的语句不可达。回调若再次调用 exit 或未正常返回会带来未定义行为；状态通常用 EXIT_SUCCESS 或 EXIT_FAILURE 表达。",
    "atexit-function": "注册一个无参数、无返回值的函数，让它在程序以后通过 exit 或从 main 返回而正常终止时执行；多个回调按注册的反向顺序调用。注册成功返回 0，容量不足等失败返回非零，此时该函数不会被登记。标准保证至少可注册 32 个；abort、quick_exit 和进程被外部强制结束时不会走这组普通回调。",
    "at-quick-exit-function": "把回调登记到 quick_exit 专用列表，程序快速正常终止时按注册的反向顺序调用；它与 atexit 的列表彼此独立。注册成功返回 0，失败返回非零，失败的回调不会执行。回调必须无参数且返回 void，并应只做适合快速终止的有限清理；普通 exit、从 main 返回或 abort 都不会调用这组函数。",
    "quick-exit-function": "以快速正常终止方式结束程序，把 status 交给宿主环境，并按反向注册顺序运行 at_quick_exit 回调。函数不会返回，后续语句不可达；它不执行 atexit 回调，也不保证刷新或关闭所有标准 I/O 流，所以尚在缓冲区的数据可能丢失。状态可用 EXIT_SUCCESS 或 EXIT_FAILURE，回调中再次触发终止会使结果不可依赖。",
    "abort-function": "立即请求异常终止程序并引发 SIGABRT 信号，用于无法继续运行的严重内部错误。函数不会返回；即使已安装的信号处理器先被调用，若处理器正常返回，异常终止仍会继续。它不执行 atexit 或 at_quick_exit 回调，也不能依赖标准 I/O 缓冲被刷新，因此需要保留的诊断应在调用前尽力写出。",
    "exit-status-constants": "提供两个可移植的程序终止状态：EXIT_SUCCESS 表示成功，EXIT_FAILURE 表示一般失败，可从 main 返回，也可传给 exit 或 quick_exit。宏的具体整数值由实现决定，EXIT_SUCCESS 不要求宏值本身一定写成 0，EXIT_FAILURE 也不能猜成 1。宿主环境最终如何显示或截取状态仍由操作系统决定。",
    "getenv-function": "按 name 查找宿主环境中的变量。找到时返回指向实现内部字符串的指针，值可能是空字符串；没找到时返回 NULL，所以空值与不存在必须分开判断。返回内容不能由调用者修改或 free，后续 getenv 或其他环境操作可能使它变化或失效；name 的合法形式和线程安全细节由平台决定，环境内容也应视为不可信输入。",
    "system-function": "把 command 字符串交给宿主环境的命令处理器执行，具体语法、副作用和状态编码都依赖平台。command 为 NULL 时不执行命令：存在可用处理器返回非零，否则返回 0；command 非 NULL 时返回实现定义的执行状态，不能按纯 ISO C 假定某个固定成功码或失败码。外部输入若拼入命令会造成命令注入，应避免。",
    "mb-cur-max-macro": "给出当前 LC_CTYPE 区域设置下，一个多字节字符最多可能占用的字节数；多字节字符是用一个或多个 char 字节表示一个文字字符的编码单元。结果类型为 size_t，值至少是 1，并会随 setlocale 改变，所以每次需要时重新读取。它是最大上限，不是当前具体字符的实际长度，也未必能作编译期数组常量。",
    "mblen-function": "检查 string 开头在当前区域设置中是否构成一个完整多字节字符，最多查看 size 个字节。普通有效字符返回其占用字节数，遇到空字符返回 0，无效或在给定上限内不完整时返回负数。string 为 NULL 时重置内部转换状态，并返回编码是否依赖状态的非零或零结果；状态式编码会跨调用保存上下文。",
    "mbtowc-function": "按当前 LC_CTYPE 编码把 string 开头的一个多字节字符转换成 wchar_t，若 wide 非 NULL 就把宽字符写入那里，最多读取 size 个字节。普通字符返回消耗字节数，空字符返回 0，无效或不完整序列返回负数。string 为 NULL 时重置内部状态并返回编码是否有状态；wide 为 NULL 只是不保存结果，仍会执行转换。",
    "wctomb-function": "把一个 wchar_t 宽字符按当前区域设置编码成多字节序列，写到 string，调用者要预留至少 MB_CUR_MAX 字节。字符可表示时返回写入的字节数；在当前编码中不可表示时返回 -1。string 为 NULL 时不写数据，而是重置内部转换状态并返回编码是否依赖状态的非零或零值；该接口共享内部状态，交错或并发使用要谨慎。",
    "mbstowcs-function": "从 string 开始把完整多字节字符串按当前区域设置转换到 wide 数组，最多写 count 个 wchar_t。遇到源结尾且容量足够时会写宽空字符，并返回此前转换的宽字符数，不含结尾；若先达到 count，则返回已写数量且结果可能没有终止符；遇到无效多字节序列返回 `(size_t)-1`。源和目标重叠会产生未定义行为。",
    "wcstombs-function": "把 wide 指向的宽字符串按当前区域设置编码到 string，最多写 count 个字节，并且不会写下一字符的一部分。若在容量内遇到宽空字符，会写普通空字符并返回此前字节数，不含结尾；容量先用完时返回已写字节数且可能没有终止符；遇到当前编码无法表示的宽字符返回 `(size_t)-1`。源和目标不能重叠。",
    "allocation-ownership-pitfall": "说明动态内存不仅要检查分配结果，还要明确谁负责最终 free，这种责任称为所有权。malloc 家族成功返回可管理的块、失败返回 NULL；realloc 失败时旧块仍归原指针所有，所以必须先用临时指针接结果。遗漏释放会泄漏，重复释放、释放后访问或越界会产生未定义行为；容量、长度和所有者应始终分别记录。"

  <script data-source="data/entries/30-string.js">
(function () {

  var program = window.C_SYNTAX_PROGRAM;

  var behaviors = {
    "strlen-function": "从一个 C 字符串的开头数到第一个空字符 '\\0'；空字符是标记字符串结束、数值为零的隐藏字节，它本身不计入长度。函数返回前面共有多少个字节，空字符串返回 0。它数的是字节而不是人眼看到的文字个数；如果输入没有结束标记，继续越界读取属于未定义行为，也就是 C 标准不规定程序会发生什么。",
    "string-copy": "把 source 指向的源字符串逐字节复制到 destination 指向的目标数组，结尾空字符 '\\0' 也一起复制，所以目标会成为完整字符串。函数返回 destination，也就是目标首地址，不会另外报告容量不足。目标空间放不下或两块区域重叠时属于未定义行为，因此复制前必须由调用者确认容量和范围。",
    "strncpy-function": "从 source 向 destination 最多写入 count 个字符。源字符串不足 count 个字符时，它会复制结尾空字符并用更多零字节填满 count 个位置；源长度达到或超过 count 时，只复制前 count 个字符，不会自动补结尾空字符。函数返回 destination；因此它主要处理定长字段，不能把“限长”误当成一定得到可用字符串。",
    "strcat-function": "先在 destination 中找到结尾空字符，再从那里开始复制整个 source，并把 source 的结尾空字符也写进去，于是两个字符串首尾相接。函数返回 destination 的原始首地址。它不知道目标数组有多大；目标原有内容加源内容再加一个结尾字节若超过容量，或源与目标重叠，结果都是未定义行为。",
    "strncat-function": "先找到 destination 的结尾，再从 source 追加至多 count 个非空字符；遇到 source 自己的结尾会提前停止，最后总会在追加结果后写一个空字符。函数返回 destination。count 表示最多取多少个源字符，不是目标总容量，所以目标至少要留出实际追加字符数再加 1 个字节的位置。",
    "strcmp-function": "比较两个字符串的先后顺序，规则像查词典比单词：从第一个字符开始逐个比较，遇到不同字符或某一边结束就停止。返回值有三种情况：左边小于右边 → 返回负数；两个字符串相等 → 返回 0；左边大于右边 → 返回正数。很多实现恰好用 -1、0、1，但 C 标准只保证正负零，因此判断时必须写 `< 0`、`== 0` 或 `> 0`，不能只等于 -1。",
    "strncmp-function": "从两个字符串开头逐个比较，但最多检查 count 个字符；遇到不同字符或空字符会提前停止。若 count 为 0，函数不比较内容并返回 0；检查范围内相同也返回 0；左边第一个不同字符较小就返回负数，较大就返回正数。C 标准只保证返回值的正负零，不保证恰好是 -1 或 1，也不能用它证明 count 之后仍然相同。",
    "strchr-function": "从字符串开头向后寻找 character 指定的第一个字节；传入的整数会先转换成 unsigned char，数值 0 还能用来寻找字符串末尾的空字符。找到时返回指向原字符串中该位置的指针，没找到时返回 NULL。返回地址属于原对象，并不是新复制出的字符串，原对象失效后也不能再使用它。",
    "strrchr-function": "扫描整个字符串，找出 character 指定字节最后一次出现的位置；整数参数会按 unsigned char 解释，查找 0 时命中末尾空字符。找到后返回指向原字符串内部的指针，没有出现则返回 NULL。例如在 `a/b/c` 中查找 `/`，得到的是第二个斜杠的位置，而不是第一次出现的位置。",
    "strstr-function": "在 haystack 这段完整字符串中查找 needle 这段连续子串，并选择第一次出现的位置。找到时返回指向 haystack 内部起点的指针，找不到时返回 NULL；如果 needle 是空字符串，则直接返回 haystack 的开头。它按字节且区分大小写，不会把通配符或正则表达式当成特殊规则。",
    "strtok-function": "把可修改字符串按 delimiters 中任意一个分隔字符切成一段段记号。首次调用传入字符串，它会把遇到的分隔符改写成空字符并返回第一段的开头；后续传 NULL 会接着上次位置处理，没有更多记号时返回 NULL。连续分隔符会被跳过而不产生空字段；继续位置保存在共享的静态存储中，也就是函数跨调用保留的一份内部状态。",
    "strspn-function": "从 string 的第一个字节开始计数，只要当前字节出现在 accept 给出的字符集合里就继续，遇到第一个不在集合中的字节或字符串末尾便停止。函数返回这段连续前缀的字节数；首字节就不匹配或字符串为空时返回 0，全部匹配时返回整个字符串长度。accept 是单个字符的集合，不是一个必须连续出现的单词。",
    "strcspn-function": "从 string 开头计数，只要当前字节没有出现在 reject 字符集合中就继续，碰到任意拒绝字符或字符串末尾时停止。函数返回停止前的字节数，所以它也能给出第一个分隔符的下标：首字节就是分隔符时返回 0，始终没碰到拒绝字符时返回整个字符串长度，reject 为空时也会得到全长。",
    "strpbrk-function": "从 string 开头逐字节查找 accept 集合中的任意一个字符，而不是查找完整的 accept 字符串。第一次命中时返回指向原字符串中该字节的指针；扫描到结尾仍未命中，或 accept 为空时返回 NULL。例如用 `=:` 查找 `key=value`，会返回等号所在位置。",
    "strerror-function": "把一个整数错误编号翻译成当前实现提供的可读说明文字。函数返回指向说明字符串的指针，调用者只读取它，不能释放或修改；后续再次调用 strerror 时，这块内部文本可能被覆盖。错误编号未知时，返回文字的具体内容由实现决定，因此程序判断错误仍应使用编号，不能依赖某句固定文案。",
    "strcoll-function": "按照当前 LC_COLLATE 区域设置规定的文字排序规则比较 left 和 right，而不是固定按字符编码比较。左边排在右边前面时返回负数，两边排序相等时返回 0，左边排在后面时返回正数；C 标准同样不保证结果恰好是 -1 或 1。同一对文字在不同区域设置下可能得到不同顺序。",
    "strxfrm-function": "把 source 转换成一种排序键，使同一区域设置下两个排序键用 strcmp 比较时，顺序与原字符串用 strcoll 比较一致。它向 destination 最多写 count 个字节，并返回完整排序键所需的长度，不含结尾空字符；返回值小于 count 才说明目标中装下了完整键，返回值大于或等于 count 表示空间不足，目标内容不能当成完整键使用。",
    "memcpy-function": "把 source 开始的 count 个字节原样复制到 destination，既不寻找空字符，也不关心这些字节代表整数、结构体还是文本。函数返回 destination。两段内存必须都至少有 count 个可访问字节，而且不能重叠；只要重叠就属于未定义行为，需要改用 memmove。它复制指针成员时只复制地址数值，不会连同指向的对象一起复制。",
    "memmove-function": "把 source 开始的 count 个字节搬到 destination，即使两段范围部分重叠也能保持原始数据，效果如同先完整复制到临时区域再写入目标。函数返回 destination。它只解决重叠次序问题，不检查源和目标容量；任何一边少于 count 个可访问字节仍会越界，也不会自动添加字符串结尾。",
    "memset-function": "把 value 先转换成一个 unsigned char 字节，再把这个字节重复写入 destination 开始的 count 个位置。函数返回 destination。例如值 0 常用来清零字节缓冲区；但给 int 数组填 1 得到的是每个字节都为 1，并不等于把每个 int 元素赋值为 1。它按字节工作，也不会检查目标实际容量。",
    "memcmp-function": "把 left 和 right 开始的 count 个字节当作 unsigned char 序列，从前向后比较，遇到第一个不同字节便决定大小。左边较小返回负数，全部 count 个字节相同返回 0，左边较大返回正数；count 为 0 时返回 0。标准只保证正负零，不保证 -1 或 1；相等也只说明这段字节相同，不能推断两个更大的对象处处相同。",
    "memchr-function": "在 memory 开始的前 count 个字节中寻找 value；value 会先转换成 unsigned char，所以它搜索的是一个具体字节，也能搜索零字节。找到第一次出现的位置时返回指向原内存内部的指针，范围内没有该字节时返回 NULL，count 为 0 时也返回 NULL。它不依赖字符串结尾，因而可以检查二进制数据。",
    "string-buffer-overflow": "说明复制或拼接字符串前为什么必须先算目标容量。需要容纳的空间包括已有目标内容、准备加入的源内容和最后一个空字符；若长度相加发生 size_t 无符号溢出，表面上的“小结果”也不可信。容量不足却继续调用 strcpy 或 strcat 会写出数组边界，属于未定义行为，可能破坏其他数据或直接崩溃。",
    "strncpy-missing-terminator": "展示 strncpy 被截断后缺少字符串结束标记的陷阱。若源长度达到复制上限，目标最后没有空字符，随后调用 strlen、strcmp 等函数就会越过数组继续读取。常见防护是在 capacity 大于 0 时只复制 capacity - 1 个字符，再明确把最后一个位置写成 '\\0'；capacity 为 0 时必须先退出，避免减一产生无符号下溢。",
    "strtok-shared-state": "解释 strtok 为什么不能安全地同时拆分两条字符串：它把“下一次从哪里继续”放在函数内部共享状态中，新的拆分序列会覆盖旧位置，线程并发调用也会互相干扰。单一路径中首次传字符串、以后传 NULL 可以正常推进；若需要嵌套、并发或保留空字段，就应由调用者保存游标并自行扫描。",
    "string-literal-write": "区分只读的字符串字面量和真正可修改的字符数组。`const char *text = \"fixed\"` 让指针引用程序中的字面量，通过任何指针改写它都属于未定义行为；`char text[] = \"fixed\"` 则创建一份数组副本，可以修改其中元素。使用 const 能让编译器提前拦住许多误写，但即使去掉 const 也不会让字面量变成可写内存。",

      "size_t strlen(const char *string);", "计算已终止 C 字符串的字节长度时调用 strlen；结果不含末尾空字符，也不等于多字节文本的字符个数。",
      ["const char text[] = \"C11\";", "size_t length = strlen(text);", "if (length != 3U) return 1;"],
      "strlen 会一直读取到首个空字符，未终止的字符数组不能作为实参。", "strlen 返回 size_t；容量加一或累加前应防止无符号溢出。"),
    lib("string-copy", "字符串复制", ["strcpy", "复制字符串", "缓冲区"], "strcpy 把源字符串连同末尾空字符复制到目标数组。",
      "char *strcpy(char *destination, const char *source);", "仅在目标容量足够且源、目标不重叠时使用 strcpy；返回目标指针，容量未知时应改用显式边界设计。",
      ["char target[8];", "char *result = strcpy(target, \"C11\");", "if (result != target || strcmp(target, \"C11\") != 0) return 1;"],
      "strcpy 不接收容量参数，目标空间不足会造成越界写入和未定义行为。", "strcpy 的源和目标若重叠，应改用允许重叠区域的 memmove。"),
    lib("strncpy-function", "strncpy", ["限长字符串复制"], "strncpy 最多复制指定数量的字符，并在源较短时填充空字符。",
      "char *strncpy(char *destination, const char *source, size_t count);", "向定长字段复制文本时可用 strncpy；源长度达到上限时要手动补终止符，普通截断更适合显式长度逻辑。",
      ["char target[5];", "strncpy(target, \"abc\", sizeof target);", "if (strcmp(target, \"abc\") != 0 || target[3] != '\\0') return 1;"],
      "源长度大于或等于 count 时，strncpy 不会自动写入结尾空字符。", "源较短时 strncpy 会清零剩余 count 范围，大缓冲区上可能有额外开销。"),
    lib("strcat-function", "strcat", ["字符串拼接"], "strcat 把源字符串追加到目标字符串末尾。",
      "char *strcat(char *destination, const char *source);", "目标已是终止字符串且剩余容量足够时用 strcat 追加完整源串；需要限制追加量时改用 strncat 并计算余量。",
      ["char text[12] = \"C\";", "char *result = strcat(text, \" language\");", "if (result != text || strcmp(text, \"C language\") != 0) return 1;"],
      "strcat 会先寻找目标末尾，目标必须已终止且总容量容得下拼接结果。", "strcat 的两个区域不得重叠，循环中反复追加还会重复扫描目标。"),
    lib("strncat-function", "strncat", ["限长字符串拼接"], "strncat 追加至多指定数量的源字符并补空字符。",
      "char *strncat(char *destination, const char *source, size_t count);", "追加源串前若干字符时用 strncat；第三参数是最多读取的源字符数，不是目标总容量，应按剩余空间减一计算。",
      ["char text[8] = \"ab\";", "size_t room = sizeof text - strlen(text) - 1U;", "strncat(text, \"cdefgh\", room);", "if (strcmp(text, \"abcdefg\") != 0) return 1;"],
      "strncat 追加 count 个字符后还要写终止符，目标必须额外留一字节。", "strncat 仍要求目标原本是有效字符串，且源与目标不能重叠。"),
    lib("strcmp-function", "strcmp", ["字符串比较"], "strcmp 按 unsigned char 序列的字典序比较两个字符串。",
      "int strcmp(const char *left, const char *right);", "比较两个完整 C 字符串时用 strcmp；只判断返回值小于、等于或大于零，不能假定差值恰为负一或正一。",
      ["int equal = strcmp(\"C11\", \"C11\");", "int order = strcmp(\"abc\", \"abd\");", "if (equal != 0 || order >= 0) return 1;"],
      "strcmp 区分大小写且受执行字符集排序影响，不是自然语言排序函数。", "二进制块可能含零字节，比较它们应使用带长度的 memcmp。"),
    lib("strncmp-function", "strncmp", ["限长字符串比较"], "strncmp 最多比较两个字符串的前 count 个字符。",
      "int strncmp(const char *left, const char *right, size_t count);", "比较固定前缀或受限字段时用 strncmp；仍只看返回值符号，count 为零时不访问输入并返回零。",
      ["int prefix = strncmp(\"prefix-one\", \"prefix-two\", 7U);", "int different = strncmp(\"abc\", \"abd\", 3U);", "if (prefix != 0 || different >= 0) return 1;"],
      "strncmp 遇到首个空字符便停止，因此不是任意 count 字节的通用比较。", "验证前缀时还需决定比前缀更短的输入是否应被业务规则接受。"),
    lib("strchr-function", "strchr", ["查找字符", "首次出现"], "strchr 返回字符在字符串中首次出现的位置。",
      "char *strchr(const char *string, int character);", "查找字符串内第一个指定字节时用 strchr；命中返回内部指针，未命中返回 NULL，传零可定位终止符。",
      ["const char text[] = \"banana\";", "const char *found = strchr(text, 'a');", "if (found == NULL || found - text != 1) return 1;"],
      "strchr 的 character 按 unsigned char 转换；它查找字节而不是多字节字符。", "strchr 的结果属于原字符串，不能越过原对象生命周期继续解引用。"),
    lib("strrchr-function", "strrchr", ["反向查找字符", "最后出现"], "strrchr 返回字符在字符串中最后一次出现的位置。",
      "char *strrchr(const char *string, int character);", "查找文件名最后一个分隔符等场景用 strrchr；未找到返回 NULL，与 strchr 的首次命中语义不同。",
      ["const char text[] = \"a/b/c\";", "const char *found = strrchr(text, '/');", "if (found == NULL || strcmp(found, \"/c\") != 0) return 1;"],
      "strrchr 必须扫描到字符串结尾才能确定最后位置，输入必须正确终止。", "对字面量调用 strrchr 后应用 const 指针接收，不能借结果修改字面量。"),
    lib("strstr-function", "strstr", ["查找子串"], "strstr 查找一个字符串在另一字符串中的首次连续出现。",
      "char *strstr(const char *haystack, const char *needle);", "搜索完整子串时用 strstr；命中返回宿主串内部起始地址，未命中返回 NULL，空 needle 总匹配起点。",
      ["const char text[] = \"learn C11 today\";", "const char *found = strstr(text, \"C11\");", "if (found == NULL || found - text != 6) return 1;"],
      "strstr 按字节且区分大小写，不提供通配符、正则或区域设置规则。", "长文本中继续搜索应从上次命中后开始，避免每次都从头扫描。"),
    lib("strtok-function", "strtok", ["字符串分词", "tokenize"], "strtok 用分隔字符集合把可修改字符串拆成记号。",
      "char *strtok(char *string, const char *delimiters);", "简单单线程分词时先传可写字符串，再以 NULL 继续；strtok 会改写分隔符且不保留空字段，复杂解析应手写游标。",
      ["char text[] = \"red,green,blue\";", "char *first = strtok(text, \",\");", "char *second = strtok(NULL, \",\");", "if (first == NULL || second == NULL || strcmp(second, \"green\") != 0) return 1;"],
      "strtok 会在输入数组写入空字符，因此不能把字符串字面量作为首参。", "标准 strtok 使用共享隐藏状态，嵌套解析或多个线程会互相干扰。"),
    lib("strspn-function", "strspn", ["接受字符前缀长度"], "strspn 计算开头连续属于接受集合的字节数。",
      "size_t strspn(const char *string, const char *accept);", "跳过开头一组许可字符时用 strspn；返回前缀长度，可直接作为下标定位第一个不在集合的字节。",
      ["const char text[] = \"123abc\";", "size_t digits = strspn(text, \"0123456789\");", "if (digits != 3U || text[digits] != 'a') return 1;"],
      "strspn 的 accept 是字符集合而不是子串，其中顺序与重复不影响结果。", "strspn 返回零可能是首字符不匹配，也可能是输入或接受集合为空。"),
    lib("strcspn-function", "strcspn", ["排除字符前缀长度"], "strcspn 计算开头连续不属于拒绝集合的字节数。",
      "size_t strcspn(const char *string, const char *reject);", "寻找任一分隔符首次位置时用 strcspn；返回值可作下标，若等于 strlen 则没有拒绝字符。",
      ["const char text[] = \"name:value\";", "size_t position = strcspn(text, \":=\");", "if (position != 4U || text[position] != ':') return 1;"],
      "strcspn 把 reject 中每个字节独立处理，不把多字符文本视为整体。", "reject 为空时结果为整个输入长度，下标处是终止符而非普通字符。"),
    lib("strpbrk-function", "strpbrk", ["查找字符集合"], "strpbrk 返回首个属于给定字符集合的位置。",
      "char *strpbrk(const char *string, const char *accept);", "需要任一候选分隔符的地址时用 strpbrk；它与 strcspn 类似但返回指针，找不到则返回 NULL。",
      ["const char text[] = \"key=value\";", "const char *separator = strpbrk(text, \"=:\");", "if (separator == NULL || *separator != '=') return 1;"],
      "strpbrk 只查找单字节集合，处理 UTF-8 时不能把结果理解为代码点类别。", "命中指针仍指向原数组；原数组只读时不能通过该地址写入。"),
    lib("strerror-function", "strerror", ["错误消息", "错误码文本"], "strerror 返回实现为错误编号提供的说明字符串。",
      "char *strerror(int error_number);", "把库错误码转为可读说明时用 strerror；返回文本由实现管理，应立即使用或复制，机器逻辑仍依据数值错误码。",
      ["const char *message = strerror(0);", "if (message == NULL || message[0] == '\\0') return 1;"],
      "strerror 对未知编号的内容由实现定义，不能依赖固定英文措辞。", "strerror 的内部缓冲区可能被后续调用覆盖，标准接口也不保证并发安全。"),
    lib("strcoll-function", "strcoll", ["本地化字符串比较"], "strcoll 按当前 LC_COLLATE 设置比较字符串。",
      "int strcoll(const char *left, const char *right);", "用户可见文本要遵循当前区域排序规则时用 strcoll；只判断结果符号，稳定协议顺序应使用 strcmp。",
      ["int same = strcoll(\"alpha\", \"alpha\");", "int ordered = strcoll(\"alpha\", \"beta\");", "if (same != 0 || ordered >= 0) return 1;"],
      "strcoll 的顺序受进程区域设置影响，同一输入在不同环境可能结果不同。", "大量重复排序可先用 strxfrm 生成键，再通过 strcmp 比较转换结果。"),
    lib("strxfrm-function", "strxfrm", ["排序键转换"], "strxfrm 把字符串转换为可由 strcmp 比较的区域排序键。",
      "size_t strxfrm(char *destination, const char *source, size_t count);", "重复执行本地化比较时用 strxfrm 预计算键；可先以容量零查询所需长度，再分配长度加一空间。",
      ["char key[32];", "size_t length = strxfrm(key, \"alpha\", sizeof key);", "if (length >= sizeof key || key[0] == '\\0') return 1;"],
      "strxfrm 返回不含终止符的所需长度；达到 count 时目标不能当完整键使用。", "转换结果只适用于生成它时相同的 LC_COLLATE 区域设置。"),
    lib("memcpy-function", "memcpy", ["内存复制", "字节复制"], "memcpy 在不重叠对象间复制指定字节。",
      "void *memcpy(void *destination, const void *source, size_t count);", "复制不重叠数组或二进制块时用 memcpy；长度以字节计并返回目标地址，区域重叠时必须换 memmove。",
      ["int source[3] = {1, 2, 3};", "int target[3] = {0};", "void *result = memcpy(target, source, sizeof source);", "if (result != target || target[2] != 3) return 1;"],
      "memcpy 的源与目标只要发生重叠就是未定义行为，复制方向不能补救。", "memcpy 只复制对象表示；结构体含指针时，副本仍共享所指资源。"),
    lib("memmove-function", "memmove", ["重叠内存复制"], "memmove 可在源和目标区域重叠时安全复制。",
      "void *memmove(void *destination, const void *source, size_t count);", "同一数组内插入、删除或平移可能重叠的片段时用 memmove；已确认完全不重叠时 memcpy 更直接。",
      ["char text[6] = \"ABCDE\";", "void *result = memmove(text + 1, text, 4U);", "text[5] = '\\0';", "if (result != text + 1 || strcmp(text, \"AABCD\") != 0) return 1;"],
      "memmove 的 count 仍须落在两个对象范围内，它只解决重叠而不检查容量。", "效果等价于经临时缓冲复制，但实现不一定真的分配临时数组。"),
    lib("memset-function", "memset", ["内存填充", "字节初始化"], "memset 用同一 unsigned char 值填充存储。",
      "void *memset(void *destination, int value, size_t count);", "清零字节缓冲区或设置字符数组时用 memset；第二参数按 unsigned char 重复，不能当任意类型元素赋值。",
      ["unsigned char bytes[4];", "void *result = memset(bytes, 0xA5, sizeof bytes);", "if (result != bytes || bytes[3] != 0xA5U) return 1;"],
      "memset(array, 1, sizeof array) 对 int 数组设置的是每个字节为一。", "全零字节对所有指针值和浮点格式并无完全可移植的零值保证。"),
    lib("memcmp-function", "memcmp", ["内存比较", "字节序比较"], "memcmp 按 unsigned char 顺序比较指定长度内存。",
      "int memcmp(const void *left, const void *right, size_t count);", "比较协议字段或字节数组时用 memcmp；只根据返回值符号判断顺序，相等仅表示这 count 个字节一致。",
      ["unsigned char left[] = {1U, 2U, 3U};", "unsigned char right[] = {1U, 2U, 4U};", "int order = memcmp(left, right, sizeof left);", "if (order >= 0) return 1;"],
      "memcmp 比较结构体可能读到内容不确定的填充字节，不能替代逐成员比较。", "memcmp 的大小关系是字节字典序，不等于多字节整数的数值顺序。"),
    lib("memchr-function", "memchr", ["内存查找", "查找字节"], "memchr 在固定字节范围找某值的首次出现。",
      "void *memchr(const void *memory, int value, size_t count);", "在可能含零字节的数据块找单个字节时用 memchr；命中返回内部地址，未命中返回 NULL，不要求字符串终止。",
      ["const unsigned char bytes[] = {0U, 4U, 0U, 8U};", "const unsigned char *found = memchr(bytes, 4, sizeof bytes);", "if (found == NULL || found - bytes != 1) return 1;"],
      "memchr 限制在 count 字节内读取，但调用者仍须保证该范围实际可访问。", "value 转为 unsigned char，因此传 260 与查找字节值 4 效果相同。"),

    pit("string-buffer-overflow", "字符串复制与拼接溢出", ["strcpy 危险", "strcat 危险"], "未核对容量会越过目标数组边界。", ["string.h"],
      "if (strlen(source) + 1 <= capacity) { strcpy(destination, source); }", "调用 strcpy 前比较源长加终止符与容量；调用 strcat 还要加目标现有长度，并先排除 size_t 加法溢出。",
      ["const char source[] = \"safe\";", "char target[8];", "if (strlen(source) + 1U > sizeof target) return 1;", "strcpy(target, source);", "if (strcmp(target, source) != 0) return 1;"],
      ["仅把 strcpy 换成 strncpy 不能自动获得安全截断，还必须处理终止符。", "计算 strcat 容量必须包含目标现有长度、源长度和最后空字符。", "外部输入的长度校验应在任何复制前完成，并保留异常处理路径。"]),
    pit("strncpy-missing-terminator", "strncpy 缺少终止符", ["非终止字符串", "截断陷阱"], "strncpy 截断源文本时不保证目标以空字符结尾。", ["string.h"],
      "strncpy(destination, source, capacity - 1); destination[capacity - 1] = '\\0';", "截断到固定缓冲区时最多复制 capacity-1 个字符并在末尾写零；套用前必须确认 capacity 大于零。",
      ["char target[4];", "copy_truncated(target, sizeof target, \"long text\");", "if (strcmp(target, \"lon\") != 0) return 1;"],
      ["capacity 为零时 capacity-1 会无符号下溢，不能使用补终止符写法。", "对未终止结果调用 strlen 或 strcmp 会继续越界读取。", "strncpy 的零填充适合定长字段，但常不是高效通用复制接口。"],
      "static void copy_truncated(char *target, size_t capacity, const char *source) {\n    if (capacity == 0U) return;\n    strncpy(target, source, capacity - 1U);\n    target[capacity - 1U] = '\\0';\n}"),
    pit("strtok-shared-state", "strtok 共享解析状态", ["线程安全", "嵌套分词"], "strtok 的隐藏状态会被重入或并发调用破坏。", ["string.h"],
      "for (char *token = strtok(buffer, delimiters); token; token = strtok(NULL, delimiters)) { ... }", "只在单一不嵌套解析流使用 strtok；多个字符串或线程并发时改用显式保存游标的代码。",
      ["char text[] = \"a:b:c\";", "char *token = strtok(text, \":\");", "int count = 0;", "while (token != NULL) { ++count; token = strtok(NULL, \":\"); }", "if (count != 3) return 1;"],
      ["在 strtok 循环中启动另一序列会覆盖外层循环的继续位置。", "ISO C 的 strtok 没有调用者上下文参数，不能保证线程互不干扰。", "连续分隔符会被合并跳过，需要空字段时不应采用 strtok。"]),
    pit("string-literal-write", "禁止修改字符串字面量", ["只读字符串", "未定义行为"], "通过指针写入字符串字面量是未定义行为。", [],
      "const char *text = \"immutable\";", "只读文本用 const char * 指向字面量；需要修改时声明 char 数组，让内容初始化到可写对象。",
      ["const char *literal = \"fixed\";", "char editable[] = \"fixed\";", "editable[0] = 'm';", "if (literal[0] != 'f' || editable[0] != 'm') return 1;"],
      ["C 的字符串字面量类型仍是字符数组，但标准规定修改它是未定义行为。", "相同内容的字面量可能被实现合并，不能依赖它们地址不同。", "赋给 const char * 可让编译器在常见误写处给出类型诊断。"]),
    pit("char-pointer-versus-array", "char 指针与字符数组", ["char *", "char[]", "数组退化"], "字符数组拥有元素，字符指针只保存地址。", [],
      "char array[] = \"copy\"; const char *pointer = \"literal\";", "需要可修改副本时定义 char[]；只引用文本时用 const char *，并牢记 sizeof 数组与 sizeof 指针含义不同。",
      ["char array[] = \"copy\";", "const char *pointer = \"literal\";", "array[0] = 'C';", "if (sizeof array != 5U || pointer[0] != 'l') return 1;"],
      ["数组在多数表达式中转为首元素指针，但数组对象不能通过赋值改指向。", "函数参数 char text[] 实际调整为 char *，内部无法由 sizeof 得到原容量。", "指针是否可用于写入取决于所指对象，不能仅由指针变量形式判断。"])
  ];

  window.C_SYNTAX_ADD_ENTRIES(entries);
}());
  </script>
  <script data-source="data/entries/35-ctype.js">
(function () {
  "use strict";

  var program = window.C_SYNTAX_PROGRAM;

  var behaviors = {
    "isalpha-function": "判断 character 在当前区域设置中是否属于字母。以默认 C 区域为例，`A` 到 `Z` 和 `a` 到 `z` 会命中：是字母就返回非零，不是就返回 0；这个非零值只代表“真”，标准不保证恰好为 1。参数只能是 EOF 或能表示为 unsigned char 的值，普通 char 应先转换，否则负值可能导致未定义行为。",
    "isdigit-function": "判断 character 是否是十进制数字字符 `0` 到 `9`，它检查的是字符类别，不是把一段文本转换成数值。命中时返回非零，未命中时返回 0；非零只表示“真”，不保证等于 1。参数必须是 EOF 或能表示为 unsigned char 的值，所以从 char 取得的字节应先转为 unsigned char 再传入。",

        "普通 char 可能有符号；调用 " + name + " 前应先转换为 unsigned char。" + contrast

      ], related: []
    };
  }
