  <script data-source="data/entries/40-math.js">
(function () {
  "use strict";

  var program = window.C_SYNTAX_PROGRAM;

  var behaviors = {
    "sqrt-function": "计算 x 的非负平方根，也就是找一个非负数，使它乘以自己等于 x。x 为正数或零时返回相应平方根，例如 81 返回 9、0 返回 0；有限负数在实数范围内没有平方根，通常返回 NaN（非数），并可能按实现设置 errno 或报告浮点异常。",
    "cbrt-function": "计算 x 的实数立方根，也就是找一个数，使它自乘三次等于 x。正数、零和负数都在定义范围内，因此 27 返回 3，-27 返回 -3，并保留零的符号；无穷返回同号无穷，NaN 返回 NaN。一般结果会按 double 精度舍入。",
    "pow-function": "计算 base 的 exponent 次幂，base 是底数，exponent 是指数，并返回 double 结果。例如 2 和 10 返回 1024；普通非零底数的零次幂返回 1。常见的 IEC 60559 浮点语义让 `pow(0, 0)` 返回 1，但 ISO C 允许实现把这个组合报告为定义域错误，跨平台代码应自行规定。负底数配非整数指数通常返回 NaN，零的负次幂通常返回无穷并报告极点错误，结果过大或过小时还会发生上溢或下溢。",
    "exp-function": "计算自然常数 e 的 x 次幂，x 是指数；它与自然对数 log 互为反运算。x 为 0 时精确返回 1，正数返回大于 1 的值，负数返回 0 到 1 之间的正数。x 很大时可能上溢并返回正无穷，很小时可能下溢并返回零或非常接近零的数，同时可能报告范围错误。",
    "exp2-function": "计算 2 的 x 次幂，x 是以 2 为底的指数，并返回 double 结果。例如 x 为 5 时返回 32，x 为 0 时返回 1，负指数返回 0 到 1 之间的正数。指数过大时可能上溢为正无穷，过小时可能下溢为零或次正规数，并可能报告范围错误。",
    "log-function": "计算正数 x 的自然对数，也就是回答“e 的多少次幂等于 x”，并返回这个指数。x 为 1 时返回 0，x 大于 1 时返回正数，0 到 1 之间时返回负数；x 为 0 会产生极点错误并通常返回负无穷，有限负数会产生定义域错误并通常返回 NaN，两种错误都可能通过 errno 或浮点异常报告。",
    "log2-function": "计算正数 x 以 2 为底的对数，也就是回答“2 的多少次幂等于 x”，并返回这个指数。例如 8 返回 3，1 返回 0；0 到 1 之间返回负数。x 为 0 时通常返回负无穷并报告极点错误，有限负数通常返回 NaN 并报告定义域错误，一般结果还可能有浮点舍入。",
    "log10-function": "计算正数 x 以 10 为底的对数，也就是回答“10 的多少次幂等于 x”，并返回这个指数。例如 1000 返回约 3，1 返回 0，0 到 1 之间返回负数。x 为 0 时通常返回负无穷并报告极点错误，有限负数通常返回 NaN 并报告定义域错误。",
    "sin-function": "把 radians 当作弧度角，计算单位圆上该角对应点的纵坐标并返回正弦值，结果通常在 -1 到 1 之间。0 弧度返回 0；输入若是角度，必须先乘 π/180，直接把 90 当成弧度不会得到期望的 1。无穷输入会产生定义域错误并通常返回 NaN，极大有限角还可能因范围缩减损失精度。",
    "cos-function": "把 radians 当作弧度角，计算单位圆上该角对应点的横坐标并返回余弦值，结果通常在 -1 到 1 之间。0 弧度返回 1，π 弧度约返回 -1；若手里是角度要先乘 π/180。无穷输入会产生定义域错误并通常返回 NaN，接近 π/2 等理论零点时可能只得到很小的舍入残差。",
    "tan-function": "把 radians 当作弧度角，计算正弦除以余弦所代表的斜率并返回正切值。0 弧度返回 0；在 π/2 加整数倍 π 附近，余弦接近零，返回值会急剧变大且对输入误差非常敏感。无穷输入会产生定义域错误并通常返回 NaN；参数单位仍是弧度，不是角度。",
    "asin-function": "把 x 当作某个角的正弦值，反推出主值角并以弧度返回，返回范围是 -π/2 到 π/2。x 为 0 返回 0，x 为 1 返回 π/2，x 为 -1 返回 -π/2；有限 x 超出 [-1, 1] 时没有实数答案，通常返回 NaN，并可能设置 errno 或报告浮点异常。",
    "acos-function": "把 x 当作某个角的余弦值，反推出主值角并以弧度返回，返回范围是 0 到 π。x 为 1 返回 0，x 为 0 返回 π/2，x 为 -1 返回 π；有限 x 超出 [-1, 1] 时通常返回 NaN 并报告定义域错误。由计算误差产生的轻微越界也必须先按业务规则处理。",
    "atan-function": "把 x 当作正切值，反推出主值角并以弧度返回，返回值位于 -π/2 到 π/2 之间。x 为 0 返回同号的零，正负 x 分别返回正负角；正负无穷分别返回正负 π/2。它只有一个比值，不能区分相反象限；若已知横纵分量，应改用 atan2。",
    "atan2-function": "根据点的纵坐标 y 和横坐标 x 计算从正 x 轴指向该点的方向角，并以弧度返回；参数顺序是先 y 后 x。它利用两者符号区分四个象限，也能处理 x 为零，结果通常落在 -π 到 π。两者同时为零时没有普通几何方向，结果可能受有符号零和实现的浮点规则影响，不能当作统一有效角。",
    "sinh-function": "计算 x 的双曲正弦 `(e^x - e^-x) / 2`，x 是无量纲实数，并返回 double 结果。x 为 0 返回同号零，负输入返回对应负值，正输入返回正值；它是奇函数。|x| 很大时结果增长很快，可能返回同号无穷并报告上溢。",
    "cosh-function": "计算 x 的双曲余弦 `(e^x + e^-x) / 2`，x 是无量纲实数，并返回不小于 1 的结果。x 为 0 返回 1，x 与 -x 返回相同值，因为它是偶函数；无穷输入返回正无穷。|x| 很大时结果会迅速增长，可能上溢为正无穷并报告范围错误。",
    "tanh-function": "计算 x 的双曲正切，也就是 sinh(x) 与 cosh(x) 的比值，并把任意有限输入平滑压到 -1 与 1 之间。x 为 0 返回同号零，负输入返回负值，正输入返回正值；正负无穷分别返回正负 1。很大的有限输入也可能因舍入直接返回端点。",
    "floor-function": "把 x 向负无穷方向取整，并以 double 类型返回这个整数值，而不是转换成整数类型。正数 2.9 返回 2，负数 -2.1 返回 -3；这正是它与 trunc 的区别。整数值、正负零和无穷原样返回，NaN 返回 NaN；结果再转成整数前仍要检查目标类型能否容纳。",
    "ceil-function": "把 x 向正无穷方向取整，并以 double 类型返回这个整数值。正数 2.1 返回 3，负数 -2.9 返回 -2，所以它对负数看起来是在靠近零，而不是一律把绝对值变大。整数值、正负零和无穷原样返回，NaN 返回 NaN；它本身不会检查随后整数转换是否越界。",
    "round-function": "把 x 舍入到最近的整数值并仍以 double 返回；离两个整数一样近的半数情况一律远离零。于是 2.5 返回 3，-2.5 返回 -3，2.4 返回 2，-2.4 返回 -2；它既不是总向上，也不是舍入到偶数。正负零和无穷原样返回，NaN 返回 NaN。",
    "trunc-function": "直接去掉 x 的小数部分，也就是向零方向取整，并以 double 类型返回结果。2.9 返回 2，-2.9 返回 -2；对负数而言它与 floor 不同，对正数则与 floor 相同。整数值、正负零和无穷原样返回，NaN 返回 NaN；它不负责检查结果转成整数类型时是否溢出。",
    "fmod-function": "计算 numerator 除以 denominator 后，与“向零截断的整数商”配套的浮点余数，并返回 `numerator - trunc(numerator/denominator) * denominator`。结果绝对值小于除数绝对值，符号跟 numerator，例如 `fmod(-7.5, 2)` 返回 -1.5；它不同于要求余数恒非负的数学取模。denominator 为零时通常返回 NaN 并报告定义域错误。",
    "fabs-function": "去掉 double 数值 x 的负号并返回非负的绝对值。正数原样返回，负数返回对应正数，负零变成正零；正负无穷都返回正无穷，NaN 仍返回 NaN。它处理浮点数，整数应使用 abs 系列；拿它比较误差时还要根据数值尺度选择合适容差。",
    "fmin-function": "比较两个浮点参数 left 和 right，并返回数值较小的那个。普通数按大小选择；如果恰好一个参数是 NaN，就返回另一个数值参数，而不是让普通比较失效；如果两个都是 NaN，则返回 NaN。正零与负零的符号细节不应靠普通打印判断，需要时结合 signbit 检查。",
    "fmax-function": "比较两个浮点参数 left 和 right，并返回数值较大的那个。普通数按大小选择；如果恰好一个参数是 NaN，就返回另一个数值参数；如果两个都是 NaN，则返回 NaN。因此 fmax 能在单个 NaN 时保留数值，却不能用来证明两个输入都不是 NaN。",
    "hypot-function": "把 x 和 y 当作直角三角形的两条直角边或二维向量的两个分量，计算并返回 `sqrt(x*x + y*y)` 所代表的非负长度。3 和 4 返回 5；专用实现会缩放中间量，通常比手写平方和更不容易上溢或下溢。任一参数为无穷时返回正无穷，即使另一参数是 NaN；否则有 NaN 时返回 NaN。",
    "isnan-macro": "检查给定浮点值是否属于 NaN（非数）这一特殊类别。参数是任何实浮点值；若它是 NaN，表达式得到非零整数，若是有限数或正负无穷则得到 0。这里的非零值不保证恰好等于 1，所以应直接写 `if (isnan(value))`，也不能用 `value == NAN` 代替。",
    "isinf-macro": "检查给定浮点值是否是正无穷或负无穷。参数为任一实浮点值；两种无穷都会得到非零整数，有限数和 NaN 得到 0。非零结果的具体数值不保证为 1，也不直接说明符号；需要区分正负时还要检查 signbit 或数值符号。",
    "isfinite-macro": "检查给定浮点值是不是有限数，也就是既不是正负无穷，也不是 NaN。普通数、次正规数以及正负零都会得到非零整数，无穷和 NaN 得到 0；非零值不保证恰好为 1。它只判断浮点类别，不代表数值落在业务允许范围内。",
    "infinity-macro": "提供一个 float 类型的正无穷常量，可赋给 float、double 或 long double，并保持无穷含义。它常用来构造边界测试或表示计算已越过有限范围；加上有限数仍是正无穷，但无穷减无穷会产生 NaN。它不是普通的“最大浮点数”，也不宜未经约定就当作缺失值。",
    "nan-macro": "在实现支持静默 NaN 时提供一个 float 类型的非数常量，转换到更宽浮点类型后仍是 NaN。NaN 用来表示没有普通数值答案的浮点结果，并会在许多运算中继续传播；它与任何值（包括自身）做相等比较都为假，因此必须用 isnan 检测，不能写 `value == NAN`。",
    "m-pi-constant": "表示圆周率 π 的常见扩展宏，可用来把角度换成弧度或计算圆周，但它不是 ISO C11 规定的标准名称。某些环境直接提供，某些环境要先启用扩展开关，严格标准模式下还可能完全未定义；因此代码不能假定包含 math.h 后一定可用，应由项目统一提供所需精度的常量。",
    "floating-point-equality": "这个坑发生在把经过浮点运算的结果直接用 `==` 与十进制期望值比较：许多十进制小数在二进制中只能近似保存，逐步舍入后 `0.1 + 0.2` 可能不等于字面上的 0.3。运行时常表现为看似相同的打印值却进入“不相等”分支，导致测试偶发失败或业务判断走错；应按数值尺度和误差来源使用绝对或相对容差。",
    "nan-self-comparison": "这个坑发生在把 NaN 当成普通数字比较，尤其是写 `value == NAN` 检测错误值。NaN 与自身相等也为假，参与小于、大于和等于比较通常全为假，因此运行时可能让所有普通分支都没命中，排序规则也会失去一致性。NaN 代表“没有可比较的普通数值”，应先用 isnan 单独识别并规定处理方式。",
    "sqrt-domain-error": "这个坑发生在把负的有限实数传给 sqrt，却仍期待得到普通 double 平方根；实数范围内不存在这个答案。运行时通常会得到 NaN，还可能设置 errno 为定义域错误或触发浮点异常，但具体报告途径取决于 math_errhandling。若程序不检查就继续计算，NaN 会一路传播，使后面的比较和输出难以定位根因。",
    "math-integer-division": "这个坑发生在 numerator 和 denominator 都是整数时先做 `/`，再把结果存进 double；除法在赋值前已经按整数规则向零截断，所以 1/2 先变成 0，最终只会得到 0.0。运行时通常不报错，却悄悄算错比例、平均值或百分比，尤其危险；应在除法前把至少一个操作数转换为浮点，并先排除零分母。",
    "math-library-linking": "这个坑发生在源码已经包含 math.h、编译也通过，却没有在某些 Unix 工具链的最终链接命令中加入数学库。运行时之前的链接阶段会看到 `undefined reference to sqrt`、`sin` 等错误，程序根本不会生成；只加头文件不能提供函数实现。使用 GCC 风格链接器时通常要把 `-lm` 放在源文件或目标文件之后。",
    "epsilon-comparison": "这个坑发生在把 DBL_EPSILON 当成适用于所有数值的固定误差限。它只描述 1 附近相邻 double 的间隔；数值很大时固定 epsilon 过严，接近零时纯相对尺度又可能过小，运行时便会误判本可接受或不可接受的结果。容差应结合量级、算法累计误差和业务要求，并同时考虑接近零时的绝对下限。"

  function fn(id, name, aliases, summary, syntax, usage, body, boundary, precision) {
    return {
      id: id, name: name, aliases: aliases, category: "标准库函数", summary: summary, behavior: behaviors[id],
      headers: ["math.h"], usage: usage, syntax: syntax, example: program(["math.h"], body),
      notes: [
        boundary,
        name + " 的结果可能是 NaN、无穷或发生舍入；需要时用 isnan、isfinite 或误差界检查。",
        precision + " 在一些 Unix 工具链中，最终链接调用 " + name + " 的程序还需要把 -lm 放在目标文件之后。"
      ], related: []
    };
  }

  function macro(id, name, aliases, summary, usage, body, notes, beforeMain) {
    return { id: id, name: name, aliases: aliases, category: "标准库函数", summary: summary, behavior: behaviors[id],
      headers: ["math.h"], usage: usage, syntax: name,
      example: program(["math.h"], body, beforeMain || ""), notes: notes, related: [] };
  }

  function pit(id, name, aliases, summary, headers, syntax, usage, body, notes) {
    return { id: id, name: name, aliases: aliases, category: "常见易错点", summary: summary, behavior: behaviors[id],
      headers: headers, usage: usage, syntax: syntax, example: program(headers, body), notes: notes, related: [] };
  }

      "fabs(left - right) <= tolerance", "比较经过计算的浮点值时使用绝对或相对容差；精确常量、整数范围内转换等确有保证的场景仍可直接相等比较。",

    pit("nan-self-comparison", "NaN 与自身比较", ["NaN 不等于自身"], "NaN 与自身比较也不相等，普通关系比较没有全序。", ["math.h"],

  <script data-source="data/entries/50-time-and-headers.js">
(function () {
  "use strict";

  const P = window.C_SYNTAX_PROGRAM;
  const behaviors = {
    "time-function": "读取当前日历时间，也就是系统认为的“现在”，并把它编码成 time_t。timer 为非空指针且读取成功时，同一个结果还会写入 *timer；传 NULL 则只取返回值。成功返回当前时刻的 time_t 编码，无法取得日历时间时返回 (time_t)-1；编码的起点和单位由实现规定，不能一概当成 Unix 秒。",
    "clock-function": "读取程序到当前为止消耗的处理器时间计数，常用工作前后的差值估算 CPU 用时；它通常不等于墙上时钟经过的时间，休眠也未必计入。成功返回 clock_t 刻度值，用差值除以 CLOCKS_PER_SEC 才得到秒；无法取得时返回 (clock_t)-1，长时间运行还可能遇到计数范围耗尽或回绕。",
    "clocks-per-sec-macro": "表示 clock 返回的处理器时间计数每秒对应多少个刻度，用“刻度差 ÷ CLOCKS_PER_SEC”换算秒数。它是头文件给出的编译期常量宏，不是运行时会变化的变量；具体数值由实现决定，也不代表计时器真的能分辨到一个刻度那么细，计算时应先转成浮点数以免整数除法截断。",
    "difftime-function": "计算两个 time_t 日历时刻之间相差多少秒，实际做的是 time1 减 time0，并由库处理 time_t 可能不是普通整数的情况。返回 double：正数表示 time1 更晚，0 表示二者相同，负数表示 time1 更早；标准没有另设失败返回值，但相距极远时 double 可能不能保留每一秒的精度。",
    "mktime-function": "把按本地时区填写的 struct tm 转成 time_t，同时把越界字段规范化并写回结构，例如 1 月 32 日可被调整到 2 月。tm_isdst 为负数时由库判断夏令时。转换成功返回编码后的 time_t，无法表示该日历时间时返回 (time_t)-1；因此必须检查返回值，且输入会被修改。",
    "localtime-function": "把一个 time_t 时刻按当前本地时区拆成年、月、日、时、分、秒等 struct tm 字段。转换成功返回指向库内静态存储对象的指针，失败返回 NULL；“静态存储”表示对象由库长期持有而非调用者分配，但后续 localtime、gmtime 或 ctime 调用可能覆盖它，所以需要长期使用时应立即复制内容。",
    "gmtime-function": "把一个 time_t 时刻按协调世界时 UTC 拆成 struct tm，不应用本地时区或本地夏令时偏移。转换成功返回指向库内静态 struct tm 的指针，无法转换时返回 NULL；该静态对象可能与 localtime 共用并被后续时间转换覆盖，因此不能把返回指针当作独立、永久的结果。",
    "strftime-function": "按照 format 中的占位记号，把 struct tm 格式化到 s 指向的字符缓冲区，max 是包括结尾空字符在内的总容量。若完整结果能放下，返回写入的字符数且不计末尾 '\\0'；若包括结尾空字符的结果超过 max 就返回 0，此时缓冲区内容不确定。空格式也可能成功产生长度 0，所以只凭 0 有时无法区分空结果与空间不足。",
    "asctime-function": "把 struct tm 转成传统的固定英文布局文本，通常形如星期、月份、日期、时间、年份再加换行。正常输入时返回指向库内静态字符数组的指针，文本会被后续相关调用覆盖且不能 free；标准没有可靠的“传入任意坏字段后返回 NULL”恢复契约，字段超出允许范围或年份使固定缓冲区装不下可能导致未定义行为，应先保证输入有效。",
    "ctime-function": "把 time_t 直接转成当前本地时区的传统固定格式文本，效果相当于先 localtime 再 asctime，结果通常自带末尾换行。转换成功返回库管理的静态字符串指针，时刻无法转换时返回 NULL；返回内容可能被后续 ctime、asctime、localtime 或 gmtime 调用覆盖，调用者不能释放它。",
    "tm-struct": "保存拆开的日历时间字段：tm_sec 通常为 0～60，tm_min 为 0～59，tm_hour 为 0～23，tm_mday 为 1～31；tm_mon 从 0 表示一月到 11，tm_year 是从 1900 起经过的年数。tm_wday 从 0 表示星期日，tm_yday 从 0 表示一年的第一天；tm_isdst 大于 0、等于 0、负数分别表示采用、不采用、未知夏令时。各字段是整数而非自动校验的日期。",
    "time-t-type": "这是保存日历时间编码的算术类型，time 和 mktime 的结果必须用它接收，再交给 difftime、localtime 等库函数解释。它可表示的年代、宽度、有无符号以及编码起点都由平台决定，常见系统把它实现为自某个纪元起的秒数，但 C 标准不保证这一点；不要擅自当成 long、固定 64 位整数或直接相减。",

    "int-range-macros": "INT_MIN 和 INT_MAX 分别表示本平台 int 能保存的最小值与最大值，可在计算或窄化转换之前检查边界。它们是编译期整数常量宏，不是变量；标准至少保证范围覆盖 -32767～32767，但实际值随 int 位宽和表示方式变化。超过上界或低于下界的有符号 int 运算属于未定义行为，不能溢出后再检查。",
    "char-bit-macro": "表示一个 C 字节，也就是一个 char，包含多少个二进制位；sizeof 的所有结果都以这种字节为单位。CHAR_BIT 是编译期整数常量宏而不是变量，标准保证它至少为 8，常见平台取 8，但 C 并不要求处处如此。因此读取八位协议或计算位容量时必须显式核对，不能靠它推断字符编码。",
    "uchar-max-macro": "表示 unsigned char 在当前平台可保存的最大整数，它的最小值固定为 0，所以范围是 0～UCHAR_MAX。该名称是编译期整数常量宏，不是可修改变量；其值由 CHAR_BIT 等实现选择决定，八位字节上通常为 255。转换到 unsigned char 会按其范围取模，超范围高位可能被丢掉，检查必须在转换前进行。",
    "long-max-macro": "表示 long 类型可保存的最大正整数，常用于解析或计算前的上界检查。它是编译期整数常量宏而不是变量，具体数值随数据模型变化：Windows 上 long 常为 32 位，许多 64 位 Unix 平台上则为 64 位。LONG_MAX 再加 1 会造成有符号溢出的未定义行为，输出 long 还应使用正确的 l 长度修饰。",
    "schar-min-macro": "表示 signed char 在当前实现中可保存的最小整数，可用来判断一个小整数能否安全缩窄到显式有符号字符类型。它是编译期整数常量宏，不是变量；数值随 signed char 的位宽和表示方式而定，八位二进制补码机器通常为 -128。它与普通 char 是不同类型，而普通 char 的下限应查看 CHAR_MIN。",
    "char-min-macro": "表示普通 char 能保存的最小整数，同时能揭示该平台把普通 char 当作有符号还是无符号：CHAR_MIN 小于 0 表示有符号，等于 0 表示无符号。它是编译期整数常量宏而非变量，可能等于 SCHAR_MIN，也可能为 0；选择由编译器和目标平台决定，所以原始字节应明确使用 unsigned char。",

    "flt-epsilon-macro": "表示 1.0f 与下一个大于 1.0f 的可表示 float 值之间的差，描述单位量级附近的浮点间隔。它是编译期浮点常量宏，不是变量，具体数值取决于平台的 float 格式，常见 IEEE 单精度约为 1.19×10^-7。它不是任何数量级都适用的误差上限，也不应直接充当所有近似比较的固定容差。",
    "dbl-epsilon-macro": "表示 1.0 与下一个更大的可表示 double 值之间的差，用来了解单位量级附近能分辨多细。DBL_EPSILON 是编译期浮点常量宏而非变量，数值随 double 格式而定，常见 IEEE 双精度约为 2.22×10^-16。数值越大时相邻值的绝对间隔通常越大，接近零时又要考虑绝对容差，所以不能机械套用它。",
    "flt-dig-macro": "表示 float 至少能保证多少个十进制有效数字完成“十进制文本转 float 再转回文本”而保持原值。它是编译期整数常量宏，不是变量，标准保证至少为 6，常见 IEEE 单精度也为 6；平台格式不同则可能更大。它说的是总有效数字数量，不是小数点后固定有几位，也不等于打印后能还原任意 float 所需的位数。",
    "dbl-max-macro": "表示 double 能表示的最大有限正数，负方向对应的有限下界可写成 -DBL_MAX。它是编译期浮点常量宏而非变量，具体大小由平台浮点格式决定，常见 IEEE 双精度约为 1.8×10^308。继续放大运算可能上溢为无穷或触发实现规定的错误处理，因此算法最好在中间结果越界前重排或缩放。",
    "flt-min-macro": "表示 float 能表示的最小正规正数；“正规”指有效数字采用通常完整精度的浮点表示。它是编译期浮点常量宏，不是变量，随平台格式变化，常见 IEEE 单精度约为 1.175×10^-38。它既不是最负的 float，也不一定是最小正非零值，因为支持次正规数的平台在 0 与 FLT_MIN 之间还有更小的数。",

    "fixed-width-integer-types": "intN_t 与 uintN_t 表示恰好 N 个值位的有符号和无符号整数，适合协议字段或文件格式明确规定二进制宽度的情况。它们是 typedef 类型别名而非常量；只有平台存在无填充位的对应整数类型时才会提供，所以并非每个 N、每个平台都有。固定宽度只规定数值位数，不规定多字节在内存中的字节序。",
    "int8-uint8-types": "int8_t 和 uint8_t 是可选的精确八位整数类型；若平台提供，典型取值范围分别是 -128～127 与 0～255。它们是 typedef 类型别名，不是变量，缺少恰好八位无填充整数的平台可以不定义。uint8_t 可能只是 unsigned char 的别名，因此流输出和算术前会发生整数提升，也不能把它自动等同于文本字符。",
    "int64-uint64-types": "int64_t 和 uint64_t 是可选的精确六十四位整数类型；存在时，前者保存约 -9.22×10^18 到 9.22×10^18，后者保存 0 到约 1.84×10^19。它们是 typedef 类型别名，不是变量；适合固定宽度计数和二进制字段，但有符号溢出仍未定义，常量与格式化应配套使用 INT64_C、UINT64_C 和 PRI 宏。",
    "intptr-uintptr-types": "intptr_t 与 uintptr_t 是能够保存 void 指针并再转回等价指针的可选整数类型，主要服务底层接口、序列化之外的临时位表示或地址哈希。它们是 typedef 类型别名，不是指针，也不是每个平台都必须提供；保证只覆盖同一程序内的往返转换，不保证整数值跨进程稳定，更不意味着对地址做任意算术后仍能解引用。",
    "int32-limit-macros": "INT32_MAX 和 UINT32_MAX 分别是 int32_t 与 uint32_t 的最大值；相应类型存在时，其值分别为 2147483647 和 4294967295。它们是编译期整数常量宏，不是变量，并且只在平台提供精确 32 位类型时定义。检查必须发生在运算或转换之前，有符号下界应使用 INT32_MIN，不能把无符号上限塞进有符号对象。",
    "integer-constant-macros": "INT64_C(value) 与 UINT64_C(value) 把给定数字记号扩展成适合至少 64 位整数类型的编译期整数常量表达式，避免手写 L 或 LL 后缀与平台数据模型不匹配。它们是函数式宏而不是运行时函数或变量，参数本身不要再带类型后缀；生成了正确类型的常量也不能阻止之后赋给更窄类型时丢失数据。",
    "size-max-macro": "表示 size_t 可保存的最大值，可在 count * element_size 之前用 count > SIZE_MAX / element_size 检查无符号乘法是否会回绕。SIZE_MAX 是编译期整数常量宏，不是实际内存容量，也不是变量；数值随 size_t 位宽而变，32 位与 64 位平台差异很大。做除法检查前还必须确认元素大小不为 0。",
    "fast-least-integer-types": "int_leastN_t 是至少有 N 个值位且尽量紧凑的整数类型，int_fastN_t 则是在至少 N 位的前提下由实现选择通常运算较快的类型；无符号版本规则相同。它们都是 typedef 类型别名，不保证恰好 N 位，实际宽度与范围因平台而异，因此适合内部计算或节省对象空间，不适合直接规定文件或网络布局。",

    "size-t-type": "这是专门表示对象字节大小、数组元素数量和下标的无符号整数类型，sizeof 的结果就是 size_t。它的范围是 0～SIZE_MAX，具体宽度由平台地址空间和实现决定，不保证等于 unsigned int 或 unsigned long；容量与下标应优先用它，但倒序循环要防止 0 再减 1 回绕到最大值，printf 输出使用 %zu。",
    "ptrdiff-t-type": "这是保存同一数组中两个指针相减结果的有符号整数类型，数值表示两位置相隔多少个数组元素，而不是多少字节。它的具体宽度和范围由实现决定，输出使用 %td；只有指向同一数组对象或其尾后位置的指针才能相减，而且数学差若超出 ptrdiff_t 可表示范围也属于未定义行为。",
    "null-macro-stddef": "NULL 是头文件定义的空指针常量宏，可用来初始化对象指针或与指针比较，表示“不指向任何对象或函数”。它是编译期宏而不是一个可寻址、可修改的变量，展开形式由实现决定，在 C 中可能是整数常量 0 或转换成 void * 的形式；源码写法和机器中的全零位模式都不能被当成可移植保证。",
    "offsetof-macro": "offsetof(type, member) 在编译期给出 member 相对结构体起始地址的字节偏移，结果类型是 size_t，并会把成员前的对齐填充计算进去。它是函数式宏而不是运行时函数，结果会随成员顺序、类型对齐、编译器 ABI 和平台变化；不能对位域使用，也不应把某个平台的结果直接当成跨平台文件格式。",
    "max-align-t-type": "这是一个对齐要求至少不低于任何基础标量类型的实现定义类型，可帮助通用原始存储取得足够对齐。“对齐”是对象起始地址必须满足的倍数约束；max_align_t 的大小和具体组成随平台而异，它是类型而不是最大对象容量。实现扩展的过度对齐类型可能仍要求更严格的专门分配方式。",
    "wchar-t-stddef-type": "这是能表示实现所支持宽字符代码的整数类型；从 stddef.h 可取得类型本身，调用宽字符串函数仍通常包含 wchar.h。它的有无符号、宽度和编码含义由平台决定：Windows 常见 16 位，许多 Unix 平台常见 32 位。一个 wchar_t 是代码单元，不保证总能独自表示完整 Unicode 字符，也不能假定其范围固定。",

    "stdbool-macros": "在 C99 到 C17 中，stdbool.h 用 bool 作为 _Bool 的易读别名，并用 true、false 表示规范化的 1 和 0。它们是头文件提供的编译期宏，不是可修改变量；_Bool 语义由语言规定，底层对象布局仍由实现决定。它们让真假意图更清楚，但不会自动阻止把任意整数赋给布尔对象，也不规定跨文件或网络的存储格式。",
    "bool-normalization": "任何标量值赋给 _Bool 或 bool 时都会被规范成 0 或 1：整数和浮点数的零、空指针得到 0，其余值包括负数和非空指针得到 1。结果只保留“假或真”，原来的 2、-7 等具体状态会丢失；因此它适合保存开关和条件，不适合保存需要区分多个非零错误码的返回状态。",

    "va-list-type": "这是保存可变参数遍历位置和实现内部状态的类型，相当于一枚只能按规则操作的游标，但它可能实现成指针、结构甚至数组。声明后必须用 va_start 或 va_copy 初始化，读取用 va_arg，结束用 va_end；参数数量和类型并未存进 va_list，必须由 count、格式串等接口约定提供，也不能用普通赋值假装可移植复制。",
    "va-start-macro": "用最后一个命名形参为线索，把 va_list 初始化到第一个省略号实参之前，使后续 va_arg 能开始读取。它是函数式宏，不返回值；只能在含 ... 的函数内部对尚未活动的列表调用，而且第二项必须是规则允许的最后命名形参。未初始化就读取会产生未定义行为，每次成功启动的列表最终都要执行 va_end。",
    "va-arg-macro": "从当前 va_list 取出下一个附加实参，并把内部游标推进到再下一个；宏表达式的结果就是指定 type 的那个值。调用者必须知道还有参数，并按默认提升后的实际类型读取，例如 float 要按 double、char 和 short 通常按 int；数量超出或类型不兼容会产生未定义行为，它不会返回错误码来提醒。",
    "va-end-macro": "结束由 va_start 或 va_copy 建立的活动 va_list，让实现有机会释放其遍历状态。它是函数式宏，没有返回值；调用后该列表在重新初始化前不能继续交给 va_arg，每个独立副本也必须各自结束。即使某个平台把它实现成空操作，源码仍必须调用，所有离开函数的控制路径都不能漏掉。",
    "va-copy-macro": "把一个正在活动的 va_list 当前读取位置复制到另一个列表，使两个游标以后可以独立调用 va_arg，而不会要求 va_list 支持普通赋值。它是函数式宏，没有返回值；目标列表应处于未活动状态，复制成功后源和目标都要分别 va_end。具体 va_list 表示因平台不同，直接用 = 复制可能根本不能编译或共享错误状态。",

    "assert-macro": "检查一个本应由程序员保证的条件：未定义 NDEBUG 时会求值表达式，非零就继续执行；为 0 时输出含表达式、文件和行号等诊断并调用 abort 异常终止。assert 是宏，没有可供调用者处理的返回值；定义 NDEBUG 后表达式完全不求值，所以不能把自增、释放资源等必要副作用藏在里面。",
    "assert-side-effects": "NDEBUG 是在包含 assert.h 前可定义的编译期开关宏；定义它后，assert(...) 会被禁用，参数表达式也不会求值，而未定义时断言照常检查。它不是运行时可切换的变量，因此 assert(index++) 之类代码会在不同构建中改变结果。必要操作应先单独执行，断言只读取并核对已有状态。",
    "static-assert-macro": "在编译程序时检查整数常量表达式；条件非零则声明通过且不生成运行时代码，为零则编译失败并显示诊断消息。static_assert 是 assert.h 提供的编译期名称，_Static_assert 是语言关键字形式，都没有运行时返回值，也不能检查运行后才知道的变量；类型大小、数组容量和 ABI 假设可借此尽早阻止错误构建。",

    "errno-object": "errno 是一个可修改的 int 左值；“左值”表示它能出现在赋值号左边。部分库函数失败时会把错误码写到这里，但成功通常不会清除旧值，所以应先在文档允许时置 0、再按函数返回值确认失败、最后读取 errno。它常由宏定位到当前线程的存储，并非固定的普通全局变量，下一次库调用前应先保存所需错误码。",
    "edom-macro": "表示“输入超出数学定义域”的错误码，例如只接受非负实数的运算收到负数时，某些数学函数会使用它。EDOM 是编译期正整数常量宏，不是变量，具体数字由平台决定；函数是否设置 errno 还受 math_errhandling 和接口契约影响，因此必须先看函数返回值，再把 errno 与 EDOM 比较，不能单独把旧 errno 当成失败。",
    "erange-macro": "表示结果超出可表示范围的错误码，可涵盖上溢，也可能涵盖下溢；文本转换函数还可能同时返回饱和值。ERANGE 是编译期正整数常量宏而非变量，具体数字随平台而异。调用前应按接口规则清零 errno，调用后先识别失败返回，再检查是否等于 ERANGE，并结合具体函数结果区分上溢、下溢或可接受的舍入。",

    "signal-function": "为编号 sig 的信号设置处置方式 func，可以是处理函数、SIG_DFL 或 SIG_IGN，并返回安装前的处置。成功时返回原处理函数或相应特殊值，失败时返回 SIG_ERR；信号编号无效等情况可失败。不同系统对处置是否重置等细节有差异，异步处理器里通常只安全地写 volatile sig_atomic_t 标志，不能随意调用普通库函数。",
    "raise-function": "让当前程序产生编号 sig 的信号，并按当前安装的处置方式处理它。信号成功产生且处理后还能继续时返回 0，无法产生时返回非零；若处置是默认终止、停止或跳转到不再回来的处理流程，本次调用自然不会正常返回。传入的编号应是实现支持的信号宏，不能把任意整数都视为有效。",
    "sigint-macro": "表示交互式中断条件，常见来源是终端用户按 Ctrl+C，可传给 signal 安装处置或传给 raise 主动产生。SIGINT 是编译期整数常量宏，不是变量，具体编号由操作系统和 C 实现决定，不能写死成某个数字；没有交互终端的环境也仍可能通过其他方式产生它，处理器应只做异步安全的最小工作。",
    "signal-default-ignore": "SIG_DFL 和 SIG_IGN 是 signal 接受的两个特殊宏值，前者要求恢复该信号的默认动作，后者要求忽略允许被忽略的信号。它们是编译期提供的宏而不是普通处理函数或变量，底层表示由平台决定，不能假定为某个整数或直接调用；修改处置会影响整个程序，通常应保存 signal 返回的旧值并在完成后恢复。",

    "setjmp-macro": "在当前位置保存可供 longjmp 恢复的执行环境。直接执行 setjmp 时返回 0；以后 longjmp 使用同一环境跳回来时，它会像再次返回一样得到非零值，longjmp 传 0 时这里改为返回 1。它通常是宏且只能出现在标准允许的控制表达式位置；保存环境的函数一旦已经返回，该环境便失效，不能再跳回。",
    "longjmp-function": "恢复先前 setjmp 保存的环境，直接把控制流送回那个 setjmp 返回点，因此本次 longjmp 调用不会返回给它的调用者。setjmp 随后返回 value；若 value 为 0 则改为返回 1，其他值原样返回。env 已失效会产生未定义行为，跳转还会绕过正常清理；setjmp 后改过的非 volatile 自动局部变量可能变成不确定值。",

    "setlocale-function": "查询或修改程序的区域设置，category 指定全部或某一类；locale 为 NULL 时只查询不修改，空字符串通常请求环境默认，其他字符串请求指定区域。成功返回指向当前区域名称字符串的指针，所请求区域不可用时返回 NULL 且设置不变；返回字符串由库管理，后续 setlocale 可能覆盖它，修改还可能影响整个进程的分类和格式化行为。",
    "localeconv-function": "读取当前区域设置中的数字和货币格式，返回 struct lconv 指针，其中包含小数点、千位分隔符、货币符号等字段。标准接口返回库管理对象的指针供只读使用，没有普通的失败返回分支；调用者不能 free 或修改字段。后续 setlocale 或再次 localeconv 可能覆盖内容，不支持的项目会用规定的空串或 CHAR_MAX 等值表示。",

    "wchar-t-wcharh-type": "这是宽字符库使用的整数代码单元类型，宽字符常量 L'A' 和宽字符串数组的元素都用 wchar_t 保存。实际位宽、符号性和编码由平台决定：Windows 常见 16 位代码单元，许多 Unix 平台常见 32 位；即使是 32 位也不应脱离当前 locale 随意假定编码。单个值不保证就是一个完整的用户所见字符。",
    "wcslen-function": "从 s 指向的位置逐个读取 wchar_t，直到遇到宽空字符 L'\\0'，并计算此前有多少个宽代码单元。返回 size_t 长度，不包含结尾的 L'\\0'；空宽字符串返回 0。它没有失败返回值，如果 s 是 NULL 或数组中没有可达的终止符，就会越界读取并产生未定义行为；结果也不是字节数或屏幕上的字符数。",

    E("integer-constant-macros", "INT64_C / UINT64_C", ["固定宽度常量"], "生成适合六十四位类型的整数常量。", ["stdint.h"], "编写固定宽度大整数时把无后缀数字交给 INT64_C 或 UINT64_C，避免手写 L、LL 在不同数据模型下失配。", "INT64_C(value)  UINT64_C(value)", ["int64_t a = INT64_C(-5000000000);", "uint64_t b = UINT64_C(10000000000);", "if (a >= 0 || b < UINT64_C(9000000000)) return 1;"], ["参数记号本身不要再带后缀。", "负数不应交给无符号常量宏。", "正确常量类型不能阻止后续窄化。"], ["int64-uint64-types"]),
    E("size-max-macro", "SIZE_MAX", ["size_t 上限"], "给出 size_t 最大可表示值。", ["stdint.h"], "计算分配字节数前用 SIZE_MAX 除以元素大小反推数量上限，先阻止无符号乘法回绕再申请内存。", "SIZE_MAX", ["size_t width = 4U, count = 10U;", "if (count > SIZE_MAX / width) return 1;", "size_t bytes = count * width;", "if (bytes != 40U) return 1;"], ["回绕不会产生负数提示。", "可表示上限不等于实际可分配大小。", "除法检查前必须保证除数非零。"], ["size-t-type", "sizeof-allocation"]),
    E("fast-least-integer-types", "快速与最小宽度整数", ["int_fast32_t", "int_least16_t"], "提供至少指定宽度的快速或紧凑类型。", ["stdint.h"], "只要求不少于若干位时，节省空间可选 int_leastN_t，频繁计算可选 int_fastN_t；二者都不承诺恰好 N 位。", "int_fast32_t fast_value; int_least16_t compact_value;", ["int_fast32_t fast = 1000;", "int_least16_t compact = -20;", "if (fast + compact != 980) return 1;"], ["fast 类型可能比名称指定更宽。", "least 类型只承诺最少值位数。", "不能直接用作固定二进制布局。"], ["fixed-width-integer-types"]),

    // stddef.h
    E("size-t-type", "size_t", ["对象尺寸类型"], "保存 sizeof 结果和对象大小。", ["stddef.h"], "表示数组数量、缓冲区容量和 sizeof 结果时使用 size_t；倒序循环必须避免零减一造成无符号下溢。", "typedef /* 无符号整数 */ size_t;", ["int values[4] = {0};", "size_t count = sizeof values / sizeof values[0];", "if (count != 4U) return 1;"], ["它不保证等同 unsigned long。", "零减一会回绕到最大值。", "printf 应使用专用的 %zu 格式。"], ["size-max-macro"]),
    E("ptrdiff-t-type", "ptrdiff_t", ["指针差类型"], "保存同一数组内两个指针之差。", ["stddef.h"], "求同一数组中两个位置的元素距离时保存到 ptrdiff_t；不同数组之间的指针相减没有定义。", "typedef /* 有符号整数 */ ptrdiff_t;", ["int values[5] = {0};", "int *begin = values;", "int *end = values + 5;", "ptrdiff_t distance = end - begin;", "if (distance != 5) return 1;"], ["尾后指针也可参与合法相减。", "巨大数组的差值仍可能无法表示。", "格式化输出应使用 %td。"], ["pointer-arithmetic"]),
    E("null-macro-stddef", "NULL", ["空指针常量"], "提供实现定义的空指针常量宏。", ["stddef.h"], "初始化或比较对象指针为空时可用 NULL；不要从它的源码拼写推断实际空指针对象表示。", "#define NULL /* 实现定义 */", ["int value = 3;", "int *pointer = NULL;", "pointer = &value;", "if (pointer == NULL || *pointer != 3) return 1;"], ["它不等于一个可调用的指针对象。", "全零位模式未必表示空指针。", "可变参数里宏的实际类型很重要。"], ["null-pointer"]),
    E("offsetof-macro", "offsetof", ["成员偏移"], "计算结构体成员的字节偏移。", ["stddef.h"], "查询结构体真实成员布局时使用 offsetof(type, member)，可用于 ABI 核验；文件格式仍应逐字段编码。", "offsetof(type, member)", ["struct Record { char tag; int value; };", "size_t offset = offsetof(struct Record, value);", "if (offset == 0U) return 1;"], ["结果会包含前置填充字节。", "位域不能作为被查询成员。", "跨编译器 ABI 必须额外静态核验。"], ["struct-padding"]),
    E("max-align-t-type", "max_align_t", ["最大基础对齐"], "具备所有基础标量类型所需的充分对齐。", ["stddef.h"], "实现通用原始存储区时可借助 max_align_t 获取基础类型所需对齐；扩展的过度对齐类型仍需专门策略。", "typedef /* 实现定义 */ max_align_t;", ["max_align_t storage;", "size_t bytes = sizeof storage;", "if (bytes == 0U) return 1;"], ["保证不一定覆盖过度对齐类型。", "对象大小与最大对象容量无关。", "对齐充分仍需遵守有效类型规则。"], ["struct-padding"]),
    E("wchar-t-stddef-type", "wchar_t（stddef.h）", ["宽字符类型"], "提供能保存扩展字符集代码的整数类型。", ["stddef.h"], "只需声明宽字符对象而不调用宽字符串函数时可从 stddef.h 获取 wchar_t；其编码和位宽必须按平台对待。", "typedef /* 整数类型 */ wchar_t;", ["wchar_t letter = L'A';", "if (letter == (wchar_t)0) return 1;"], ["它不等价于 Unicode 码点。", "Windows 上通常只有十六位宽。", "宽字符串函数仍应包含 wchar.h。"], ["wchar-t-wcharh-type"]),

    // stdbool.h
    E("stdbool-macros", "bool / true / false", ["布尔宏"], "提供易读的布尔类型与真假常量宏。", ["stdbool.h"], "表达开关、条件状态和谓词结果时使用 bool、true、false；跨接口存储仍需定义明确的线格式。", "bool ready = true;", ["bool ready = true;", "bool stopped = false;", "if (!ready || stopped) return 1;"], ["bool 在 C11 中宏展开为 _Bool。", "真假宏分别表达一和零。", "宏不会提供额外强类型检查。"], ["bool-type", "bool-normalization"]),
    E("bool-normalization", "_Bool 非零规范化", ["布尔归一化"], "标量转为 _Bool 时非零值统一变成一。", ["stdbool.h"], "需要把整数状态归一化成真假时赋给 bool 或 _Bool；若要保留具体错误码，就不要过早做这种转换。", "_Bool flag = scalar_expression;", ["_Bool direct = 42;", "bool named = -7;", "if (direct != 1 || named != true) return 1;"], ["负数转换后同样得到一。", "非空指针也会转换为真值。", "归一化会丢失非零状态间差异。"], ["stdbool-macros"]),

    // stdarg.h
    E("va-list-type", "va_list", ["变参游标"], "保存遍历可变参数所需的实现状态。", ["stdarg.h"], "可变参数函数中声明 va_list，用 va_start 初始化后才能读取；不要把它当普通指针或用简单赋值复制。", "va_list arguments;", ["int result = first_integer(1, 9);", "if (result != 9) return 1;"], ["表示可能是数组或结构类型。", "活动列表最终必须执行 va_end。", "数量与类型需要接口另行约定。"], ["va-start-macro", "va-copy-macro"], "static int first_integer(int count, ...) {\n    va_list a; va_start(a, count);\n    int v = count ? va_arg(a, int) : 0;\n    va_end(a); return v;\n}"),
    E("va-start-macro", "va_start", ["启动变参读取"], "用最后一个固定形参初始化变参列表。", ["stdarg.h"], "进入省略号函数后，以最后一个命名形参调用 va_start；该形参通常还提供数量或格式来约束后续读取。", "va_start(ap, last_named_parameter);", ["int total = sum_integers(3, 2, 4, 6);", "if (total != 12) return 1;"], ["第二项必须是最后一个命名形参。", "启动前读取列表会产生未定义行为。", "固定形参类型还要符合标准限制。"], ["va-list-type", "va-arg-macro"], "static int sum_integers(int count, ...) {\n    va_list a; va_start(a, count); int total = 0;\n    for (int i = 0; i < count; ++i) total += va_arg(a, int);\n    va_end(a); return total;\n}"),
    E("va-arg-macro", "va_arg", ["读取变参"], "读取当前附加实参并推进游标。", ["stdarg.h"], "va_arg 必须使用默认提升后的类型：float 按 double、char 和 short 按 int；类型或数量错误会产生未定义行为。", "va_arg(ap, promoted_type)", ["double value = read_double(1, 2.5f);", "if (value < 2.49 || value > 2.51) return 1;"], ["宏本身不知道还剩多少参数。", "不兼容读取类型会破坏参数访问。", "格式串或标签必须提供类型契约。"], ["va-start-macro"], "static double read_double(int count, ...) {\n    va_list a; va_start(a, count);\n    double v = count ? va_arg(a, double) : 0.0;\n    va_end(a); return v;\n}"),
    E("va-end-macro", "va_end", ["结束变参读取"], "结束 va_list 当前遍历状态。", ["stdarg.h"], "每条离开已调用 va_start 或 va_copy 的控制路径都应先执行 va_end，复杂函数可汇合到统一清理位置。", "va_end(ap);", ["int value = last_integer(2, 3, 7);", "if (value != 7) return 1;"], ["结束后不能继续读取该列表。", "即使平台展开为空也必须调用。", "原列表和副本都要分别结束。"], ["va-list-type"], "static int last_integer(int count, ...) {\n    va_list a; va_start(a, count); int v = 0;\n    for (int i = 0; i < count; ++i) v = va_arg(a, int);\n    va_end(a); return v;\n}"),
    E("va-copy-macro", "va_copy", ["复制变参游标"], "独立复制一个有效 va_list 的当前位置。", ["stdarg.h"], "需要对相同剩余参数遍历两次时用 va_copy 建立副本，不能普通赋值，并对两个列表分别调用 va_end。", "va_copy(destination, source);", ["int value = duplicate_first(1, 11);", "if (value != 22) return 1;"], ["目标不能是尚未结束的活动列表。", "复制后两个游标能够独立推进。", "面向 C99 时需要额外兼容方案。"], ["va-list-type"], "static int duplicate_first(int count, ...) {\n    va_list a, b; va_start(a, count); va_copy(b, a);\n    int v = va_arg(a, int) + va_arg(b, int);\n    va_end(b); va_end(a); return v;\n}"),

    // assert.h
    E("assert-macro", "assert", ["运行时断言"], "在条件为假时诊断并异常终止。", ["assert.h"], "用 assert 检查程序员应保证的内部不变量，而不是处理用户输入等可恢复错误；发布构建可能禁用它。", "assert(scalar_expression);", ["int value = 4;", "assert(value > 0);", "if (value != 4) return 1;"], ["失败不会提供普通恢复路径。", "成功表达式只应检查现有状态。", "外部错误应显式返回错误码。"], ["assert-side-effects"]),
    E("assert-side-effects", "assert 与 NDEBUG", ["禁用断言"], "NDEBUG 会让 assert 表达式不再求值。", ["assert.h"], "不要把自增、资源释放或必要函数调用放在 assert 参数中；否则定义 NDEBUG 后程序行为会实质改变。", "#ifdef NDEBUG /* assert 被关闭 */ #endif", ["int index = 0;", "++index;", "assert(index == 1);", "if (index != 1) return 1;"], ["NDEBUG 要在包含头文件前定义。", "必要副作用必须先单独执行。", "断言开关不应改变业务结果。"], ["assert-macro"]),
    E("static-assert-macro", "static_assert / _Static_assert", ["编译期断言"], "在翻译期验证整数常量表达式。", ["assert.h"], "用静态断言核验类型大小、容量或 ABI 假设，让不满足约束的构建立刻失败；条件必须能在编译期求值。", "static_assert(constant_expression, \"message\");", ["static_assert(sizeof(char) == 1, \"char size\");", "_Static_assert(sizeof(int) >= 2, \"int width\");", "if (sizeof(int) < 2U) return 1;"], ["失败消息应解释所需不变量。", "运行期变量不能充当断言条件。", "无下划线名称由 assert.h 提供。"], ["struct-padding"]),

    // errno.h
    E("errno-object", "errno", ["库错误状态"], "为部分库函数提供可修改错误码左值。", ["errno.h"], "只在接口文档说明会设置 errno 时使用：调用前清零，先按返回值判失败，再读取；成功调用不保证清掉旧值。", "errno", ["errno = 0;", "int snapshot = errno;", "if (snapshot != 0) return 1;"], ["它可能是定位线程存储的宏。", "函数成功后旧值通常仍然存在。", "后续库调用前应先保存错误码。"], ["edom-macro", "erange-macro"]),
    E("edom-macro", "EDOM", ["定义域错误"], "表示数学函数的定义域错误码。", ["errno.h"], "确认数学函数失败且实现采用 errno 后，把错误码与 EDOM 比较；还要结合返回值和浮点异常机制判断。", "EDOM", ["errno = EDOM;", "if (errno != EDOM) return 1;", "errno = 0;"], ["具体数字值由实现决定。", "数学错误不一定都通过 errno 报告。", "哨兵结果必须结合错误状态解释。"], ["errno-object", "sqrt-domain-error"]),
    E("erange-macro", "ERANGE", ["范围错误"], "表示结果上溢、下溢等范围问题。", ["errno.h"], "文本转换或数学函数报告范围失败时比较 ERANGE，再结合返回的饱和值或零值决定拒绝、钳制或继续。", "ERANGE", ["errno = ERANGE;", "int failed = errno == ERANGE;", "errno = 0;", "if (!failed) return 1;"], ["同一宏可表示上溢或下溢。", "调用前不清零可能误读旧状态。", "精确触发条件取决于具体函数契约。"], ["errno-object", "strtol-function"]),

    // signal.h
    E("signal-function", "signal", ["安装信号处理器"], "设置处理函数、默认动作或忽略动作。", ["signal.h"], "用 signal 安装最小可移植处置并检查 SIG_ERR；处理器只能执行极有限操作，通常只更新 volatile sig_atomic_t 标志。", "void (*signal(int sig, void (*func)(int)))(int);", ["void (*old_handler)(int) = signal(SIGINT, handle_signal);", "if (old_handler == SIG_ERR) return 1;"], ["复杂语义依赖宿主操作系统。", "处理器内不能安全调用大多数库函数。", "并发程序还要评估进程级影响。"], ["raise-function", "sigint-macro"], "static volatile sig_atomic_t seen = 0;\nstatic void handle_signal(int number) { seen = number; }"),
    E("raise-function", "raise", ["发送信号"], "向当前程序产生指定信号。", ["signal.h"], "测试既有信号处置或从内部请求同类处理时调用 raise，并检查非零失败值；默认终止信号可能不会返回。", "int raise(int sig);", ["if (signal(SIGINT, SIG_IGN) == SIG_ERR) return 1;", "if (raise(SIGINT) != 0) return 1;"], ["成功时返回零而非信号编号。", "默认动作可能终止当前程序。", "临时忽略后真实程序应恢复处置。"], ["signal-function", "sigint-macro"]),
    E("sigint-macro", "SIGINT", ["交互中断信号"], "表示交互式中断条件的标准信号。", ["signal.h"], "响应用户中断时把 SIGINT 交给 signal；处理器只记录退出请求，再由正常控制流安全清理资源。", "SIGINT", ["int number = SIGINT;", "if (number <= 0) return 1;"], ["具体整数编号由实现决定。", "并非所有环境都有交互终端。", "复杂清理不能直接放进处理器。"], ["signal-function"]),
    E("signal-default-ignore", "SIG_DFL / SIG_IGN", ["默认或忽略信号"], "指定信号采用默认动作或直接忽略。", ["signal.h"], "临时忽略信号时把 SIG_IGN 传给 signal，并保存旧处置用于恢复；SIG_DFL 用来明确恢复实现默认动作。", "signal(sig, SIG_DFL); signal(sig, SIG_IGN);", ["void (*previous)(int) = signal(SIGINT, SIG_IGN);", "if (previous == SIG_ERR) return 1;", "if (signal(SIGINT, previous) == SIG_ERR) return 1;"], ["特殊宏不能当普通函数调用。", "部分信号可能不允许忽略。", "处置变化会影响进程其他代码。"], ["signal-function"]),

    // setjmp.h
    E("setjmp-macro", "setjmp", ["保存跳转环境"], "保存非局部跳转所需的调用环境。", ["setjmp.h"], "只有底层恢复确实无法逐层返回错误时才考虑 setjmp，并在零与非零返回分支中明确资源所有权。", "int setjmp(jmp_buf env);", ["jmp_buf environment;", "int result = setjmp(environment);", "if (result != 0) return 1;"], ["它是受使用位置限制的宏。", "所属函数返回后环境立即失效。", "文件和锁状态不会自动保存。"], ["longjmp-function"]),
    E("longjmp-function", "longjmp", ["非局部跳转"], "恢复 setjmp 环境并使其再次返回。", ["setjmp.h"], "从深层调用返回既定恢复点时可用 longjmp，但必须先处理资源；跳转期间修改的自动局部变量需要 volatile。", "void longjmp(jmp_buf env, int value);", ["int result = setjmp(environment);", "if (result == 0) longjmp(environment, 7);", "if (result != 7) return 1;"], ["参数零会让恢复结果改为一。", "普通已修改局部量可能变成不确定。", "跳转会绕过正常清理代码。"], ["setjmp-macro"], "static jmp_buf environment;"),

    // locale.h
    E("setlocale-function", "setlocale", ["设置区域环境"], "查询或修改程序的 C locale。", ["locale.h"], "需要按用户区域分类、排序或格式化时调用 setlocale；NULL 查询当前设置，空字符串请求环境默认，并检查失败返回。", "char *setlocale(int category, const char *locale);", ["char *current = setlocale(LC_ALL, NULL);", "if (current == NULL) return 1;"], ["程序启动时默认采用 C locale。", "修改通常影响进程级库行为。", "返回内部字符串不宜长期保存。"], ["localeconv-function"]),
    E("localeconv-function", "localeconv", ["区域数字格式"], "返回当前数字与货币格式约定。", ["locale.h"], "读取小数点、千位分隔或货币信息时调用 localeconv，并只读访问 struct lconv；locale 改变后要重新取得。", "struct lconv *localeconv(void);", ["struct lconv *info = localeconv();", "if (info == NULL || info->decimal_point == NULL) return 1;"], ["返回对象由库管理不能释放。", "字段内容取决于实现与当前类别。", "setlocale 后旧字段指针可能失效。"], ["setlocale-function"]),

  <script data-source="data/entries/90-pitfalls.js">
(function () {
  "use strict";

  const P = (headers, body, before = []) => [
    ...headers.map((h) => `#include <${h}>`), ...(headers.length ? [""] : []),

    "uninitialized-variable": "这个坑发生在局部变量还没有得到初值时就读取它，例如先做 `value += 5`，却从未给 value 赋值。运行时可能看到每次不同的“垃圾值”、错误分支或看似偶尔正常的结果；某些读取甚至属于未定义行为，即 C 标准不保证会发生什么。危险之处是调试版本碰巧为零会掩盖问题，换编译器或优化级别就可能暴露。",
    "array-bounds": "这个坑发生在下标小于 0、等于或超过数组长度时仍去读写元素，常见原因是循环写成 `i <= length`。运行时可能立刻崩溃，也可能照常跑完却读到垃圾数据、改坏相邻变量或留下安全漏洞；这属于未定义行为，没有“只多访问一格也没事”的保证。所有外部下标和每一维边界都必须在访问前检查。",
    "dangling-pointer": "这个坑发生在对象已经释放或离开作用域后，程序仍保存并使用原来的地址；这个地址像过期门牌，已经不再代表那个对象。运行时可能暂时读到旧值，也可能被新数据覆盖、崩溃或悄悄破坏内存，表现往往随时机变化。释放后把拥有者指针置空只能防住这一份变量，其他指向同一对象的别名仍然悬空。",
    "memory-leak": "这个坑发生在 malloc 等分配出的内存还没 free，程序却覆盖或丢失了最后一个指向它的地址，于是那块空间再也无法回收。短时间运行可能看不出异常，长期进程会持续占用更多内存，最终变慢、触发分配失败或被系统终止。危险在于错误返回和提前退出路径很容易漏掉清理，所以每次成功分配都要有明确所有者和对应释放路径。",
    "integer-division": "这个坑发生在两个整数使用 `/` 时误以为会保留小数；C 会先计算整数商并向零截断，所以 `1 / 2` 得到 0，之后再存入 double 也只是 0.0。程序通常不会报错，却会悄悄算错比例、平均值或坐标，负数结果也不是向负无穷取整。需要小数时必须在除法前转换至少一个操作数，并在运算前检查分母不为零。",
    "format-mismatch": "这个坑发生在 printf、scanf 等函数的格式说明与实际参数类型不对应，例如拿 `%d` 读取 long，或给 scanf 的 `%f` 传 double 指针。运行时可能打印乱码、读写错误字节、破坏附近内存，甚至崩溃；因为可变参数本身不携带足够类型信息，这通常属于未定义行为。危险还包括外部输入被当成格式串后可读取或写入意外内存。",
    "operator-precedence": "这个坑发生在一条表达式混合多种运算符，却凭直觉猜测分组，例如把 `a + b * c` 当成 `(a + b) * c`。运行时会稳定地产生另一套合法结果，因此往往没有告警或崩溃，只是条件、掩码或计算结果悄悄出错。优先级只决定怎样分组，并不决定各部分先算谁；关键组合应写显式括号表达真实意图。",
    "signed-unsigned-comparison": "这个坑发生在负的有符号整数与无符号长度直接比较；按通常算术转换，负数可能先变成一个很大的无符号数。运行时会看到 `-1 < 3U` 竟然为假，范围检查被绕过，随后又可能拿错误下标访问内存。危险在于代码表面很自然且跨类型变化后才触发；应先单独排除负值，再安全转换，或从源头统一类型。",
    "off-by-one": "这个坑发生在把“元素个数”“最后一个下标”和“尾后位置”混为一谈，只多算或少算一格。运行时可能漏处理最后一个元素，也可能访问数组末尾之外；字符串还可能少留结尾空字符的位置，导致后续函数继续越界读取。它危险在于普通非空输入常看似正常，空数组、单元素和最大容量这些边界才会暴露问题。",
    "switch-fallthrough": "这个坑发生在 switch 的某个 case 做完后漏写 break 或 return，于是控制流继续执行下一个 case。运行时会看到本应互斥的多个分支连续生效，后一个分支可能覆盖前一个结果、重复释放资源或发出多次操作。C 允许这种贯穿，因此编译器未必拒绝；确实需要共享后续逻辑时必须清楚标注，否则每个分支都应显式结束。",

    "sizeof-pointer-vs-array": "这个坑发生在数组传给函数或赋给指针后，仍用 `sizeof pointer / sizeof pointer[0]` 猜元素数。此时 sizeof 得到的是指针对象本身的字节数，不是原数组容量；运行时可能得到 1、2 或另一个碰巧合理的数，随后漏处理元素或越界。裸指针不携带长度，数组大小只能在数组对象仍可见处计算，再与指针一起显式传递。",
    "modify-string-literal": "这个坑发生在让指针指向 `\"text\"` 这样的字符串字面量后尝试改写字符。字面量常放在只读内存，运行时可能立刻崩溃；即使某次似乎改成功，也属于未定义行为，而且相同字面量还可能共享存储，后果无法依赖。需要修改时应创建 `char text[]` 数组副本，只读引用则用 `const char *` 让误写尽早被编译器发现。",
    "scanf-width": "这个坑发生在用 scanf 的 `%s` 读取单词，却没有在格式串中限制最大字段宽度。输入比目标数组长时，函数会越过数组继续写，运行时可能破坏别的变量、崩溃或形成可利用漏洞；输入正常时又完全看不出问题。宽度必须等于容量减一，为自动追加的结尾空字符留一格，并且仍要检查成功赋值的项目数。",
    "gets-danger": "这个坑来自 gets 的接口根本不接收目标数组容量，因此它无法知道何时停止写入。只要用户输入比缓冲区长，运行时就会越界覆盖内存，可能崩溃、篡改控制数据或形成严重安全漏洞；把数组改大只能推迟问题，不能消除它。C11 已删除 gets，任何新旧代码都应改用带容量的 fgets 并检查结果。",
    "double-free": "这个坑发生在同一块动态内存被 free 两次，或把数组内部地址、栈地址等并非分配函数返回的起始地址交给 free。运行时可能立即报 `double free` 并终止，也可能损坏内存分配器状态，直到很久以后才在无关位置崩溃；行为未定义。必须明确唯一所有者和所有权转移规则，确保每次成功分配只配对一次释放。",
    "return-local-address": "这个坑发生在函数返回自动局部变量的地址；函数一结束，该对象的生存期也结束，返回指针立刻变成悬空指针。调用者可能暂时读到旧值，但下一次函数调用或栈使用就会覆盖它，出现随机数据或崩溃。危险在于简单测试常碰巧成功；小对象应按值返回，其他结果应写入调用者对象或使用所有权清晰的动态内存。",
    "uninitialized-pointer": "这个坑发生在指针变量尚未设为有效地址或 NULL 时，就拿它比较、解引用或交给 free。它含有不确定内容，运行时可能指向任意位置，造成随机崩溃、读写无关数据或破坏分配器；打印这个值本身也不是可靠诊断。指针应在声明时初始化，并只在分配或查找明确成功后解引用，结构体里的指针成员也不能遗漏。",
    "floating-accumulation": "这个坑发生在大量重复浮点加法时，每一步都把精确结果舍入到有限二进制位，微小误差会逐渐累积。运行时可能看到十次加 0.1 不精确等于 1.0，而且改变求和顺序就改变末位；大数先加入还可能把后续小量完全“吞掉”。直接相等测试会不稳定，重要计算应使用误差预算、更高精度或补偿求和等方法。",
    "macro-parentheses": "这个坑发生在函数式宏的参数或整个替换式没有括号，例如 `SQUARE(a+b)` 被文本展开成 `a+b*a+b`，运算符重新分组后结果错误。运行时通常只看到某些调用算错，没有真正的函数边界可供调试；即使补齐括号，`SQUARE(i++)` 仍会让参数被求值两次。简单宏要完整加括号，涉及重复求值时应改成 inline 函数。",

  <script data-source="app.js">
(function () {
  "use strict";

  var THEME_STORAGE_KEY = "csyntax.theme.v2";
  var LEGACY_THEME_STORAGE_KEY = "csyntax.theme";
  var THEME_ORDER = ["light", "blue", "dark"];

  function isSupportedTheme(value) {
    return THEME_ORDER.indexOf(value) !== -1;
  }

  function getThemeStorage(scope) {
    try { return scope && scope.localStorage ? scope.localStorage : null; }
    catch (error) { return null; }
  }

  function readStoredTheme(storage) {
    if (!storage) return "";
    try {
      var value = storage.getItem(THEME_STORAGE_KEY);
      if (isSupportedTheme(value)) {
        if (storage.getItem(LEGACY_THEME_STORAGE_KEY) !== null) storage.removeItem(LEGACY_THEME_STORAGE_KEY);
        return value;
      }
      if (value !== null) storage.removeItem(THEME_STORAGE_KEY);
      var legacyValue = storage.getItem(LEGACY_THEME_STORAGE_KEY);
      if (legacyValue === null) return "";
      var migratedTheme = legacyValue === "dark" ? "blue" : (legacyValue === "light" ? "light" : "");
      if (migratedTheme) storage.setItem(THEME_STORAGE_KEY, migratedTheme);
      storage.removeItem(LEGACY_THEME_STORAGE_KEY);
      return migratedTheme;
    } catch (error) { /* 存储被禁用时仍允许本次页面切换。 */ }
    return "";
  }

  function applyTheme(theme, root) {
    if (!root) return;
    var selectedTheme = isSupportedTheme(theme) ? theme : "blue";
    root.setAttribute("data-theme", selectedTheme);
    if (root.style && typeof root.style.setProperty === "function") {
      root.style.setProperty("--theme-index", String(THEME_ORDER.indexOf(selectedTheme)));
    }
  }

  function initializeTheme(root, storage) {
    var theme = readStoredTheme(storage) || "blue";
    applyTheme(theme, root);
    return theme;
  }

  function effectiveTheme(root) {
    var explicitTheme = root && root.getAttribute("data-theme");
    if (isSupportedTheme(explicitTheme)) return explicitTheme;
    return "blue";
  }

  function updateThemeSlider(slider, theme) {
    if (!slider) return;
    var selectedTheme = isSupportedTheme(theme) ? theme : "blue";
    var buttons = Array.prototype.slice.call(slider.querySelectorAll('[role="radio"][data-theme-value]'));
    buttons.forEach(function (button) {
      var checked = button.getAttribute("data-theme-value") === selectedTheme;
      button.setAttribute("aria-checked", checked ? "true" : "false");
      button.setAttribute("tabindex", checked ? "0" : "-1");
    });
    if (slider.style && typeof slider.style.setProperty === "function") {
      slider.style.setProperty("--theme-index", String(THEME_ORDER.indexOf(selectedTheme)));
    }
  }

  function showToast(message) {
    toast.textContent = message;

    toastTimer = setTimeout(function () { toast.classList.remove("is-visible"); }, 1300);

  function legacyCopy(text) {
    var area = document.createElement("textarea");
    area.value = text;
    area.setAttribute("readonly", "");
    area.style.position = "fixed";
    area.style.opacity = "0";
    document.body.appendChild(area);
    area.select();
    var copied = false;
    try { copied = document.execCommand("copy"); } catch (error) { copied = false; }
    document.body.removeChild(area);
    return copied;
  }

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        showToast("已复制");
      }).catch(function () {
        showToast(legacyCopy(text) ? "已复制" : "复制失败，请手动复制");
      });
    } else {
      showToast(legacyCopy(text) ? "已复制" : "复制失败，请手动复制");
    }
  }

  function codeBlock(text, query) {
    var wrap = createElement("div", "code-wrap");

    var code = document.createElement("code");
    appendHighlightedText(code, text, query);
    pre.appendChild(code);
    var button = createElement("button", "copy-button", "复制");
    button.type = "button";

  function finishEntryNavigation(options) {
    options = options || {};
    if (entryNavigationFrame) window.cancelAnimationFrame(entryNavigationFrame);
    entryNavigationFrame = window.requestAnimationFrame(function () {
      entryNavigationFrame = 0;
      var selected = resultList.querySelector(".result-item.is-selected");
      if (selected) {
        var selectedRect = selected.getBoundingClientRect();
        var listRect = resultList.getBoundingClientRect();
        var scrollDelta = selectedRect.top < listRect.top
          ? selectedRect.top - listRect.top
          : (selectedRect.bottom > listRect.bottom ? selectedRect.bottom - listRect.bottom : 0);
        if (scrollDelta) {
          resultList.scrollTo({ top: resultList.scrollTop + scrollDelta, behavior: "auto" });
        }
      }

      var rect = detailPanel.getBoundingClientRect();
      if (options.panelToTop === true || rect.top > window.innerHeight * 0.25) {
        detailPanel.scrollIntoView({ block: "start", behavior: "auto" });
      }

      detailPanel.classList.add("is-flash");
      window.clearTimeout(detailFlashTimer);
      detailFlashTimer = window.setTimeout(function () {
        detailPanel.classList.remove("is-flash");
      }, 1000);
    });
  }

  function renderEntryAndFinish(entry, options) {
    if (!entry) return;
    renderList();
    renderDetail(entry);
    finishEntryNavigation(options);

    button.setAttribute("aria-expanded", "false");
    button.setAttribute("aria-controls", id);
    panel.id = id;
    panel.hidden = true;
    button.addEventListener("click", function () {
      var opening = panel.hidden;
      panel.hidden = !opening;

  function generatedExerciseFollowUp(exercise, text) {
    var requirements = Array.isArray(exercise.requirements) ? exercise.requirements : [];
    return "我想围绕下面这批新题继续提问。请先结合当前练习与生成结果理解上下文。\n"
      + "【当前练习】" + String(exercise.title || "") + "\n"
      + "【题目】" + String(exercise.prompt || "") + "\n"
      + "【要求】\n" + requirements.map(function (requirement, index) {
        return (index + 1) + ". " + requirement;
      }).join("\n") + "\n"
      + "【生成结果】\n" + String(text || "");

  function createExerciseGenerate(exercise) {
    var cached = exerciseGenerations.get(exercise.id);
    if (!cached) {
      cached = { count: 3, note: "", status: "idle", text: "", error: "" };
      exerciseGenerations.set(exercise.id, cached);
    }

    var block = createElement("div", "exercise-generate");
    block.appendChild(createElement("h5", "exercise-subtitle", "让 AI 再出几道同类题"));
    var controls = createElement("div", "exercise-generate-controls");
    var countLabel = createElement("label", "exercise-generate-count");
    countLabel.appendChild(document.createTextNode("题量 "));
    var countSelect = document.createElement("select");
    countSelect.setAttribute("aria-label", "生成题量");
    [1, 3, 5].forEach(function (amount) {
      var option = document.createElement("option");
      option.value = String(amount);
      option.textContent = amount + " 道";
      countSelect.appendChild(option);
    });
    countSelect.value = String(cached.count);
    countLabel.appendChild(countSelect);
    controls.appendChild(countLabel);

    var noteInput = document.createElement("input");
    noteInput.type = "text";
    noteInput.className = "exercise-generate-note";
    noteInput.placeholder = "想重点练什么？例如：只练指针、难度再高一点";
    noteInput.value = cached.note;
    controls.appendChild(noteInput);

    var generateButton = createElement("button", "exercise-generate-button", "生成新题目");
    generateButton.type = "button";
    controls.appendChild(generateButton);
    block.appendChild(controls);

    var output = createElement("div", "exercise-generate-output");
    block.appendChild(output);

    function renderOutput() {
      output.replaceChildren();
      generateButton.disabled = cached.status === "loading";
      output.hidden = cached.status === "idle";
      if (cached.status === "idle") return;
      if (cached.status === "loading") {
        output.appendChild(createElement("p", "exercise-generate-status", "正在出题…"));
        return;
      }
      if (cached.status === "error") {
        output.appendChild(createElement("p", "exercise-generate-error", cached.error));
        var retryButton = createElement("button", "exercise-generate-action", "重试");
        retryButton.type = "button";
        retryButton.addEventListener("click", startGeneration);
        output.appendChild(retryButton);
        return;
      }

      output.appendChild(createElement("pre", "exercise-generate-text", cached.text));
      var actions = createElement("div", "exercise-generate-actions");
      var copyButton = createElement("button", "exercise-generate-action", "复制");
      copyButton.type = "button";
      copyButton.addEventListener("click", function () { copyText(cached.text); });
      actions.appendChild(copyButton);
      var againButton = createElement("button", "exercise-generate-action", "再来一批");
      againButton.type = "button";
      againButton.addEventListener("click", startGeneration);
      actions.appendChild(againButton);
      var continueButton = createElement("button", "exercise-generate-action", "在对话里继续问");
      continueButton.type = "button";
      continueButton.addEventListener("click", function () {
        if (!window.C_SYNTAX_CHAT || typeof window.C_SYNTAX_CHAT.send !== "function") {
          showToast("DeepSeek 模块尚未就绪");
          return;
        }
        if (typeof window.C_SYNTAX_CHAT.open === "function") window.C_SYNTAX_CHAT.open();
        window.C_SYNTAX_CHAT.send(generatedExerciseFollowUp(exercise, cached.text));
      });
      actions.appendChild(continueButton);
      output.appendChild(actions);
    }

    function refreshLatestOutput() {
      var render = exerciseGenerationViews.get(exercise.id);
      if (render) render();
    }

    function startGeneration() {
      cached.count = Number(countSelect.value) || 3;
      cached.note = noteInput.value.trim();
      cached.status = "loading";
      cached.error = "";
      refreshLatestOutput();
      if (!window.C_SYNTAX_CHAT || typeof window.C_SYNTAX_CHAT.generateExercises !== "function") {
        cached.status = "error";
        cached.error = "DeepSeek 模块尚未就绪，请稍后重试。";
        refreshLatestOutput();
        return;
      }
      window.C_SYNTAX_CHAT.generateExercises({
        exercise: exercise,
        count: cached.count,
        note: cached.note,
        onStart: function () {
          cached.status = "loading";
          refreshLatestOutput();
        },
        onDone: function (text) {
          cached.status = "done";
          cached.text = String(text || "");
          cached.error = "";
          refreshLatestOutput();
        },
        onError: function (message) {
          cached.status = "error";
          cached.error = String(message || "生成失败，请稍后重试。");
          refreshLatestOutput();
        }
      });
    }

    countSelect.addEventListener("change", function () {
      cached.count = Number(countSelect.value) || 3;
    });
    noteInput.addEventListener("input", function () { cached.note = noteInput.value; });
    generateButton.addEventListener("click", startGeneration);
    exerciseGenerationViews.set(exercise.id, renderOutput);
    renderOutput();
    return block;
  }

          saveExerciseDraft(exercise.id, reviewInput.value);
        });

        reviewButton.type = "button";

          }
          if (!window.C_SYNTAX_CHAT || typeof window.C_SYNTAX_CHAT.reviewCode !== "function") {

  function applyFilters() {
    var query = searchInput.value.trim();
    var filterResult = filterEntriesWithMode(entries, query, categorySelect.value, headerSelect.value);
    filtered = query ? filterResult.entries : sortEntriesByLearningPath(filterResult.entries, learningStages);
    selectedIndex = filtered.length ? 0 : -1;
    resultCount.textContent = resultCountText(
      filtered.length,
      entries.length,
      Boolean(query),
      categorySelect.value !== ALL_CATEGORY || headerSelect.value !== ALL_HEADER,
      filterResult.exampleFallback && filtered.length > 0
    );
    emptyState.hidden = filtered.length !== 0;
    resultList.hidden = filtered.length === 0;
    if (!filtered.length) {
      var label = searchInput.value.trim() || (headerSelect.value !== ALL_HEADER ? headerSelect.value : categorySelect.value);
      emptyMessage.textContent = "未找到与「" + label + "」匹配的语法条目。";
      openedId = "";
    } else {
      renderDetail(filtered[0]);
    }
    renderList();
  }

  function moveSelection(delta) {
    if (!filtered.length) return;
    selectedIndex = (selectedIndex + delta + filtered.length) % filtered.length;
    renderList();
    var selected = resultList.children[selectedIndex];
    if (selected) selected.scrollIntoView({ block: "nearest" });
  }

  searchInput.addEventListener("input", applyFilters);
  categorySelect.addEventListener("change", applyFilters);
  headerSelect.addEventListener("change", applyFilters);
  window.addEventListener("csyntax:api-key-changed", function () {
    var entry = entries.find(function (item) { return item.id === openedId; });
    if (entry) renderDetail(entry);
  });
  window.addEventListener("storage", function (event) {
    if (event.key !== "csyntax.deepseek.apiKey") return;
    var entry = entries.find(function (item) { return item.id === openedId; });
    if (entry) renderDetail(entry);
  });
  clearSearch.addEventListener("click", function () {
    searchInput.value = "";
    categorySelect.value = ALL_CATEGORY;
    headerSelect.value = ALL_HEADER;
    searchInput.focus();
    applyFilters();
  });

  document.addEventListener("keydown", function (event) {
    var tagName = event.target && event.target.tagName;
    var typing = isTypingTarget(event.target);
    var searchShortcut = event.key.toLocaleLowerCase() === "k" && (event.ctrlKey || event.metaKey);
    if (typing && !searchShortcut) return;
    if ((event.key === "/" && !typing) || (event.key.toLocaleLowerCase() === "k" && (event.ctrlKey || event.metaKey))) {
      event.preventDefault();
      searchInput.focus();
      searchInput.select();
      return;
    }
    if (event.key === "ArrowDown" || event.key === "ArrowUp") {
      if (tagName === "SELECT") return;
      event.preventDefault();
      moveSelection(event.key === "ArrowDown" ? 1 : -1);
      return;
    }
    if (event.key === "Enter" && filtered[selectedIndex]) {
      event.preventDefault();
      renderEntryAndFinish(filtered[selectedIndex]);
      return;
    }
    if (event.key === "Escape") {
      if (searchInput.value || categorySelect.value !== ALL_CATEGORY || headerSelect.value !== ALL_HEADER) {
        searchInput.value = "";
        categorySelect.value = ALL_CATEGORY;
        headerSelect.value = ALL_HEADER;

    var model = storedModel();
    var savedEffort = readStorage(CHAT_CONFIG.effortStorageKey);
    var effort = CHAT_CONFIG.reasoningChoices.indexOf(savedEffort) !== -1 ? savedEffort : CHAT_CONFIG.reasoningEffort;

    function once(options) {
      var opts = options || {};
      var controller = typeof AbortController !== "undefined" ? new AbortController() : null;
      state.controller = controller;
      var timer = setTimeout(function () { if (controller) controller.abort(); }, CHAT_CONFIG.timeoutMs);
      return fetch(CHAT_CONFIG.endpoint, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + key },
        body: JSON.stringify(buildPayload(question, history || [], {
          model: opts.model || model,
          reasoningEffort: effort,
          includeReasoning: opts.includeReasoning !== false,
          mode: requestOptions.mode,
          count: requestOptions.count
        })),
        signal: controller ? controller.signal : undefined
      }).then(function (response) {
        return response.text().then(function (text) { return { ok: response.ok, status: response.status, text: text }; });
      }).finally(function () { clearTimeout(timer); });
    }

    // 服务端抱怨模型名的两种情况：400 里带 "model"、或 404 Model Not Exist
    function isModelRejection(result) {
      if (result.ok) return false;
      if (result.status === 404 && /model/i.test(result.text)) return true;
      return result.status === 400 && /model/i.test(result.text) && !/reasoning/i.test(result.text);
    }

    return once({}).then(function (result) {
      if (isModelRejection(result) && model !== CHAT_CONFIG.model) {
        // 旧版本可能把不支持的模型名留在本地；这里自动改用官方 id 重试一次
        writeStorage(CHAT_CONFIG.modelStorageKey, null);
        return once({ model: CHAT_CONFIG.model }).then(function (retry) {
          retry.notice = "检测到不被支持的模型名，已自动改用 " + CHAT_CONFIG.model + " 重试。";
          return retry;
        });
      }
      if (!result.ok && result.status === 400 && /reasoning/i.test(result.text)) {
        return once({ includeReasoning: false }).then(function (retry) {
          retry.notice = "该模型不接受推理强度参数，已按默认强度重试。";
          return retry;
        });
      }
      return result;
    }).then(function (result) {
      if (!result.ok) {
        var error = new Error(mapError(result.status, result.text));
        error.status = result.status;
        throw error;
      }
      var data;
      try { data = JSON.parse(result.text); } catch (error) { throw new Error("返回内容无法解析：" + sanitize(result.text).slice(0, 200)); }
      if (!data || !data.choices || !data.choices.length || !data.choices[0].message) {
        throw new Error("返回结构异常：" + sanitize(result.text).slice(0, 200));
      }
      return { text: data.choices[0].message.content || "(空回复)", notice: result.notice, usage: data.usage };
    });
  }

  function send(question, options) {
    if (state.busy) return Promise.resolve();
    var providedQuestion = typeof question === "string";
    var message = providedQuestion ? question.trim() : els.input.value.trim();
    var requestOptions = options || {};
    if (!message) return Promise.resolve();
    if (!readStorage(CHAT_CONFIG.storageKey)) { refreshKeyUi(); return Promise.resolve(); }
    var previousHistory = state.history.slice();
    if (!providedQuestion) els.input.value = "";
    state.history.push({ role: "user", content: message });
    addBubble("user", message);
    saveHistory();
    state.busy = true;
    els.send.disabled = true;
    els.stop.hidden = false;
    var pending = addBubble("assistant", "思考中…");
    return requestDeepSeek(message, requestOptions, previousHistory).then(function (result) {
      pending.remove();
      addBubble("assistant", result.text);
      if (result.notice) addBubble("system", result.notice);
      state.history.push({ role: "assistant", content: result.text });
      saveHistory();
    }).catch(function (error) {
      pending.remove();
      addBubble("system", readableRequestError(error));
    }).finally(function () {
      state.busy = false;
      state.controller = null;
      els.send.disabled = false;
      els.stop.hidden = true;
      els.input.focus();
    });
  }

  function reviewCode(payload) {
    var item = payload || {};
    var exercise = item.exercise || {};
    var code = String(item.code || "").trim();
    if (!code || !readStorage(CHAT_CONFIG.storageKey) || typeof document === "undefined") {
      return Promise.resolve(false);
    }
    els.launcher.click();
    return send(buildReviewQuestion(exercise, code), { mode: "review", exercise: exercise });
  }

  function readableRequestError(error) {
    if (error && error.name === "AbortError") return "本次请求已停止。";
    if (error && error.message === "NO_KEY") return "请先填入 API Key。";
    if (error && (error.name === "TypeError" || /Failed to fetch|NetworkError|Load failed/i.test(String(error.message)))) {
      return "连不上 DeepSeek，请检查网络或代理（本词典的离线查询不受影响）。";
    }
    return sanitize((error && error.message) || "未知错误");
  }

  function generateExercises(payload) {
    var options = payload || {};
    var exercise = options.exercise || {};
    var count = normalizeGenerateCount(options.count);
    var onStart = typeof options.onStart === "function" ? options.onStart : function () {};
    var onDone = typeof options.onDone === "function" ? options.onDone : function () {};
    var onError = typeof options.onError === "function" ? options.onError : function () {};
    if (!readStorage(CHAT_CONFIG.storageKey)) {
      onError("请先填入 API Key。");
      return Promise.resolve(false);
    }
    onStart();
    return requestDeepSeek(buildGenerateQuestion(exercise, count, options.note), {
      mode: "generate",
      count: count
    }, []).then(function (result) {
      onDone(result.text, result);
      return result.text;
    }).catch(function (error) {
      onError(readableRequestError(error), error);
      return false;
    });
  }

  function notifyKeyChanged() {
    if (typeof window.dispatchEvent !== "function" || typeof CustomEvent === "undefined") return;
    window.dispatchEvent(new CustomEvent("csyntax:api-key-changed"));
  }

  // ------------------------------------------------------------------ 事件
  function wire() {
    els.launcher.addEventListener("click", function () {
      els.panel.hidden = false;
      applyStoredPanelSize();
      refreshKeyUi();
      renderHistory();
      if (readStorage(CHAT_CONFIG.storageKey)) els.input.focus();
      else els.keyInput.focus();
    });
    els.close.addEventListener("click", function () {
      if (state.controller) state.controller.abort();
      els.panel.hidden = true;
    });
    els.saveKey.addEventListener("click", function () {
      var value = els.keyInput.value.trim();
      if (!value) { els.keyInput.focus(); return; }
      writeStorage(CHAT_CONFIG.storageKey, value);
      notifyKeyChanged();
      els.keyInput.value = "";
      refreshKeyUi();
      renderHistory();
      addBubble("system", "已在本机保存 Key（只存在这个浏览器的 localStorage 里）。");
      els.input.focus();
    });
    els.clearKey.addEventListener("click", function () {
      writeStorage(CHAT_CONFIG.storageKey, null);
      notifyKeyChanged();
      refreshKeyUi();
      addBubble("system", "已清除本机保存的 Key。");
    });
    els.clearHistory.addEventListener("click", function () {
      state.history = [];
      saveHistory();
      renderHistory();
    });
    els.effortSelect.addEventListener("change", function () { writeStorage(CHAT_CONFIG.effortStorageKey, els.effortSelect.value); });
    els.send.addEventListener("click", function () { send(); });
    els.stop.addEventListener("click", function () { if (state.controller) state.controller.abort(); });
    els.input.addEventListener("keydown", function (event) {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        send();
      }
    });
    window.addEventListener("resize", function () {
      var current = panelSize();
      setPanelSize(current.width, current.height);
    });
    if (typeof ResizeObserver !== "undefined") {
      state.panelObserver = new ResizeObserver(function () { rememberRenderedPanelSize(); });
      state.panelObserver.observe(els.panel);
    }
  }

  // ------------------------------------------------------------- 测试与调试钩子
  window.C_SYNTAX_CHAT = {
    config: CHAT_CONFIG,
    state: state,
    buildSystemPrompt: buildSystemPrompt,
    buildMessages: buildMessages,
    buildPayload: buildPayload,
    buildReviewQuestion: buildReviewQuestion,
    buildGeneratePrompt: buildGeneratePrompt,
    buildGenerateQuestion: buildGenerateQuestion,
    mapError: mapError,
    sanitize: sanitize,
    storedModel: storedModel,
    isStaleModel: isStaleModel,
    maskKey: maskKey,
    send: send,
    reviewCode: reviewCode,
    generateExercises: generateExercises,
    panelSize: panelSize,
    setPanelSize: setPanelSize,
    applyStoredPanelSize: applyStoredPanelSize,
    storage: { read: readStorage, write: writeStorage },
    open: function () { els.launcher.click(); },
    elements: function () { return els; }
  };

  if (typeof document === "undefined") return;
  try {
    buildUi();
    applyStoredPanelSize();
    wire();
    state.history = loadHistory();
    refreshKeyUi();
    renderHistory();
  } catch (error) {
    // 聊天模块出问题时，绝不影响词典本身的离线查询
    if (window.console && console.warn) console.warn("chat 模块初始化失败：", error);
  }
}());
  </script>
</body>
</html>
